<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타일 구 반3D 템플릿</title>
<style>
  :root{--bg:#e6e9ee;--fg:#1f2328;color-scheme:light}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1215;--fg:#e7eaee;color-scheme:dark}}
  html,body{height:100%;margin:0} body{background:var(--bg);color:var(--fg);display:grid;place-items:center;font:13px system-ui,sans-serif}
  .w{width:min(440px,100%)} canvas{width:100%;aspect-ratio:1;display:block}
  label{display:block;margin:4px 0} input[type=range]{width:100%}
  textarea{width:100%;height:70px;font:11px ui-monospace,monospace}
</style>
</head><body>
<div class="w">
  <canvas id="cv"></canvas>
  <label>시점 기울기 <input type="range" id="tilt" min="-90" max="90" value="-32"></label>
  <label>타일 크기(위도°) <input type="range" id="step" min="3" max="15" step="0.5" value="9.5"></label>
  <label>줄눈 두께 <input type="range" id="gap" min="0.02" max="0.4" step="0.01" value="0.14"></label>
  <label>법선 요동(°) <input type="range" id="njit" min="0" max="4" step="0.1" value="1.2"></label>
  <button id="play">정지</button> <button id="exp">SVG 내보내기</button>
  <textarea id="out" readonly></textarea>
</div>
<script>
const $ = id => document.getElementById(id);
const S = 440, C = 220, R = 200;
const PERIOD = 40;
const rad = d => d * Math.PI / 180, clamp = (v, a, b) => Math.min(b, Math.max(a, v)), f2 = n => n.toFixed(2);
const hx = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ===== 재질·조명 (시점 좌표계: x 오른쪽, y 위, z 화면 밖) =====
const COL = { grout:'#d3e3e9', dark:'#5a8696', tile:'#dfe4ea', light:'#eaf7ff' };
const LIGHT = (() => { const v = [0, -1, 0.35], l = Math.hypot(...v); return v.map(x => x / l); })(); // 아래 앞쪽 조명
const REF = { amb:0.30, k:1.15, pw:1.4, rim:0.5, side:[0.5, 0.6, 0.64] };

// ===== 핵심: 구면좌표 → 3D → x축 기울기 → 정사영 =====
const sys = tilt => ({ ct: Math.cos(rad(tilt)), st: Math.sin(rad(tilt)) });
function V(lat, lon, s) {
  const la = rad(lat), lo = rad(lon);
  const x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
  return [x, y * s.ct - z * s.st, y * s.st + z * s.ct];   // 구는 위치 벡터 = 법선
}
const Pj = (lat, lon, s) => { const q = V(lat, lon, s); return [C + R * q[0], C - R * q[1]]; };

const opts = () => ({ tilt:+$('tilt').value, step:+$('step').value, gap:+$('gap').value, njit:+$('njit').value, jit:0.06, seed:11 });

// ===== 타일 배치: 위도 행, 행마다 타일 수 ∝ cos(위도) =====
function buildTiles(o) {
  const rnd = mulberry32(o.seed), rndN = mulberry32(o.seed ^ 0x85ebca6b), tiles = [];
  for (let i = 0; i < Math.ceil(180 / o.step); i++) {
    const lat = -90 + i * o.step, lat2 = Math.min(90, lat + o.step), mid = (lat + lat2) / 2;
    const n = Math.max(4, Math.round(360 * Math.cos(rad(mid)) / o.step));
    const ws = Array.from({ length: n }, () => 1 + (rnd() * 2 - 1) * o.jit), sum = ws.reduce((a, b) => a + b);
    let lon = rnd() * 360 / n;   // 행마다 시작 위치를 흐트러 세로 줄눈이 일직선이 되지 않게
    for (const w of ws) {
      const tw = w * 360 / sum;
      tiles.push({ lat, lat2, mid, lon0: lon, tw, jLat: rndN() * 2 - 1, jLon: rndN() * 2 - 1 });
      lon += tw;
    }
  }
  return tiles;
}

// ===== 반사 → 앞면색·옆면색 =====
function lit(n) {
  const nz = Math.max(0, n[2]);
  const ndl = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
  const b = (REF.amb + REF.k * Math.pow(ndl, REF.pw)) * (0.45 + 0.55 * nz);
  let front;
  if (b < 1) { const e = 1 - nz; front = mix(hx(COL.dark), hx(COL.tile), clamp(b + REF.rim * e * e * e, 0, 1)); } // 프레넬 림
  else front = mix(hx(COL.tile), hx(COL.light), Math.min(1, b - 1));
  const w = clamp((1.2 - b) / 0.4, 0, 1);  // 어두운 쪽 옆면은 밝은 줄눈색, 밝은 쪽 옆면은 그늘
  const side = front.map((v, i) => { const d = v * REF.side[i]; return d + (hx(COL.grout)[i] - d) * w; });
  return { b, w, front, side };
}

let tiles = [], rotDeg = 0, playing = true;

// 보이는 타일의 기하·색 (캔버스/SVG 공통)
function visibleTiles(o) {
  const s = sys(o.tilt), K = 1 - o.gap, out = [];
  for (const t of tiles) {
    const midLon = t.lon0 + t.tw / 2 + rotDeg;
    if (V(t.mid, midLon, s)[2] <= 0) continue;                       // 뒷면 컬링
    const a = t.lon0 + rotDeg, b = a + t.tw;
    const pts = [Pj(t.lat, a, s), Pj(t.lat, b, s), Pj(t.lat2, b, s), Pj(t.lat2, a, s)];
    const cx = pts.reduce((v, p) => v + p[0], 0) / 4, cy = pts.reduce((v, p) => v + p[1], 0) / 4;
    const fx = pts.map(p => [cx + (p[0] - cx) * K, cy + (p[1] - cy) * K]);   // 축소 = 앞면, 틈 = 줄눈/경사면
    const L = lit(V(t.mid + t.jLat * o.njit, midLon + t.jLon * o.njit, s)); // 법선 요동 → 조각마다 다른 반사
    // 은빛 질감: 대각선 그라디언트 (어두운 쪽 → 본색 → 하이라이트)
    const sw = L.w * 0.6, sheen = [[0, L.front.map(v => v * (1 - 0.3 * sw))], [0.5, L.front], [1, L.front.map((v, i) => v + ([244, 251, 255][i] - v) * sw / 2)]];
    out.push({ pts, fx, cx, cy, L, sheen });
  }
  return out;
}
const RIM = [[0.74, 226, 240, 245, 0], [0.896, 226, 240, 245, 0.3], [0.97, 234, 246, 248, 0.8], [1, 238, 247, 249, 0.55]];

const cv = $('cv'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
cv.width = cv.height = S * dpr; ctx.scale(dpr, dpr);

function draw(o) {
  ctx.clearRect(0, 0, S, S);
  ctx.save();
  ctx.beginPath(); ctx.arc(C, C, R, 0, Math.PI * 2); ctx.fillStyle = COL.grout; ctx.fill(); ctx.clip();
  const poly = q => { ctx.beginPath(); q.forEach((p, k) => k ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); };
  const vt = visibleTiles(o);
  for (const { pts, fx, L, sheen } of vt) {
    poly(pts); ctx.fillStyle = css(L.side); ctx.fill();               // 옆면(베벨)
    poly(fx);
    const g = ctx.createLinearGradient(...fx[0], ...fx[2]);
    for (const [t, c] of sheen) g.addColorStop(t, css(c));
    ctx.fillStyle = g; ctx.fill();                                    // 앞면
  }
  // 모서리 하이라이트(윗변 밝게)·그늘(아랫변 어둡게)
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(222,244,248,0.9)'; ctx.beginPath();
  for (const { fx } of vt) { ctx.moveTo(...fx[3]); ctx.lineTo(...fx[2]); } ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath();
  for (const { fx } of vt) { ctx.moveTo(...fx[0]); ctx.lineTo(...fx[1]); } ctx.stroke();
  // 실루엣 림
  const rg = ctx.createRadialGradient(C, C, 0, C, C, R);
  for (const [t, r, g2, b, a] of RIM) rg.addColorStop(t, `rgba(${r},${g2},${b},${a})`);
  ctx.fillStyle = rg; ctx.fillRect(0, 0, S, S);
  ctx.restore();
}

function buildSVG(o) {
  const grads = [], polys = [], tops = [], bots = [];
  const P = q => q.map(p => f2(p[0]) + ',' + f2(p[1])).join(' ');
  for (const { pts, fx, cx, cy, L, sheen } of visibleTiles(o)) {
    const rr = pts.reduce((v, p) => v + Math.hypot(p[0] - cx, p[1] - cy), 0) / 4 || 1;
    const id = 's' + grads.length;
    grads.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f2(fx[0][0])}" y1="${f2(fx[0][1])}" x2="${f2(fx[2][0])}" y2="${f2(fx[2][1])}">` +
      sheen.map(([t, c]) => `<stop offset="${t}" stop-color="${css(c)}"/>`).join('') + `</linearGradient>`);
    // 캔버스의 '바깥 사각형 fill'은 SVG에서 앞면 polygon의 stroke(줄눈 두께)로 대체
    polys.push(`<polygon points="${P(fx)}" fill="url(#${id})" stroke="${css(L.side)}" stroke-width="${f2(Math.max(0.4, o.gap * rr))}"/>`);
    tops.push(`M${f2(fx[3][0])} ${f2(fx[3][1])}L${f2(fx[2][0])} ${f2(fx[2][1])}`);
    bots.push(`M${f2(fx[0][0])} ${f2(fx[0][1])}L${f2(fx[1][0])} ${f2(fx[1][1])}`);
  }
  const rim = `<radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="${C}" cy="${C}" r="${R}">` +
    RIM.map(([t, r, g, b, a]) => `<stop offset="${t}" stop-color="rgb(${r},${g},${b})" stop-opacity="${a}"/>`).join('') + `</radialGradient>`;
  return [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}">`,
    `<defs><clipPath id="ball"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath>${grads.join('')}${rim}</defs>`,
    `<circle cx="${C}" cy="${C}" r="${R}" fill="${COL.grout}"/>`, `<g clip-path="url(#ball)">`, ...polys,
    `<path d="${tops.join('')}" stroke="rgb(222,244,248)" stroke-opacity="0.9" stroke-width="1.2" fill="none"/>`,
    `<path d="${bots.join('')}" stroke="#000" stroke-opacity="0.2" stroke-width="1" fill="none"/>`,
    `<circle cx="${C}" cy="${C}" r="${R}" fill="url(#rim)"/>`, `</g>`, `</svg>`].join('\n');
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  if (playing) { rotDeg = (rotDeg + dt * 360 / PERIOD) % 360; draw(opts()); }
  requestAnimationFrame(loop);
}
['tilt', 'step', 'gap', 'njit'].forEach(id => $(id).addEventListener('input', () => { tiles = buildTiles(opts()); draw(opts()); }));
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '정지' : '재생'; };
$('exp').onclick = () => { $('out').value = buildSVG(opts()); };
tiles = buildTiles(opts()); draw(opts()); requestAnimationFrame(loop);
window.__api = { buildSVG: () => buildSVG(opts()), setRot: d => { rotDeg = d; draw(opts()); } };
</script>
</body></html>
