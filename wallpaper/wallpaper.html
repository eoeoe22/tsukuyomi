<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>月 | Tsukuyomi Wallpaper</title>
    <link rel="icon" href="vendor/assets/icons/icon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="vendor/tsukuyomi.css">
    <link rel="stylesheet" href="wallpaper.css">
</head>

<body>
    <!-- 月: 수면 토리이 장면 (vendor/tsukuyomi.js) -->
    <div class="world" id="worldMoon">
        <div class="world-view">
            <canvas id="scene" aria-hidden="true"></canvas>
            <canvas id="ripple" aria-hidden="true"></canvas>
            <canvas id="fg" aria-hidden="true"></canvas>
        </div>
    </div>
    <!-- 山: 산정 토리이 장면 (vendor/tsukuyomi.mount.js, 산 계열 장면을 처음 고를 때 wallpaper.js가 로드).
         하단 #mountDock은 두지 않는다 (산 엔진은 UI가 없어도 동작, 장면은 WE 옵션으로 선택). -->
    <div class="world" id="worldMount" hidden>
        <div class="world-view">
            <canvas id="mountScene" aria-hidden="true"></canvas>
        </div>
    </div>
    <!-- 地: 역광 지구 장면 (vendor/tsukuyomi.earth.js, 처음 고를 때 로드) -->
    <div class="world" id="worldEarth" hidden>
        <div class="world-view">
            <canvas id="earthScene" aria-hidden="true"></canvas>
        </div>
    </div>
    <!-- 八: 야치요의 방 장면 (vendor/tsukuyomi.room.js + components/, 처음 고를 때 로드) -->
    <div class="world" id="worldRoom" hidden>
        <div class="world-view">
            <canvas id="roomScene" aria-hidden="true"></canvas>
        </div>
    </div>
    <!-- 犬: 뉴스 츠쿠요미 장면 (vendor/tsukuyomi.news.js, 처음 고를 때 로드. .world-view 안에 JS가 레이어를 만든다) -->
    <div class="world" id="worldNews" hidden>
        <div class="world-view"></div>
    </div>

    <!-- 하단 시간대 UI: 코어가 참조하므로 DOM은 유지하고, 표시는 wallpaper.css에서 숨긴다.
         장면 선택은 Wallpaper Engine 옵션(scene)으로 대체한다. btnMirror는 미러볼
         코어(elMirror 참조) 대응용으로 함께 둔다. 버튼 문구·아이콘은 웹(tsukuyomi.html)과 동일(공백/황혼/밤/미러볼). -->
    <div class="dock" aria-hidden="true">
        <section class="panel intro-hidden" id="panel" aria-label="장면 전환">
            <div class="icongroup" id="icongroup" role="group" aria-label="공백 / 황혼 / 밤 / 미러볼 선택">
                <span class="thumb" id="thumb" aria-hidden="true"></span>
                <button type="button" id="btnDay" aria-label="공백" aria-pressed="false" tabindex="-1"><i class="bi bi-cloud-fill"
                        aria-hidden="true"></i></button>
                <button type="button" id="btnDusk" aria-label="황혼" aria-pressed="false" tabindex="-1"><i
                        class="bi bi-cloud-sun-fill" aria-hidden="true"></i></button>
                <button type="button" id="btnNight" class="on" aria-label="밤" aria-pressed="true" tabindex="-1"><i class="bi bi-moon-fill"
                        aria-hidden="true"></i></button>
                <button type="button" id="btnMirror" aria-label="미러볼" aria-pressed="false" tabindex="-1"><i class="bi bi-globe2"
                        aria-hidden="true"></i></button>
            </div>
            <span class="sr-only" id="status" aria-live="polite"></span>
        </section>
    </div>

    <script src="vendor/cloud-live.js"></script>
    <script src="vendor/cloud-overlay.js"></script>
    <script src="vendor/tsukuyomi.js"></script>
    <script src="wallpaper.js"></script>
</body>

</html>
