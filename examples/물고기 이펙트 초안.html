<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>물고기 이펙트</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1f2328;
            --muted: #5d6670;
            --line: #d6dae0;
            --accent: #2f5d8a;
            --stage: #e6e9ee
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #15181c;
                --panel: #1d2126;
                --text: #e7eaee;
                --muted: #9aa3ad;
                --line: #333a42;
                --accent: #7fb0e0;
                --stage: #0f1215
            }
        }

        :root[data-theme="dark"] {
            --bg: #15181c;
            --panel: #1d2126;
            --text: #e7eaee;
            --muted: #9aa3ad;
            --line: #333a42;
            --accent: #7fb0e0;
            --stage: #0f1215
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5
        }

        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 20px 16px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 20px
        }

        @media (max-width:760px) {
            .wrap {
                grid-template-columns: 1fr
            }
        }

        @media (min-width:761px) {
            .stage {
                position: sticky;
                top: 20px;
                align-self: start
            }
        }

        .stage {
            background: var(--stage);
            border-radius: 10px;
            padding: 12px
        }

        .stage canvas {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border-radius: 6px
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        h1 {
            font-size: 17px;
            margin: 0
        }

        h2 {
            font-size: 12px;
            margin: 6px 0 -4px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .02em;
            border-top: 1px solid var(--line);
            padding-top: 10px
        }

        .row label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted)
        }

        .row label b {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent)
        }

        .colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .colors label {
            flex: 1 1 28%;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        input[type=color] {
            width: 100%;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: none;
            padding: 2px
        }

        .seed {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: var(--muted)
        }

        .seed input {
            width: 90px;
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit
        }

        button {
            font: inherit;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
            cursor: pointer
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .btns .wide {
            grid-column: 1 / -1
        }

        .note {
            font-size: 12px;
            color: var(--muted);
            min-height: 1.2em
        }

        textarea {
            width: 100%;
            height: 90px;
            font: 12px ui-monospace, Menlo, monospace;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            padding: 6px;
            resize: vertical
        }
    </style>
</head>


<body>
    <div class="wrap">
        <div class="stage"><canvas id="stage" title="클릭하면 그 자리의 물고기가 흩어지고 반짝이가 터짐"></canvas></div>
        <div class="panel">
            <h1>물고기 이펙트</h1>
            <div class="btns">
                <button id="pStream">프리셋: 흐르는 떼</button>
                <button id="pTank">프리셋: 보케 수조</button>
            </div>

            <h2>개체 · 깊이</h2>
            <div class="row"><label>원경 개체 수 (흐린 보케) <b id="v-nFar"></b></label><input type="range" id="nFar" min="0"
                    max="240" step="1" value="60"></div>
            <div class="row"><label>중경 개체 수 <b id="v-nMid"></b></label><input type="range" id="nMid" min="0" max="160"
                    step="1" value="46"></div>
            <div class="row"><label>근경 개체 수 (선명) <b id="v-nNear"></b></label><input type="range" id="nNear" min="0"
                    max="80" step="1" value="22"></div>
            <div class="row"><label>물고기 크기 (근경 몸길이) <b id="v-size"></b></label><input type="range" id="size" min="16"
                    max="140" step="1" value="62"></div>
            <div class="row"><label>원경 크기 배율 <b id="v-farSz"></b></label><input type="range" id="farSz" min="0.25"
                    max="1.6" step="0.05" value="0.5"></div>
            <div class="row"><label>원경 흐림 <b id="v-farBlur"></b></label><input type="range" id="farBlur" min="0" max="20"
                    step="0.5" value="7"></div>
            <div class="row"><label>원경 밝기 <b id="v-farA"></b></label><input type="range" id="farA" min="0" max="1"
                    step="0.01" value="0.45"></div>
            <div class="row"><label>중경 흐림 <b id="v-midBlur"></b></label><input type="range" id="midBlur" min="0" max="6"
                    step="0.1" value="1.2"></div>

            <h2>형태 · 면 분할</h2>
            <div class="row"><label>몸통 굵기 (높이/길이) <b id="v-aspect"></b></label><input type="range" id="aspect"
                    min="0.14" max="0.45" step="0.01" value="0.25"></div>
            <div class="row"><label>면 분할 — 길이 방향 칸 <b id="v-cols"></b></label><input type="range" id="cols" min="3"
                    max="14" step="1" value="8"></div>
            <div class="row"><label>면 분할 — 높이 방향 칸 <b id="v-rows"></b></label><input type="range" id="rows" min="2"
                    max="7" step="1" value="4"></div>
            <div class="row"><label>격자 정점 흔들림 <b id="v-mjit"></b></label><input type="range" id="mjit" min="0" max="0.5"
                    step="0.01" value="0.32"></div>
            <div class="row"><label>면별 밝기 편차 <b id="v-facet"></b></label><input type="range" id="facet" min="0" max="1"
                    step="0.01" value="0.6"></div>
            <div class="row"><label>격자선 세기 <b id="v-mesh"></b></label><input type="range" id="mesh" min="0" max="1"
                    step="0.01" value="0.62"></div>
            <div class="row"><label>몸통 채움 불투명도 <b id="v-fillA"></b></label><input type="range" id="fillA" min="0.1"
                    max="1" step="0.01" value="0.62"></div>
            <div class="row"><label>면 일렁임 속도 <b id="v-shim"></b></label><input type="range" id="shim" min="0" max="3"
                    step="0.05" value="1.1"></div>

            <h2>빛</h2>
            <div class="row"><label>글로우 세기 <b id="v-glow"></b></label><input type="range" id="glow" min="0" max="1.6"
                    step="0.02" value="0.66"></div>
            <div class="row"><label>글로우 반경 <b id="v-glowR"></b></label><input type="range" id="glowR" min="1" max="30"
                    step="0.5" value="9"></div>
            <div class="row"><label>반짝이 입자 (초당) <b id="v-spark"></b></label><input type="range" id="spark" min="0"
                    max="60" step="1" value="10"></div>
            <div class="row"><label>기포 수 <b id="v-bub"></b></label><input type="range" id="bub" min="0" max="60" step="1"
                    value="8"></div>

            <h2>움직임</h2>
            <div class="row"><label>헤엄 속도 <b id="v-spd"></b></label><input type="range" id="spd" min="0" max="3"
                    step="0.05" value="1.2"></div>
            <div class="row"><label>기본 진행 방향 (0°=오른쪽, 90°=위) <b id="v-dir"></b></label><input type="range" id="dir"
                    min="0" max="359" step="1" value="150"></div>
            <div class="row"><label>소용돌이 세기 (−시계 / +반시계) <b id="v-swirl"></b></label><input type="range" id="swirl"
                    min="-2.5" max="2.5" step="0.05" value="1.1"></div>
            <div class="row"><label>소용돌이 반경 (화면 높이 비) <b id="v-swR"></b></label><input type="range" id="swR"
                    min="0.1" max="1.2" step="0.01" value="0.42"></div>
            <div class="row"><label>난류 (떼 갈라짐) <b id="v-turb"></b></label><input type="range" id="turb" min="0" max="2"
                    step="0.05" value="0.55"></div>
            <div class="row"><label>꼬리 흔들림 <b id="v-wag"></b></label><input type="range" id="wag" min="0" max="0.2"
                    step="0.005" value="0.07"></div>
            <div class="row"><label>잔상 개수 <b id="v-trail"></b></label><input type="range" id="trail" min="0" max="10"
                    step="1" value="4"></div>
            <div class="row"><label>잔상 간격 (프레임) <b id="v-tgap"></b></label><input type="range" id="tgap" min="1"
                    max="6" step="1" value="2"></div>
            <div class="row"><label>잔상 세기 <b id="v-trailA"></b></label><input type="range" id="trailA" min="0" max="1"
                    step="0.01" value="0.3"></div>

            <h2>색</h2>
            <div class="colors">
                <label>분홍<input type="color" id="c0" value="#ff6fd2"></label>
                <label>청록<input type="color" id="c1" value="#5ff0ff"></label>
                <label>노랑<input type="color" id="c2" value="#f2f55e"></label>
                <label>살구<input type="color" id="c3" value="#ffb070"></label>
                <label>하늘<input type="color" id="c4" value="#7fb4ff"></label>
                <label>연두<input type="color" id="c5" value="#b9ff72"></label>
                <label>배경 위<input type="color" id="bg0" value="#06070d"></label>
                <label>배경 아래<input type="color" id="bg1" value="#0c1422"></label>
            </div>
            <div class="seed">시드 <input type="number" id="seed" value="7"></div>
            <div class="btns">
                <button class="primary" id="reroll">다시 생성</button>
                <button id="copy">SVG 복사</button>
                <button id="play" class="wide">일시 정지</button>
            </div>
            <div class="note" id="note">무대를 클릭하면 그 자리의 물고기가 흩어집니다.</div>
            <textarea id="code" readonly aria-label="SVG 코드"></textarea>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

        const W = 640, H = 360;           // 무대 논리 크기 (16:9)
        const NTPL = 8;                   // 면 분할 템플릿 변형 수 (개체마다 하나씩 배정)
        const LAYER_SZ = [1, 0.72, 1];    // 원경은 farSz 배율로 별도 지정
        const LAYER_SPD = [0.5, 0.78, 1];
        const BUCKET = [0, 0.16, 0.34, 0.6]; // 면 밝기 단계(흰빛 덧칠 불투명도, facet 배율 전)
        const rad = d => d * Math.PI / 180;
        const f1 = n => (Math.round(n * 10) / 10).toString();
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        function hxRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
        const mixW = (c, k) => c.map(v => v + (255 - v) * k);
        const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
        const hex = c => "#" + c.map(v => (v | 0).toString(16).padStart(2, "0")).join("");

        const IDS = ["nFar", "nMid", "nNear", "size", "farSz", "farBlur", "farA", "midBlur", "aspect", "cols", "rows", "mjit", "facet", "mesh", "fillA", "shim",
            "glow", "glowR", "spark", "bub", "spd", "dir", "swirl", "swR", "turb", "wag", "trail", "tgap", "trailA"];
        const COLS = ["c0", "c1", "c2", "c3", "c4", "c5", "bg0", "bg1"];
        const REBUILD_TPL = new Set(["aspect", "cols", "rows", "mjit", "seed"]);
        const REBUILD_POP = new Set(["nFar", "nMid", "nNear", "seed", "bub"]);
        function opts() {
            const o = {};
            for (const id of IDS) o[id] = +$(id).value;
            o.pal = ["c0", "c1", "c2", "c3", "c4", "c5"].map(id => hxRGB($(id).value));
            o.bg0 = $("bg0").value; o.bg1 = $("bg1").value;
            o.seed = parseInt($("seed").value) || 0;
            return o;
        }

        // ---- 물고기 템플릿: 몸길이 1 기준 (x=0 꼬리자루, x=1 주둥이), 높이 방향 ±h(x) ----
        // 정어리형 실루엣 위에 격자 정점을 깔고 흔든 뒤 삼각 분할 → 면마다 밝기 단계(bucket) 배정.
        const PROF = [[0, 0.22], [0.12, 0.46], [0.35, 0.93], [0.55, 1], [0.75, 0.84], [0.9, 0.52], [0.97, 0.26], [1, 0]];
        function prof(t) {
            for (let k = 1; k < PROF.length; k++) if (t <= PROF[k][0]) {
                const [a, va] = PROF[k - 1], [b, vb] = PROF[k], u = (t - a) / (b - a);
                return va + (vb - va) * u * u * (3 - 2 * u);
            }
            return 0;
        }
        function buildTemplate(r, o) {
            const cols = o.cols, rows = o.rows, hm = o.aspect / 2, J = o.mjit;
            const v = [], g = [], tris = [];
            const ts = [];
            for (let i = 0; i <= cols; i++) ts.push(i === 0 || i === cols ? i / cols : (i + (r() * 2 - 1) * J * 0.6) / cols);
            const h = t => hm * prof(t);
            for (let i = 0; i < cols; i++) {
                const col = [];
                for (let j = 0; j <= rows; j++) {
                    const vv = -1 + 2 * j / rows, edge = j === 0 || j === rows;
                    const hh = h(ts[i]) * (vv < 0 ? 1.06 : 0.94);           // 배 쪽이 살짝 통통
                    const jx = edge || i === 0 ? 0 : (r() * 2 - 1) * J * 0.5 / cols;
                    const jy = edge ? 0 : (r() * 2 - 1) * J * hh / rows;
                    col.push(v.length); v.push([ts[i] + jx, vv * hh + jy]);
                }
                g.push(col);
            }
            const nose = v.length; v.push([1, 0]);
            for (let i = 0; i < cols - 1; i++) for (let j = 0; j < rows; j++) {
                const a = g[i][j], b = g[i + 1][j], c = g[i + 1][j + 1], d = g[i][j + 1];
                if (r() < 0.5) tris.push([a, b, c], [a, c, d]); else tris.push([a, b, d], [b, c, d]);
            }
            for (let j = 0; j < rows; j++) tris.push([g[cols - 1][j], g[cols - 1][j + 1], nose]);
            // 꼬리: 갈라진 V자 (홈 정점에서 꼬리자루 정점들로 부채꼴)
            const th = hm * 1.45, tl = 0.27 + r() * 0.04;
            const topTip = v.length; v.push([-tl, th]);
            const notch = v.length; v.push([-tl * 0.5, (r() * 2 - 1) * 0.01]);
            const botTip = v.length; v.push([-tl, -th]);
            const tm1 = v.length; v.push([-tl * 0.62, th * 0.55]);
            const tm2 = v.length; v.push([-tl * 0.62, -th * 0.55]);
            for (let j = 0; j < rows; j++) tris.push([g[0][j], g[0][j + 1], notch]);
            tris.push([g[0][rows], tm1, notch], [g[0][rows], topTip, tm1], [tm1, topTip, notch]);
            tris.push([g[0][0], notch, tm2], [g[0][0], tm2, botTip], [tm2, notch, botTip]);
            // 등지느러미·배지느러미 (인접 두 열 사이의 작은 삼각형)
            const a = Math.min(cols - 2, Math.floor(cols * 0.42)), b = Math.min(cols - 2, Math.floor(cols * 0.58));
            const dx = (ts[a] + ts[a + 1]) / 2 - 0.03, bx = (ts[b] + ts[b + 1]) / 2 - 0.03;
            const dors = v.length; v.push([dx, h(dx) * 0.94 + hm * 0.5]);
            const vent = v.length; v.push([bx, -h(bx) * 1.06 - hm * 0.38]);
            tris.push([g[a][rows], g[a + 1][rows], dors], [g[b][0], g[b + 1][0], vent]);
            // 외곽선: 주둥이 → 등선(뒤로) → 꼬리 → 배선(앞으로)
            const out = [nose];
            for (let i = cols - 1; i >= 0; i--) { out.push(g[i][rows]); if (i === a + 1) out.push(dors); }
            out.push(tm1, topTip, notch, botTip, tm2);
            for (let i = 0; i < cols; i++) { out.push(g[i][0]); if (i === b) out.push(vent); }
            const es = new Set(), edges = [];
            for (const t of tris) for (let k = 0; k < 3; k++) {
                const p = t[k], q = t[(k + 1) % 3], key = p < q ? p * 4096 + q : q * 4096 + p;
                if (!es.has(key)) { es.add(key); edges.push([p, q]); }
            }
            const bucket = tris.map(() => { const u = r(); return u < 0.3 ? 0 : u < 0.62 ? 1 : u < 0.86 ? 2 : 3; });
            return { v, tris, edges, out, bucket };
        }

        // ---- 흐름장: 기본 방향 + 중심 소용돌이 + 컬 노이즈 난류 ----
        let waves = [];
        function buildWaves(seed) {
            const r = mulberry32((seed ^ 0x5bd1e995) >>> 0);
            waves = [];
            for (let k = 0; k < 4; k++) {
                const lam = W * (0.3 + r() * 0.6), ang = r() * Math.PI * 2, kk = 2 * Math.PI / lam;
                waves.push({ a: Math.cos(ang) * kk, b: Math.sin(ang) * kk, c: (r() * 2 - 1) * 0.5, ph: r() * 6.283, A: 1 / kk });
            }
        }
        function flow(x, y, t, o) {
            const d = rad(o.dir);
            let vx = Math.cos(d), vy = -Math.sin(d);
            const cx = x - W / 2, cy = y - H / 2, rr = Math.hypot(cx, cy) || 1, Rs = o.swR * H;
            const q = rr / Rs, m = o.swirl * q * Math.exp(0.5 * (1 - q * q));   // 반경 Rs에서 최대
            vx += cy / rr * m; vy += -cx / rr * m;                      // + = 화면상 반시계
            let px = 0, py = 0;
            for (const w of waves) { const c = Math.cos(w.a * x + w.b * y + w.c * t + w.ph) * w.A; px += c * w.a; py += c * w.b; }
            const kz = o.turb * 1.4 / Math.sqrt(waves.length);
            vx += py * kz; vy += -px * kz;
            return [vx, vy];
        }

        // ---- 개체 ----
        let tpls = [], fish = [], bubbles = [], sparks = [], tNow = 0, playing = true, last = performance.now();
        let popRnd = Math.random;
        function buildTemplates(o) {
            const r = mulberry32(o.seed >>> 0);
            tpls = []; for (let k = 0; k < NTPL; k++) tpls.push(buildTemplate(r, o));
        }
        function buildPop(o) {
            const r = mulberry32((o.seed ^ 0x27d4eb2f) >>> 0);
            fish = [];
            const add = (n, L) => {
                for (let k = 0; k < n; k++) fish.push({
                    L, tp: Math.floor(r() * NTPL), ci: Math.floor(r() * 6), x: r() * W, y: r() * H, hd: rad(o.dir) * -1 + (r() - 0.5),
                    sm: 0.75 + r() * 0.5, sk: 0.8 + r() * 0.4, ph: r() * 6.283, sp: r() * 6.283, kx: 0, ky: 0, hist: []
                });
            };
            add(o.nFar, 0); add(o.nMid, 1); add(o.nNear, 2);
            bubbles = [];
            for (let k = 0; k < o.bub; k++) bubbles.push({ x: r() * W, y: r() * H, r: 1 + r() * 2.4, vy: 10 + r() * 22, wb: r() * 6.283 });
            buildWaves(o.seed);
        }
        const fishSize = (f, o) => o.size * f.sk * (f.L === 0 ? o.farSz : LAYER_SZ[f.L]);

        function update(o, dt) {
            tNow += dt;
            const histLen = o.trail * o.tgap + 1;
            for (const f of fish) {
                const [vx, vy] = flow(f.x, f.y, tNow, o);
                const mag = Math.hypot(vx, vy) || 1;
                const sp = o.spd * 70 * LAYER_SPD[f.L] * f.sm * (0.6 + 0.4 * Math.min(1.6, mag));
                const tgt = Math.atan2(vy, vx);
                let dA = tgt - f.hd; dA = Math.atan2(Math.sin(dA), Math.cos(dA));
                f.hd += dA * Math.min(1, dt * 3.5);
                f.x += (Math.cos(f.hd) * sp + f.kx) * dt; f.y += (Math.sin(f.hd) * sp + f.ky) * dt;
                const kd = Math.exp(-2.5 * dt); f.kx *= kd; f.ky *= kd;
                f.ph += dt * (7 + sp * 0.05 + Math.hypot(f.kx, f.ky) * 0.05);
                const m = fishSize(f, o) * 1.4;
                let wrapped = false;
                if (f.x < -m) { f.x += W + 2 * m; wrapped = true } else if (f.x > W + m) { f.x -= W + 2 * m; wrapped = true }
                if (f.y < -m) { f.y += H + 2 * m; wrapped = true } else if (f.y > H + m) { f.y -= H + 2 * m; wrapped = true }
                if (wrapped) f.hist.length = 0;
                if (f.L > 0) { f.hist.push([f.x, f.y, f.hd, f.ph]); if (f.hist.length > histLen) f.hist.splice(0, f.hist.length - histLen); }
            }
            for (const b of bubbles) {
                b.y -= b.vy * dt; b.wb += dt * 2;
                if (b.y < -6) { b.y = H + 6; b.x = Math.random() * W; }
            }
            // 반짝이: 근·중경 물고기 주변에서 초당 spark 개 생성
            let n = o.spark * dt; const cand = fish.filter(f => f.L > 0);
            while (cand.length && (n >= 1 || Math.random() < n)) {
                n -= 1;
                const f = cand[Math.floor(Math.random() * cand.length)], s = fishSize(f, o);
                sparks.push({ x: f.x + (Math.random() - 0.5) * s, y: f.y + (Math.random() - 0.5) * s * 0.6, life: 0, max: 0.4 + Math.random() * 0.5, sz: 2 + Math.random() * 4, c: f.ci });
            }
            sparks = sparks.filter(s => (s.life += dt) < s.max);
        }

        // ---- 기하: 템플릿 정점 → 꼬리 흔들림 → 화면 좌표 ----
        function fishPts(f, o, st) {
            const T = tpls[f.tp], s = fishSize(f, o), c = Math.cos(st[2]), sn = Math.sin(st[2]);
            return T.v.map(([x, y]) => {
                const w = 1.12 - clamp(x, -0.4, 1);
                const yy = y + o.wag * Math.sin(st[3] - x * 5.2) * w * w;
                const lx = (x - 0.42) * s, ly = yy * s;
                return [st[0] + lx * c - ly * sn, st[1] + lx * sn + ly * c];
            });
        }
        // 공통 데이터: 레이어별 { 실루엣, 상세 } 목록 — 캔버스·SVG가 같이 쓴다.
        function scene(o) {
            const L = [[], [], []];
            for (const f of fish) {
                const col = o.pal[f.ci];
                const st = [f.x, f.y, f.hd, f.ph];
                const ghosts = [];
                if (f.L > 0 && o.trail > 0 && o.trailA > 0) {
                    for (let k = 1; k <= o.trail; k++) {
                        const i = f.hist.length - 1 - k * o.tgap;
                        if (i < 0) break;
                        ghosts.push({ P: fishPts(f, o, f.hist[i]), a: o.trailA * (1 - (k - 1) / o.trail) });
                    }
                }
                const shim = b => 0.55 + 0.45 * Math.sin(tNow * o.shim * 3 + f.sp + b * 2.1);
                L[f.L].push({ f, col, P: fishPts(f, o, st), T: tpls[f.tp], ghosts, lv: [0, 1, 2, 3].map(b => BUCKET[b] * o.facet * shim(b)) });
            }
            return L;
        }

        // ---- 캔버스 ----
        const cv = $("stage"), ctx = cv.getContext("2d");
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        function mk() { const c = document.createElement("canvas"); c.width = W * dpr; c.height = H * dpr; const g = c.getContext("2d"); g.scale(dpr, dpr); return [c, g]; }
        cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
        const [farC, farG] = mk(), [midC, midG] = mk(), [gloC, gloG] = mk();
        function poly(g, P, idx) { g.moveTo(P[idx[0]][0], P[idx[0]][1]); for (let k = 1; k < idx.length; k++) g.lineTo(P[idx[k]][0], P[idx[k]][1]); g.closePath(); }
        function drawFish(g, it, o, aMul) {
            const { P, T, col, lv } = it;
            g.beginPath(); poly(g, P, T.out); g.fillStyle = rgba(col, o.fillA * aMul); g.fill();
            const hi = mixW(col, 0.6);
            for (let b = 1; b < 4; b++) {
                if (lv[b] <= 0.005) continue;
                g.beginPath();
                T.tris.forEach((t, k) => { if (T.bucket[k] === b) poly(g, P, t); });
                g.fillStyle = rgba(hi, lv[b] * aMul); g.fill();
            }
            if (o.mesh > 0) {
                g.beginPath();
                for (const [p, q] of T.edges) { g.moveTo(P[p][0], P[p][1]); g.lineTo(P[q][0], P[q][1]); }
                g.strokeStyle = rgba(mixW(col, 0.55), o.mesh * aMul); g.lineWidth = 0.6; g.stroke();
            }
            g.beginPath(); poly(g, P, T.out); g.strokeStyle = rgba(mixW(col, 0.3), 0.9 * aMul); g.lineWidth = 1; g.stroke();
        }
        function silhouette(g, P, T, col, a) { g.beginPath(); poly(g, P, T.out); g.fillStyle = rgba(col, a); g.fill(); }
        function drawStar(g, x, y, s, c, a) {
            g.fillStyle = rgba(mixW(c, 0.6), a);
            g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.18, y); g.lineTo(x, y + s); g.lineTo(x - s * 0.18, y); g.closePath();
            g.moveTo(x - s, y); g.lineTo(x, y + s * 0.18); g.lineTo(x + s, y); g.lineTo(x, y - s * 0.18); g.closePath(); g.fill();
        }
        function drawFrame(o) {
            const L = scene(o);
            const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, o.bg0); bg.addColorStop(1, o.bg1);
            ctx.globalCompositeOperation = "source-over"; ctx.filter = "none"; ctx.globalAlpha = 1;
            ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
            // 원경: 실루엣만 → 강한 흐림 (보케)
            farG.clearRect(0, 0, W, H); farG.globalCompositeOperation = "lighter";
            for (const it of L[0]) silhouette(farG, it.P, it.T, mixW(it.col, 0.15), 0.9);
            ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = o.farA;
            ctx.filter = o.farBlur > 0 ? `blur(${o.farBlur}px)` : "none"; ctx.drawImage(farC, 0, 0, W, H);
            // 글로우: 중·근경 실루엣(+잔상)을 모아 1회 흐림
            gloG.clearRect(0, 0, W, H); gloG.globalCompositeOperation = "lighter";
            for (const it of [...L[1], ...L[2]]) {
                silhouette(gloG, it.P, it.T, it.col, it.f.L === 2 ? 1 : 0.7);
                for (const gh of it.ghosts) silhouette(gloG, gh.P, it.T, it.col, gh.a * 0.8);
            }
            ctx.globalAlpha = Math.min(1, o.glow); ctx.filter = `blur(${o.glowR}px)`; ctx.drawImage(gloC, 0, 0, W, H);
            if (o.glow > 1) { ctx.globalAlpha = o.glow - 1; ctx.drawImage(gloC, 0, 0, W, H); }
            // 중경: 상세 렌더 → 약한 흐림
            midG.clearRect(0, 0, W, H); midG.globalCompositeOperation = "lighter";
            for (const it of L[1]) { for (const gh of it.ghosts) silhouette(midG, gh.P, it.T, it.col, gh.a * 0.5); drawFish(midG, it, o, 0.85); }
            ctx.globalAlpha = 1; ctx.filter = o.midBlur > 0 ? `blur(${o.midBlur}px)` : "none"; ctx.drawImage(midC, 0, 0, W, H);
            // 근경: 선명
            ctx.filter = "none";
            for (const it of L[2]) { for (const gh of it.ghosts) silhouette(ctx, gh.P, it.T, it.col, gh.a * 0.5); drawFish(ctx, it, o, 1); }
            // 기포·반짝이
            ctx.lineWidth = 0.8;
            for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x + Math.sin(b.wb) * 2, b.y, b.r, 0, Math.PI * 2); ctx.strokeStyle = "rgba(200,240,255,0.55)"; ctx.stroke(); }
            for (const s of sparks) { const u = s.life / s.max, a = Math.sin(u * Math.PI); drawStar(ctx, s.x, s.y, s.sz * (0.5 + 0.5 * a), o.pal[s.c], a); }
            ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
        }

        // ---- SVG 스냅샷 (현재 프레임) ----
        function buildSVG(o) {
            const L = scene(o);
            const pd = (P, idx) => "M" + idx.map(i => f1(P[i][0]) + " " + f1(P[i][1])).join("L") + "Z";
            const sil = (P, T, col, a) => `<path d="${pd(P, T.out)}" fill="${hex(col)}" fill-opacity="${a.toFixed(2)}"/>`;
            const det = (it, aMul) => {
                const { P, T, col, lv } = it, hi = hex(mixW(col, 0.6));
                let s = `<g class="a">` + sil(P, T, col, o.fillA * aMul);
                for (let b = 1; b < 4; b++) {
                    if (lv[b] <= 0.005) continue;
                    const d = T.tris.map((t, k) => T.bucket[k] === b ? pd(P, t) : "").join("");
                    if (d) s += `<path d="${d}" fill="${hi}" fill-opacity="${(lv[b] * aMul).toFixed(2)}"/>`;
                }
                if (o.mesh > 0) s += `<path d="${T.edges.map(([p, q]) => `M${f1(P[p][0])} ${f1(P[p][1])}L${f1(P[q][0])} ${f1(P[q][1])}`).join("")}" stroke="${hex(mixW(col, 0.55))}" stroke-opacity="${(o.mesh * aMul).toFixed(2)}" stroke-width="0.6" fill="none"/>`;
                s += `<path d="${pd(P, T.out)}" stroke="${hex(mixW(col, 0.3))}" stroke-opacity="${(0.9 * aMul).toFixed(2)}" fill="none"/>`;
                return s + `</g>`;
            };
            const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`,
                `<defs><style>.a{mix-blend-mode:screen}</style>`,
                `<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.bg0}"/><stop offset="1" stop-color="${o.bg1}"/></linearGradient>`,
                `<filter id="fFar" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${o.farBlur}"/></filter>`,
                `<filter id="fGlow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${o.glowR}"/></filter>`,
                `<filter id="fMid" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${o.midBlur}"/></filter>`,
                `</defs>`, `<rect width="${W}" height="${H}" fill="url(#bg)"/>`];
            out.push(`<g class="a" filter="url(#fFar)" opacity="${o.farA.toFixed(2)}">${L[0].map(it => sil(it.P, it.T, mixW(it.col, 0.15), 0.9)).join("")}</g>`);
            out.push(`<g class="a" filter="url(#fGlow)" opacity="${Math.min(1, o.glow).toFixed(2)}">${[...L[1], ...L[2]].map(it =>
                sil(it.P, it.T, it.col, it.f.L === 2 ? 1 : 0.7) + it.ghosts.map(gh => sil(gh.P, it.T, it.col, gh.a * 0.8)).join("")).join("")}</g>`);
            out.push(`<g class="a" filter="url(#fMid)">${L[1].map(it => it.ghosts.map(gh => sil(gh.P, it.T, it.col, gh.a * 0.5)).join("") + det(it, 0.85)).join("")}</g>`);
            out.push(`<g>${L[2].map(it => it.ghosts.map(gh => `<g class="a">${sil(gh.P, it.T, it.col, gh.a * 0.5)}</g>`).join("") + det(it, 1)).join("")}</g>`);
            out.push(`<g fill="none" stroke="#c8f0ff" stroke-opacity="0.55" stroke-width="0.8">${bubbles.map(b => `<circle cx="${f1(b.x + Math.sin(b.wb) * 2)}" cy="${f1(b.y)}" r="${f1(b.r)}"/>`).join("")}</g>`);
            out.push(`<g class="a">${sparks.map(s => {
                const u = s.life / s.max, a = Math.sin(u * Math.PI), z = s.sz * (0.5 + 0.5 * a), x = s.x, y = s.y;
                return `<path d="M${f1(x)} ${f1(y - z)}L${f1(x + z * .18)} ${f1(y)}L${f1(x)} ${f1(y + z)}L${f1(x - z * .18)} ${f1(y)}ZM${f1(x - z)} ${f1(y)}L${f1(x)} ${f1(y + z * .18)}L${f1(x + z)} ${f1(y)}L${f1(x)} ${f1(y - z * .18)}Z" fill="${hex(mixW(o.pal[s.c], 0.6))}" fill-opacity="${a.toFixed(2)}"/>`;
            }).join("")}</g>`);
            out.push(`</svg>`);
            return out.join("\n");
        }

        function labels(o) {
            const set = (id, s) => $("v-" + id).textContent = s, pct = v => Math.round(v * 100) + "%";
            set("nFar", o.nFar + "마리"); set("nMid", o.nMid + "마리"); set("nNear", o.nNear + "마리");
            set("size", o.size + "px"); set("farSz", o.farSz.toFixed(2) + "×"); set("farBlur", o.farBlur + "px"); set("farA", pct(o.farA));
            set("midBlur", o.midBlur.toFixed(1) + "px"); set("aspect", o.aspect.toFixed(2)); set("cols", o.cols + "칸"); set("rows", o.rows + "칸");
            set("mjit", pct(o.mjit)); set("facet", pct(o.facet)); set("mesh", pct(o.mesh)); set("fillA", pct(o.fillA)); set("shim", o.shim.toFixed(2) + "×");
            set("glow", o.glow.toFixed(2) + "×"); set("glowR", o.glowR + "px"); set("spark", o.spark + "개"); set("bub", o.bub + "개");
            set("spd", o.spd.toFixed(2) + "×"); set("dir", o.dir + "°"); set("swirl", (o.swirl > 0 ? "+" : "") + o.swirl.toFixed(2)); set("swR", pct(o.swR));
            set("turb", o.turb.toFixed(2) + "×"); set("wag", o.wag.toFixed(3)); set("trail", o.trail + "개"); set("tgap", o.tgap + "f"); set("trailA", pct(o.trailA));
        }
        function refresh(id) {
            const o = opts();
            if (!id || REBUILD_TPL.has(id)) buildTemplates(o);
            if (!id || REBUILD_POP.has(id)) buildPop(o);
            labels(o);
            drawFrame(o);
            if (!playing) $("code").value = buildSVG(o);
        }
        function loop(t) {
            const dt = Math.min(0.05, (t - last) / 1000); last = t;
            if (playing) { const o = opts(); update(o, dt); drawFrame(o); }
            requestAnimationFrame(loop);
        }

        // ---- 프리셋 (레퍼런스 두 장면) ----
        const PRESETS = {
            // 장면 1: 검은 배경 위를 대각선으로 휘감아 흐르는 선명한 떼 + 세로 잔상
            stream: { nFar: 60, nMid: 46, nNear: 22, size: 62, farSz: 0.5, farBlur: 7, farA: 0.45, midBlur: 1.2, spd: 1.2, dir: 150, swirl: 1.1, swR: 0.42, turb: 0.55, trail: 4, tgap: 2, trailA: 0.3, glow: 0.66, glowR: 9, spark: 10, bub: 8, bg0: "#06070d", bg1: "#0c1422" },
            // 장면 2: 청록 배경을 가득 채운 흐린 물고기 보케 + 소수의 선명한 개체
            tank: { nFar: 200, nMid: 10, nNear: 5, size: 48, farSz: 1.0, farBlur: 4.5, farA: 0.7, midBlur: 0.6, spd: 0.45, dir: 180, swirl: 0, swR: 0.42, turb: 0.3, trail: 0, tgap: 2, trailA: 0.3, glow: 0.7, glowR: 7, spark: 6, bub: 4, bg0: "#0a2630", bg1: "#061019" }
        };
        function applyPreset(p) {
            for (const [k, v] of Object.entries(p)) $(k).value = v;
            $("note").textContent = ""; refresh();
        }
        $("pStream").addEventListener("click", () => applyPreset(PRESETS.stream));
        $("pTank").addEventListener("click", () => applyPreset(PRESETS.tank));

        [...IDS, ...COLS, "seed"].forEach(id => $(id).addEventListener("input", () => { $("note").textContent = ""; refresh(id); }));
        $("reroll").addEventListener("click", () => { $("seed").value = Math.floor(Math.random() * 100000); refresh(); });
        $("copy").addEventListener("click", async () => {
            const svg = buildSVG(opts());
            $("code").value = svg;
            try { await navigator.clipboard.writeText(svg); $("note").textContent = `현재 프레임을 SVG로 복사했습니다. (${Math.round(svg.length / 1024)}KB)` }
            catch (e) { $("code").select(); $("note").textContent = "자동 복사가 막혀 있어 코드를 선택해 두었습니다. 직접 복사하세요." }
        });
        $("play").addEventListener("click", () => {
            playing = !playing;
            $("play").textContent = playing ? "일시 정지" : "재생";
            if (!playing) $("code").value = buildSVG(opts());
        });
        // 클릭: 반경 안의 물고기를 바깥으로 튕기고 반짝이 터뜨림
        cv.addEventListener("pointerdown", e => {
            if (e.button > 0) return;
            const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
            for (const f of fish) {
                const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy);
                if (d < 140 && d > 0.1) { const k = 260 * (1 - d / 140) * (f.L === 0 ? 0.5 : 1); f.kx += dx / d * k; f.ky += dy / d * k; }
            }
            for (let k = 0; k < 14; k++) sparks.push({ x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 40, life: 0, max: 0.4 + Math.random() * 0.6, sz: 3 + Math.random() * 5, c: Math.floor(Math.random() * 6) });
            if (!playing) refresh("x");
        });

        refresh();
        requestAnimationFrame(loop);
    </script>
</body>

</html>
