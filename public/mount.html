<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>山 | ( ◠ ᗜ ◠ )</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="tsukuyomi.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        /* 첫 프레임 전 배경(장면별 값은 스크립트가 덮어쓴다) */
        body { background: #8a7aa8; }
    </style>
</head>

<body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="dock">
        <section class="panel" id="panel" aria-label="장면 버전 전환">
            <div class="icongroup" id="icongroup" role="group" aria-label="땅거미(구버전) / 노을(통합) 선택">
                <span class="thumb" id="thumb" aria-hidden="true"></span>
                <button type="button" data-scene="dusk" aria-label="땅거미 (구버전)" aria-pressed="false"><i
                        class="bi bi-cloud-moon-fill" aria-hidden="true"></i></button>
                <button type="button" data-scene="sunset" aria-label="노을 (통합)" aria-pressed="false"><i
                        class="bi bi-sunset-fill" aria-hidden="true"></i></button>
            </div>
        </section>
    </div>

    <script src="cloud-live.js"></script>
    <script src="tsukuyomi.mount.js"></script>
</body>

</html>
