<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름 브러시 에디터</title>
<!--
  구름 셰이더 초안(루트 "구름 셰이더 초안.html")을 브러시 편집 구조로 옮긴 중간 단계.
  초안의 절차적 엔벨로프(큰 형태) 대신 직접 칠하는 두 장의 편집 맵을 셰이더가 읽는다.
    ① 밀도 맵(uDen): 엔벨로프 값 자체. 0 근처가 구름 경계, 양수일수록 속이 차고 음수는 빈 하늘.
       잔 혹(콜리플라워)은 여전히 빌로우 노이즈가 만들고, 거대 형태 음영(광원 쪽 적분)도 이 맵을 따라간다.
    ② 투과율 보정 맵(uTr): 자기 그림자(거대 형태 투과율 macro)에 더하는 부호 있는 보정값. 0 = 계산값 그대로.
  두 맵은 문서 좌표(가로 = 화면비 × 세로, 세로 = 1, 아래가 0)의 R16F 텍스처이고,
  JSON(tsukuyomi-cloud-doc v1)으로 저장/불러오기 해 이후 황혼/낮 장면에 적용한다.
-->
<style>
:root{
  --panel:rgba(28,22,44,.74); --ink:#f3e9f0; --muted:#bfaecb; --accent:#ffd9a8; --on-accent:#2a1f36; --line:rgba(255,255,255,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --panel:rgba(255,248,252,.8); --ink:#2a1f36; --muted:#6a5878; --accent:#9a4d2c; --on-accent:#fff; --line:rgba(40,20,60,.16);} }
:root[data-theme="light"]{ --panel:rgba(255,248,252,.8); --ink:#2a1f36; --muted:#6a5878; --accent:#9a4d2c; --on-accent:#fff; --line:rgba(40,20,60,.16);}
:root[data-theme="dark"]{ --panel:rgba(28,22,44,.74); --ink:#f3e9f0; --muted:#bfaecb; --accent:#ffd9a8; --on-accent:#2a1f36; --line:rgba(255,255,255,.14);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#2b2440;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none;cursor:crosshair}
#c.painting,#c.hover{cursor:none}
#cur{pointer-events:none}
.panel{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(296px,calc(100% - 24px));
  background:var(--panel);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;
  max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.panel details+details{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}
.row label{color:var(--muted)} .row output{color:var(--accent);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
select,button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grp{margin:8px 0}
.grp>.lbl{display:block;color:var(--muted);margin-bottom:4px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);margin:8px 0}
.chk input{accent-color:var(--accent);margin:0}
details summary{cursor:pointer;color:var(--muted)}
details summary strong{color:var(--ink)}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.stat{color:var(--muted);font-size:12px;margin:8px 0 0;font-variant-numeric:tabular-nums;min-height:1.4em}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#err{position:fixed;left:12px;bottom:12px;max-width:calc(100% - 24px);background:#5a1f2a;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="구름 편집 캔버스"></canvas>
<canvas id="cur" aria-hidden="true"></canvas>
<div class="panel">
  <details open>
  <summary><strong>브러시 편집</strong></summary>
  <div class="grp"><span class="lbl">레이어</span>
    <div class="seg" role="group" aria-label="편집 레이어">
      <button type="button" data-layer="den" aria-pressed="true">밀도(형태)</button>
      <button type="button" data-layer="tr" aria-pressed="false">자기 그림자 투과율</button>
    </div></div>
  <div class="grp"><span class="lbl">도구</span><div class="seg" id="tools" role="group" aria-label="브러시 도구"></div></div>
  <div class="row"><label for="bSize">크기</label><output id="bSizeO"></output><input id="bSize" type="range" min="0.01" max="0.3" step="0.005" value="0.07"></div>
  <div class="row"><label for="bStr">세기</label><output id="bStrO"></output><input id="bStr" type="range" min="0.05" max="1" step="0.01" value="0.6"></div>
  <div class="row"><label for="bHard">경도</label><output id="bHardO"></output><input id="bHard" type="range" min="0" max="0.95" step="0.01" value="0.3"></div>
  <label class="chk"><input type="checkbox" id="ovl" checked> 편집 레이어 겹쳐 보기</label>
  <div class="btns">
    <button type="button" id="undo" title="Ctrl+Z">실행 취소</button>
    <button type="button" id="redo" title="Ctrl+Shift+Z">다시 실행</button>
    <button type="button" id="clearL">레이어 비우기</button>
    <button type="button" id="fromDraft">초안 형태로</button>
  </div>
  <div class="btns">
    <button type="button" id="save">저장(JSON)</button>
    <button type="button" id="load">불러오기</button>
    <button type="button" id="newDoc">새 캔버스</button>
    <input type="file" id="file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
  </div>
  <p class="hint" id="toolHint"></p>
  <p class="hint"><kbd>Alt</kbd>/우클릭 반대 동작 · <kbd>[</kbd><kbd>]</kbd> 크기 · <kbd>1</kbd><kbd>2</kbd> 레이어 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 취소</p>
  <p class="stat" id="stat" aria-live="off"></p>
  </details>
  <details open>
  <summary><strong>적운 질감 파라미터</strong></summary>
  <div class="row"><label for="view">보기</label>
    <select id="view">
      <option value="0">최종 합성</option>
      <option value="1">밀도(형태)</option>
      <option value="2">자기 그림자(투과율)</option>
      <option value="3">빌로우 노이즈 원본</option>
      <option value="4">편집 맵: 밀도(엔벨로프)</option>
      <option value="5">편집 맵: 투과율 보정</option>
    </select></div>
  <div class="row"><label for="cov">덮임 정도</label><output id="covO"></output><input id="cov" type="range" min="0.2" max="0.8" step="0.01" value="0.5"></div>
  <div class="row"><label for="sharp">윗면 경계 선명도</label><output id="sharpO"></output><input id="sharp" type="range" min="0.01" max="0.3" step="0.005" value="0.04"></div>
  <div class="row"><label for="soft">아랫면 흐림</label><output id="softO"></output><input id="soft" type="range" min="0.05" max="0.6" step="0.01" value="0.3"></div>
  <div class="row"><label for="scale">덩어리 크기</label><output id="scaleO"></output><input id="scale" type="range" min="2" max="12" step="0.1" value="5.5"></div>
  <div class="row"><label for="absorb">그림자 깊이</label><output id="absorbO"></output><input id="absorb" type="range" min="0.2" max="4" step="0.05" value="1.6"></div>
  <div class="row"><label for="sun">빛 방향(°)</label><output id="sunO"></output><input id="sun" type="range" min="20" max="160" step="1" value="105"></div>
  <div class="row"><label for="grain">필름 그레인</label><output id="grainO"></output><input id="grain" type="range" min="0" max="0.12" step="0.005" value="0.05"></div>
  <div class="btns"><button type="button" id="anim" aria-pressed="true">흐름 멈추기</button><button type="button" id="theme">패널 테마</button></div>
  <p class="hint">"자기 그림자" 보기에서 덩어리마다 위가 밝고 아래가 어두워야 콜리플라워 질감이 납니다. 투과율 보정은 그 위에 더해집니다.</p>
  </details>
</div>
<div id="err" role="alert"></div>
<script>
'use strict';
const vs=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
uniform float uCov,uSharp,uSoft,uScale,uAbsorb,uGrain; uniform vec2 uSun; uniform int uView;
uniform vec4 uDoc;        // 문서 사각형(캔버스 px, 아래 기준): 원점 xy, 크기 zw
uniform float uDocA;      // 문서 가로/세로 비
uniform sampler2D uDen;   // 밀도 맵 = 엔벨로프
uniform sampler2D uTr;    // 투과율 보정 맵
uniform int uOverlay,uLayer;
out vec4 fragColor;

float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y);}
// F1 워리 거리: 셀 중심이 밝은 둥근 혹을 만든다
float worley(vec2 p){vec2 i=floor(p),f=fract(p);float d=8.;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(x,y);vec2 o=hash22(i+g);
    o=.5+.38*sin(uTime*.04+6.2831*o);vec2 r=g+o-f;d=min(d,dot(r,r));}
  return sqrt(d);}
// 반전 워리 fbm = 빌로우(뭉게) 노이즈
float billow(vec2 p,int oct){float n=0.,a=.55,s=0.;
  for(int i=0;i<5;i++){if(i>=oct)break;n+=a*(1.-worley(p));s+=a;p=p*2.07+vec2(3.1,1.7);a*=.5;}
  return n/s;}
float vfbm(vec2 p){float n=0.,a=.5;for(int i=0;i<3;i++){n+=a*vnoise(p);p*=2.1;a*=.5;}return n/.875;}

// 큰 형태(엔벨로프): 초안의 절차적 형태 대신 브러시로 칠한 밀도 맵을 읽는다
float envelope(vec2 uv){return texture(uDen,vec2(uv.x/uDocA,uv.y)).r;}
float trEdit(vec2 uv){return texture(uTr,vec2(uv.x/uDocA,uv.y)).r;}
float lobeNoise(vec2 uv,int oct){
  vec2 q=uv*uScale+vec2(uTime*.006,0.);
  q+=.35*vec2(vfbm(q*.5),vfbm(q*.5+7.3))-.17; // 약한 도메인 워프: 격자 티 제거
  return billow(q,oct);
}
// 경계: 위로 향한 면은 날카롭게, 아래로 향한 면은 부드럽게
float density(vec2 uv,float e,float n){
  float r=e*.55+(n-.5)*1.25+.5;
  float up=envelope(uv+vec2(0.,.02))-e; // <0 이면 윗면
  float edge=mix(uSharp,uSoft,smoothstep(-.02,.06,up));
  return smoothstep(uCov,uCov+edge,r);
}

vec3 sky(vec2 s){
  float y=s.y;
  vec3 top=vec3(.33,.38,.66),mid=vec3(.62,.58,.82),low=vec3(.92,.62,.74),hor=vec3(.98,.78,.74);
  vec3 c=mix(hor,low,smoothstep(.12,.30,y));c=mix(c,mid,smoothstep(.30,.60,y));c=mix(c,top,smoothstep(.60,1.,y));
  return c;
}
// 등고선: v가 k를 지나는 곳에 화면 1px 남짓한 선
float iso(float v,float k,float fw){return 1.-smoothstep(0.,1.3,abs(v-k)/max(fw,1e-4));}

void main(){
  vec2 dp=(gl_FragCoord.xy-uDoc.xy)/uDoc.zw;   // 문서 좌표 0..1
  vec2 uv=vec2(dp.x*uDocA,dp.y);
  float e=envelope(uv), te=trEdit(uv), fw=fwidth(e);
  if(any(lessThan(dp,vec2(0.)))||any(greaterThan(dp,vec2(1.)))){
    fragColor=vec4(sky(clamp(dp,0.,1.))*.3,1.);return;}   // 문서 밖: 칠할 수 없는 영역
  float h=.12;
  vec2 s=dp;
  vec3 col=sky(s);
  if(uView==3){fragColor=vec4(vec3(lobeNoise(uv,5)),1.);return;}
  if(uView==4){
    vec3 g=vec3(clamp((e+2.)/4.2,0.,1.));
    g=mix(g,vec3(1.,.4,.3),iso(e,0.,fw));            // 0 = 평균 구름 경계
    g=mix(g,vec3(.5,.8,1.),iso(e,1.,fw)*.6);         // 1 = 속이 꽉 찬 영역
    fragColor=vec4(g,1.);return;}
  if(uView==5){
    vec3 g=vec3(.16,.15,.2);
    g=mix(g,vec3(1.,.78,.42),clamp(te,0.,1.));
    g=mix(g,vec3(.32,.5,1.),clamp(-te,0.,1.));
    g=mix(g,vec3(.85),iso(e,0.,fw)*.35);
    fragColor=vec4(g,1.);return;}
  float n0=lobeNoise(uv,5);
  float d=density(uv,e,n0);
  // ① 덩어리 단위 음영: 노이즈를 태양 방향으로 미분 → 각 혹의 '윗면'이 밝아진다
  vec2 L=normalize(uSun);
  float ep=.35/uScale;                   // 혹 크기에 비례한 샘플 간격
  float dn=0.;
  for(int i=1;i<=3;i++){dn+=(n0-lobeNoise(uv+L*ep*float(i)*.5,3))/float(i);}
  float lobe=smoothstep(-.18,.22,dn);
  // ② 거대 형태 음영: 밀도 맵 두께를 태양 쪽으로 적분 → 칠한 형태 전체의 큰 명암
  float od=0.;
  for(int i=1;i<=4;i++){od+=max(envelope(uv+L*.035*float(i)),0.);}
  // 투과율 보정 맵을 계산된 투과율에 더한다(브러시로 칠한 자기 그림자)
  float macro=clamp(exp(-od*uAbsorb*.6)*mix(.55,1.,smoothstep(.15,.6,uv.y))+te,0.,1.); // 위로 갈수록 직사광
  float T=lobe*mix(.18,1.,macro)+.15*macro;
  float powder=1.-exp(-d*4.);
  float light=clamp(mix(T,T*powder,.4),0.,1.);
  if(uView==1){col=vec3(d);}
  else if(uView==2){col=vec3(mix(.08,1.,light))*step(.01,d)+vec3(.05,.05,.1)*(1.-step(.01,d));}
  else{
    float hgt=smoothstep(h,h+.5,uv.y);
    vec3 shadowC=mix(vec3(.42,.30,.44),vec3(.50,.40,.60),hgt);   // 아랫면: 하늘색 반사 받은 모브
    vec3 midC=vec3(.93,.60,.60);
    vec3 litC=vec3(1.,.93,.78);
    vec3 cc=mix(shadowC,midC,smoothstep(.0,.5,light));
    cc=mix(cc,litC,smoothstep(.45,.95,light));
    // 실버 라이닝: 얇은 가장자리 + 빛 정면
    float rim=(1.-smoothstep(.0,.6,d))*T;
    cc+=vec3(1.,.85,.7)*rim*.45;
    // 대기 원근: 수평선 쪽 대비를 낮춰 멀리 보이게
    float far=1.-smoothstep(h,h+.22,uv.y);
    cc=mix(cc,sky(s)*vec3(1.,.9,.95),far*.45);
    col=mix(col,cc,d);
    // 수평선 아래(데모용 수면)
    if(uv.y<h){float k=(h-uv.y)/h;col=mix(vec3(.55,.42,.55),vec3(.22,.17,.28),pow(k,.6));}
  }
  // 편집 레이어 겹쳐 보기: 밀도는 경계 등고선, 투과율은 보정 부호별 색조
  if(uOverlay==1){
    if(uLayer==0){col=mix(col,vec3(.55,.95,1.),iso(e,0.,fw)*.65);}
    else{col=mix(col,vec3(1.,.72,.3),clamp(te,0.,1.)*.45);col=mix(col,vec3(.3,.5,1.),clamp(-te,0.,1.)*.45);}
  }
  if(uView==0)col+=(hash12(gl_FragCoord.xy+fract(uTime*7.)*137.)-.5)*uGrain;   // 필름 그레인
  fragColor=vec4(clamp(col,0.,1.),1.);
}`;

// ---------- 유틸 ----------
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const fract=x=>x-Math.floor(x);
function fail(msg){const e=$('err');e.textContent=msg;e.style.display='block';}

// ---------- WebGL2 ----------
const c=$('c');
const gl=c.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){fail('이 브라우저는 WebGL2를 지원하지 않아 에디터를 열 수 없습니다.');throw new Error('WebGL2 없음');}
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const log=gl.getShaderInfoLog(s);console.error(log);fail('셰이더 컴파일 실패: '+log);}return s;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
gl.uniform1i(U('uDen'),0);gl.uniform1i(U('uTr'),1);

// ---------- 문서(편집 맵) ----------
// 맵 배열은 행 0 = 문서 아래(수면 쪽). 텍스처도 그대로 올려 셰이더 uv와 방향이 같다.
// min/max: 브러시가 다루는 값 범위(저장 시 16비트 양자화 범위), empty: 비운 상태 값
const LAY={
  den:{name:'밀도(형태)',unit:0,min:-2,max:2.2,empty:-2,data:null,tex:gl.createTexture(),dirty:true},
  tr:{name:'자기 그림자 투과율',unit:1,min:-1,max:1,empty:0,data:null,tex:gl.createTexture(),dirty:true},
};
const DOC_H=360;          // 세로 해상도(텍셀). 엔벨로프는 부드러워 이 정도면 충분하고 잔 혹은 노이즈가 만든다
let DW=0,DH=DOC_H,DA=1;   // 문서 텍셀 크기와 가로/세로 비
function allocDoc(w,h){
  DW=w;DH=h;DA=w/h;
  for(const k in LAY){const L=LAY[k];L.data=new Float32Array(DW*DH).fill(L.empty);
    gl.activeTexture(gl.TEXTURE0+L.unit);gl.bindTexture(gl.TEXTURE_2D,L.tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.R16F,DW,DH,0,gl.RED,gl.FLOAT,L.data);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    L.dirty=true;}
  undoS.length=0;redoS.length=0;syncUndo();layout();
}
function upload(){
  for(const k in LAY){const L=LAY[k];if(!L.dirty)continue;L.dirty=false;
    gl.activeTexture(gl.TEXTURE0+L.unit);gl.bindTexture(gl.TEXTURE_2D,L.tex);
    gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,DW,DH,gl.RED,gl.FLOAT,L.data);}
}

// 초안의 절차적 엔벨로프(수평선 구름띠 + 적란운 탑 + 왼쪽 무리)를 밀도 맵에 굽는다: 시작점/비교용
function hash12(x,y){let a=fract(x*.1031),b=fract(y*.1031),c3=fract(x*.1031);
  const d=a*(b+33.33)+b*(c3+33.33)+c3*(a+33.33);a+=d;b+=d;c3+=d;return fract((a+b)*c3);}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash12(ix,iy),b2=hash12(ix+1,iy),c2=hash12(ix,iy+1),d=hash12(ix+1,iy+1);
  return (a+(b2-a)*ux)+((c2+(d-c2)*ux)-(a+(b2-a)*ux))*uy;}
function vfbm(x,y){let n=0,a=.5;for(let i=0;i<3;i++){n+=a*vnoise(x,y);x*=2.1;y*=2.1;a*=.5;}return n/.875;}
function draftEnv(x,y,A){
  const sdE=(cx,cy,rx,ry)=>1-Math.hypot((x-cx)/rx,(y-cy)/ry);
  const h=.12,bankTop=h+.13+.07*vfbm(x*1.6,3),bank=(bankTop-y)/.10;
  let t=sdE(A*.66,.40,.26,.24);
  t=Math.max(t,sdE(A*.62,.56,.14,.15),sdE(A*.74,.50,.15,.14),sdE(A*.86,.36,.20,.13));
  const l=Math.max(sdE(A*.10,.34,.20,.11),sdE(A*.20,.29,.18,.09));
  return Math.max(bank,t*1.9,l*1.6);
}
function fillDraft(){const L=LAY.den;
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++)L.data[y*DW+x]=clamp(draftEnv((x+.5)/DH,(y+.5)/DH,DA),L.min,L.max);
  L.dirty=true;}

// ---------- 실행 취소 ----------
const undoS=[],redoS=[],UNDO_MAX=30;
function pushUndo(k){undoS.push({k,d:LAY[k].data.slice()});if(undoS.length>UNDO_MAX)undoS.shift();redoS.length=0;syncUndo();}
function swapHist(from,to){const s=from.pop();if(!s)return;const L=LAY[s.k];
  to.push({k:s.k,d:L.data.slice()});L.data.set(s.d);L.dirty=true;syncUndo();scheduleSave();}
function syncUndo(){$('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length;}
$('undo').onclick=()=>swapHist(undoS,redoS);
$('redo').onclick=()=>swapHist(redoS,undoS);

// ---------- 브러시 ----------
const TOOLS={
  den:[
    {id:'puff',name:'퍼프',hint:'원뿔 덩어리를 겹쳐 찍어 큰 형태를 쌓습니다(초안 퍼프와 같은 방식). 원 테두리가 대략 구름 경계, 세기 = 덩어리 높이. 반대: 깎기'},
    {id:'add',name:'쌓기',hint:'밀도를 서서히 더해 경계를 밖으로 밀어냅니다. 반대: 깎기'},
    {id:'sub',name:'깎기',hint:'밀도를 서서히 덜어 형태를 파냅니다. 반대: 쌓기'},
    {id:'smooth',name:'문지르기',hint:'형태를 부드럽게 뭉갭니다. 퍼프 사이 골을 메울 때.'},
  ],
  tr:[
    {id:'light',name:'밝게',hint:'투과율을 올려 그 자리에 빛이 더 들게 합니다. "자기 그림자" 보기에서 확인. 반대: 어둡게'},
    {id:'dark',name:'어둡게',hint:'투과율을 낮춰 자기 그림자를 깊게 합니다. 반대: 밝게'},
    {id:'reset',name:'되돌리기',hint:'보정을 계산값(0)으로 되돌립니다.'},
    {id:'smooth',name:'문지르기',hint:'보정 경계를 부드럽게 풉니다.'},
  ],
};
const INV={puff:'sub',add:'sub',sub:'add',light:'dark',dark:'light'};
const brush={layer:'den',tool:{den:'puff',tr:'dark'},size:.07,str:.6,hard:.3};
function setLayer(k){brush.layer=k;
  document.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layer===k));
  const box=$('tools');box.textContent='';
  for(const t of TOOLS[k]){const bt=document.createElement('button');bt.type='button';bt.textContent=t.name;bt.dataset.tool=t.id;
    bt.onclick=()=>setTool(t.id);box.appendChild(bt);}
  setTool(brush.tool[k]);dirty=true;}
function setTool(id){brush.tool[brush.layer]=id;
  $('tools').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===id));
  $('toolHint').textContent=TOOLS[brush.layer].find(t=>t.id===id).hint;}
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>setLayer(b.dataset.layer));
[['bSize','size',3],['bStr','str',2],['bHard','hard',2]].forEach(([id,key,dig])=>{
  const el=$(id),o=$(id+'O');const f=()=>{brush[key]=+el.value;o.textContent=(+el.value).toFixed(dig);};
  el.addEventListener('input',()=>{f();drawCursor();});f();});
function setSize(v){const el=$('bSize');el.value=clamp(v,+el.min,+el.max);el.dispatchEvent(new Event('input'));}

// 가로 → 세로 이동 합 박스 블러(문지르기용). 영역 [x0,x1]×[y0,y1] 결과를 영역 크기 배열로 돌려준다
function boxBlur(src,x0,y0,x1,y1,k){
  const w=x1-x0+1,h=y1-y0+1,tmp=new Float32Array(w*h),out=new Float32Array(w*h),n=2*k+1;
  for(let y=0;y<h;y++){const row=(y+y0)*DW;let s=0;
    for(let i=-k;i<=k;i++)s+=src[row+clamp(x0+i,0,DW-1)];
    for(let x=0;x<w;x++){tmp[y*w+x]=s/n;s+=src[row+clamp(x0+x+k+1,0,DW-1)]-src[row+clamp(x0+x-k,0,DW-1)];}}
  for(let x=0;x<w;x++){let s=0;
    for(let i=-k;i<=k;i++)s+=tmp[clamp(i,0,h-1)*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=s/n;s+=tmp[clamp(y+k+1,0,h-1)*w+x]-tmp[clamp(y-k,0,h-1)*w+x];}}
  return out;
}
// 한 번 찍기. fx, fy: 텍셀 좌표(연속, 아래 기준), p: 압력(0..1)
function stamp(L,tool,fx,fy,p){
  const r=Math.max(1,brush.size*DH),s=brush.str*p,hard=brush.hard;
  const ext=tool==='puff'?2.2:1;          // 퍼프는 원 밖으로도 기울기를 이어 빈 하늘과 매끄럽게 만난다
  const R=r*ext;
  const x0=Math.max(0,Math.floor(fx-R)),x1=Math.min(DW-1,Math.ceil(fx+R));
  const y0=Math.max(0,Math.floor(fy-R)),y1=Math.min(DH-1,Math.ceil(fy+R));
  if(x0>x1||y0>y1)return;
  const w=x1-x0+1,D=L.data;
  const blur=tool==='smooth'?boxBlur(D,x0,y0,x1,y1,Math.max(2,Math.round(r*.18))):null;
  const pk=1.9*s;                          // 퍼프 꼭대기 높이(초안 탑 덩어리 = 1.9)
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x+.5-fx,dy=y+.5-fy,d=Math.sqrt(dx*dx+dy*dy)/r;
    if(d>=ext)continue;
    const i=y*DW+x,f=d>=1?0:1-ss(hard,1,d);
    let v=D[i];
    switch(tool){
      case 'puff':{const cone=d<1?pk*(1-d):-1.9*(d-1);if(cone>v)v=cone;break;}
      case 'add':v+=s*.18*f;break;
      case 'sub':v-=s*.18*f;break;
      case 'smooth':v+=(blur[(y-y0)*w+x-x0]-v)*Math.min(1,s*.6*f);break;
      case 'light':v+=s*.06*f;break;
      case 'dark':v-=s*.06*f;break;
      case 'reset':v-=v*Math.min(1,s*.35*f);break;
    }
    D[i]=clamp(v,L.min,L.max);
  }
  L.dirty=true;
}

// ---------- 레이아웃 / 좌표 ----------
const cur=$('cur'),CG=cur.getContext('2d');
let cssW=1,cssH=1,doc={x:0,y:0,w:1,h:1};   // 문서 사각형(CSS px, 위 기준)
function layout(){
  cssW=innerWidth;cssH=innerHeight;
  const h=Math.min(cssH,cssW/(DA||1)),w=h*(DA||1);
  doc={x:(cssW-w)/2,y:(cssH-h)/2,w,h};
  const s=Math.min(devicePixelRatio||1,1)*.8;
  c.width=Math.round(cssW*s);c.height=Math.round(cssH*s);gl.viewport(0,0,c.width,c.height);
  const dpr=devicePixelRatio||1;cur.width=Math.round(cssW*dpr);cur.height=Math.round(cssH*dpr);
  CG.setTransform(dpr,0,0,dpr,0,0);
  dirty=true;drawCursor();
}
addEventListener('resize',layout);
function toTex(e){const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left-doc.x)/doc.w*DW,y:(1-(e.clientY-r.top-doc.y)/doc.h)*DH,cx:e.clientX-r.left,cy:e.clientY-r.top};}

// ---------- 커서 / 상태 ----------
let hover=null;
function drawCursor(){
  CG.clearRect(0,0,cssW,cssH);if(!hover)return;
  const r=brush.size*doc.h;
  CG.lineWidth=1.5;CG.strokeStyle='rgba(20,10,30,.55)';CG.beginPath();CG.arc(hover.cx,hover.cy,r+1,0,Math.PI*2);CG.stroke();
  CG.lineWidth=1;CG.strokeStyle='rgba(255,245,235,.9)';CG.beginPath();CG.arc(hover.cx,hover.cy,r,0,Math.PI*2);CG.stroke();
  if(brush.hard>0.05){CG.setLineDash([3,4]);CG.strokeStyle='rgba(255,245,235,.45)';CG.beginPath();CG.arc(hover.cx,hover.cy,r*brush.hard,0,Math.PI*2);CG.stroke();CG.setLineDash([]);}
  CG.fillStyle='rgba(255,245,235,.9)';CG.fillRect(hover.cx-1,hover.cy-1,2,2);
}
function showStat(t){
  if(!t){$('stat').textContent=`문서 ${DW}×${DH} · 화면비 ${DA.toFixed(2)}`;return;}
  const x=Math.floor(t.x),y=Math.floor(t.y);
  if(x<0||y<0||x>=DW||y>=DH){$('stat').textContent='문서 밖';return;}
  const i=y*DW+x;
  $('stat').textContent=`밀도 ${LAY.den.data[i].toFixed(2)} · 투과율 보정 ${LAY.tr.data[i]>=0?'+':''}${LAY.tr.data[i].toFixed(2)} · (${x}, ${y})`;
}

// ---------- 그리기 입력 ----------
let stroke=null;
c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.button!==2)return;
  e.preventDefault();c.setPointerCapture(e.pointerId);
  const k=brush.layer,base=brush.tool[k],inv=e.altKey||e.button===2;
  stroke={id:e.pointerId,k,tool:inv&&INV[base]?INV[base]:base,last:toTex(e)};
  pushUndo(k);c.classList.add('painting');
  const t=stroke.last;stamp(LAY[k],stroke.tool,t.x,t.y,pressure(e));
  hover=t;drawCursor();showStat(t);
});
function pressure(e){return e.pointerType==='pen'&&e.pressure>0?e.pressure:1;}
c.addEventListener('pointermove',e=>{
  const t=toTex(e);hover=t;c.classList.add('hover');drawCursor();showStat(t);
  if(!stroke||e.pointerId!==stroke.id)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  const L=LAY[stroke.k],step=Math.max(.75,brush.size*DH*.18);
  for(const ev of (evs.length?evs:[e])){
    const q=toTex(ev),a=stroke.last,dist=Math.hypot(q.x-a.x,q.y-a.y);
    if(dist<step)continue;
    const n=Math.floor(dist/step),p=pressure(ev);
    for(let j=1;j<=n;j++){const u=j*step/dist;stamp(L,stroke.tool,a.x+(q.x-a.x)*u,a.y+(q.y-a.y)*u,p);}
    stroke.last={x:a.x+(q.x-a.x)*n*step/dist,y:a.y+(q.y-a.y)*n*step/dist};
  }
});
function endStroke(e){if(!stroke||e.pointerId!==stroke.id)return;stroke=null;c.classList.remove('painting');scheduleSave();}
c.addEventListener('pointerup',endStroke);c.addEventListener('pointercancel',endStroke);
c.addEventListener('pointerleave',()=>{if(stroke)return;hover=null;c.classList.remove('hover');drawCursor();showStat(null);});

addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input[type=file],select'))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click();return;}
  if(mod&&k==='y'){e.preventDefault();$('redo').click();return;}
  if(mod)return;
  if(e.key==='['){setSize(brush.size/1.15);}
  else if(e.key===']'){setSize(brush.size*1.15);}
  else if(e.key==='1'){setLayer('den');}
  else if(e.key==='2'){setLayer('tr');}
});

// ---------- 레이어 일괄 동작 ----------
$('clearL').onclick=()=>{const k=brush.layer;pushUndo(k);LAY[k].data.fill(LAY[k].empty);LAY[k].dirty=true;scheduleSave();};
$('fromDraft').onclick=()=>{pushUndo('den');fillDraft();scheduleSave();};
$('newDoc').onclick=()=>{
  if(!confirm('현재 화면 비율로 새 캔버스를 만듭니다. 두 레이어와 실행 취소 기록이 비워집니다(저장하지 않은 편집은 사라짐).'))return;
  allocDoc(Math.round(DOC_H*clamp(innerWidth/innerHeight,.5,3)),DOC_H);scheduleSave();showStat(null);};

// ---------- 저장 / 불러오기 ----------
// tsukuyomi-cloud-doc v1: 맵은 [min,max] 범위를 16비트(리틀 엔디언)로 양자화한 base64. 행 0 = 문서 아래.
function enc(L){const span=L.max-L.min,q=new Uint16Array(L.data.length);
  for(let i=0;i<q.length;i++)q[i]=Math.round(clamp((L.data[i]-L.min)/span,0,1)*65535);
  const u8=new Uint8Array(q.buffer);let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return {min:L.min,max:L.max,enc:'u16le-b64',data:btoa(s)};}
function dec(o,L){if(o.enc!=='u16le-b64')throw new Error('알 수 없는 인코딩: '+o.enc);
  const s=atob(o.data),u8=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);
  const q=new Uint16Array(u8.buffer);if(q.length!==L.data.length)throw new Error('맵 크기가 맞지 않습니다');
  const span=o.max-o.min;for(let i=0;i<q.length;i++)L.data[i]=clamp(o.min+q[i]/65535*span,L.min,L.max);L.dirty=true;}
const PIDS=['cov','sharp','soft','scale','absorb','sun','grain'];
function serialize(){return {type:'tsukuyomi-cloud-doc',version:1,w:DW,h:DH,aspect:DA,horizon:.12,
  params:Object.fromEntries(PIDS.map(id=>[id,+$(id).value])),
  brush:{size:brush.size,str:brush.str,hard:brush.hard},
  layers:{density:enc(LAY.den),transmittance:enc(LAY.tr)}};}
function deserialize(o){
  if(!o||o.type!=='tsukuyomi-cloud-doc'||o.version!==1)throw new Error('구름 문서(tsukuyomi-cloud-doc v1)가 아닙니다');
  const w=o.w|0,h=o.h|0;if(w<8||h<8||w>4096||h>4096)throw new Error('문서 크기가 올바르지 않습니다');
  allocDoc(w,h);dec(o.layers.density,LAY.den);dec(o.layers.transmittance,LAY.tr);
  if(o.params)for(const id of PIDS)if(id in o.params){$(id).value=o.params[id];$(id).dispatchEvent(new Event('input'));}
  showStat(null);
}
const LS_KEY='tsukuyomi.cloudEditor.v1';
let saveT=0;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(serialize()));}catch(e){}},500);}
$('save').onclick=()=>{
  const blob=new Blob([JSON.stringify(serialize())],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`cloud-doc-${new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('load').onclick=()=>$('file').click();
$('file').onchange=async()=>{const f=$('file').files[0];$('file').value='';if(!f)return;
  try{deserialize(JSON.parse(await f.text()));scheduleSave();}catch(err){alert('불러오기 실패: '+err.message);}};

// ---------- 질감 파라미터 / 보기 ----------
PIDS.forEach(id=>{const el=$(id),o=$(id+'O');const f=()=>o.textContent=(+el.value).toFixed(id==='sun'?0:2);
  el.addEventListener('input',()=>{f();dirty=true;scheduleSave();});f();});
$('view').addEventListener('change',()=>dirty=true);
$('ovl').addEventListener('change',()=>dirty=true);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let animate=!reduce,dirty=true,tAcc=0,last=performance.now();
const ab=$('anim');
const syncAnim=()=>{ab.textContent=animate?'흐름 멈추기':'흐름 재생';ab.setAttribute('aria-pressed',animate)};syncAnim();
ab.onclick=()=>{animate=!animate;syncAnim();dirty=true};
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};

// ---------- 시작: 자동 저장본 → 없으면 초안 형태 ----------
(function boot(){
  let restored=false;
  try{const s=localStorage.getItem(LS_KEY);if(s){deserialize(JSON.parse(s));restored=true;}}catch(e){console.warn('자동 저장본 복원 실패',e);}
  if(!restored){allocDoc(Math.round(DOC_H*clamp(innerWidth/innerHeight,.5,3)),DOC_H);fillDraft();}
  setLayer('den');showStat(null);
  if(innerWidth<600)document.querySelectorAll('.panel details')[1].open=false;   // 좁은 화면: 칠할 자리 확보
})();

function frame(now){
  const dt=(now-last)/1000;last=now;if(animate){tAcc+=dt;dirty=true;}
  if(LAY.den.dirty||LAY.tr.dirty){upload();dirty=true;}
  if(dirty){dirty=false;
    gl.uniform2f(U('uRes'),c.width,c.height);gl.uniform1f(U('uTime'),tAcc+20.);
    PIDS.forEach(id=>{if(id!=='sun')gl.uniform1f(U('u'+id[0].toUpperCase()+id.slice(1)),+$(id).value)});
    const a=+$('sun').value*Math.PI/180;gl.uniform2f(U('uSun'),Math.cos(a),Math.sin(a));
    gl.uniform1i(U('uView'),+$('view').value);
    const k=c.width/cssW;
    gl.uniform4f(U('uDoc'),doc.x*k,(cssH-doc.y-doc.h)*k,doc.w*k,doc.h*k);gl.uniform1f(U('uDocA'),DA);
    gl.uniform1i(U('uOverlay'),$('ovl').checked?1:0);gl.uniform1i(U('uLayer'),brush.layer==='den'?0:1);
    gl.drawArrays(gl.TRIANGLES,0,3);}
  requestAnimationFrame(frame);
}
if(gl)requestAnimationFrame(frame);
</script>
</body>
</html>
