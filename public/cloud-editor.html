<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름 브러시 에디터</title>
<!--
  구름 셰이더 초안(루트 "구름 셰이더 초안.html")을 브러시 편집 구조로 옮긴 에디터.
  셰이더·장면 프리셋·문서 형식은 cloud-doc.js(장면 tsukuyomi.js와 공용)에 있다.
    ① 밀도 맵: 엔벨로프(큰 형태). 잔 혹은 빌로우 노이즈, 거대 형태 음영은 이 맵을 광원 쪽으로 적분.
    ② 투과율 보정 맵: 자기 그림자(거대 형태 투과율)에 더하는 부호 있는 보정값.
  장면(황혼/낮)마다 작업본이 따로 있고, "장면에 적용"하면 장면(/)이 같은 셰이더로 구워 그 장면의 구름 대신 그린다.
  새 문서는 수평선을 장면과 같은 높이에 두므로, 에디터 창과 장면 창 크기가 같으면 보이는 그대로 적용된다.
-->
<style>
:root{
  --panel:rgba(28,22,44,.74); --ink:#f3e9f0; --muted:#bfaecb; --accent:#ffd9a8; --on-accent:#2a1f36; --line:rgba(255,255,255,.14); --ok:#9fe3b0; --warn:#ffc58a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --panel:rgba(255,248,252,.8); --ink:#2a1f36; --muted:#6a5878; --accent:#9a4d2c; --on-accent:#fff; --line:rgba(40,20,60,.16); --ok:#1f7a3a; --warn:#a0520f;} }
:root[data-theme="light"]{ --panel:rgba(255,248,252,.8); --ink:#2a1f36; --muted:#6a5878; --accent:#9a4d2c; --on-accent:#fff; --line:rgba(40,20,60,.16); --ok:#1f7a3a; --warn:#a0520f;}
:root[data-theme="dark"]{ --panel:rgba(28,22,44,.74); --ink:#f3e9f0; --muted:#bfaecb; --accent:#ffd9a8; --on-accent:#2a1f36; --line:rgba(255,255,255,.14); --ok:#9fe3b0; --warn:#ffc58a;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#2b2440;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none;cursor:crosshair}
#c.painting,#c.hover{cursor:none}
#cur{pointer-events:none}
.panel{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(296px,calc(100% - 24px));
  background:var(--panel);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;
  max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.panel details+details{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}
.row label{color:var(--muted)} .row output{color:var(--accent);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
select,button,.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;text-decoration:none}
button:disabled{opacity:.4;cursor:default}
select:focus-visible,button:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grp{margin:8px 0}
.grp>.lbl{display:block;color:var(--muted);margin-bottom:4px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
button.primary{border-color:var(--accent);color:var(--accent);font-weight:600}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);margin:6px 0}
.chk input{accent-color:var(--accent);margin:0}
details summary{cursor:pointer;color:var(--muted)}
details summary strong{color:var(--ink)}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.stat{color:var(--muted);font-size:12px;margin:8px 0 0;font-variant-numeric:tabular-nums;min-height:1.4em}
.apply{font-size:12px;margin:6px 0 0;color:var(--muted)}
.apply b{font-weight:600}
.apply .on{color:var(--ok)} .apply .stale{color:var(--warn)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
code{font-size:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#err{position:fixed;left:12px;bottom:12px;max-width:calc(100% - 24px);background:#5a1f2a;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="구름 편집 캔버스"></canvas>
<canvas id="cur" aria-hidden="true"></canvas>
<div class="panel">
  <details open>
  <summary><strong>장면</strong></summary>
  <div class="grp">
    <div class="seg" role="group" aria-label="편집할 장면">
      <button type="button" data-scene="dusk" aria-pressed="true">황혼</button>
      <button type="button" data-scene="day" aria-pressed="false">낮</button>
    </div></div>
  <div class="btns">
    <button type="button" id="apply" class="primary">장면에 적용</button>
    <button type="button" id="unapply">적용 해제</button>
    <a class="btn" href="/" target="_blank" rel="noopener">장면 열기 ↗</a>
  </div>
  <p class="apply" id="applyStat" aria-live="polite"></p>
  <label class="chk"><input type="checkbox" id="guides" checked> 화면 비율 가이드(휴대폰 · 16:9)</label>
  </details>
  <details open>
  <summary><strong>브러시 편집</strong></summary>
  <div class="grp"><span class="lbl">레이어</span>
    <div class="seg" role="group" aria-label="편집 레이어">
      <button type="button" data-layer="den" aria-pressed="true">밀도(형태)</button>
      <button type="button" data-layer="tr" aria-pressed="false">자기 그림자 투과율</button>
    </div></div>
  <div class="grp"><span class="lbl">도구</span><div class="seg" id="tools" role="group" aria-label="브러시 도구"></div></div>
  <div class="row"><label for="bSize">크기</label><output id="bSizeO"></output><input id="bSize" type="range" min="0.01" max="0.3" step="0.005" value="0.07"></div>
  <div class="row"><label for="bStr">세기</label><output id="bStrO"></output><input id="bStr" type="range" min="0.05" max="1" step="0.01" value="0.6"></div>
  <div class="row"><label for="bHard">경도</label><output id="bHardO"></output><input id="bHard" type="range" min="0" max="0.95" step="0.01" value="0.3"></div>
  <label class="chk"><input type="checkbox" id="ovl" checked> 편집 레이어 겹쳐 보기</label>
  <div class="btns">
    <button type="button" id="undo" title="Ctrl+Z">실행 취소</button>
    <button type="button" id="redo" title="Ctrl+Shift+Z">다시 실행</button>
    <button type="button" id="clearL">레이어 비우기</button>
    <button type="button" id="fromDraft">초안 형태로</button>
  </div>
  <div class="btns">
    <button type="button" id="save">저장(JSON)</button>
    <button type="button" id="load">불러오기</button>
    <button type="button" id="newDoc">새 캔버스</button>
    <input type="file" id="file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
  </div>
  <p class="hint" id="toolHint"></p>
  <p class="hint"><kbd>Alt</kbd>/우클릭 반대 동작 · <kbd>[</kbd><kbd>]</kbd> 크기 · <kbd>1</kbd><kbd>2</kbd> 레이어 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 취소</p>
  <p class="stat" id="stat" aria-live="off"></p>
  </details>
  <details open>
  <summary><strong>적운 질감 파라미터</strong></summary>
  <div class="row"><label for="view">보기</label>
    <select id="view">
      <option value="0">최종 합성</option>
      <option value="1">밀도(형태)</option>
      <option value="2">자기 그림자(투과율)</option>
      <option value="3">빌로우 노이즈 원본</option>
      <option value="4">편집 맵: 밀도(엔벨로프)</option>
      <option value="5">편집 맵: 투과율 보정</option>
    </select></div>
  <div class="row"><label for="cov">덮임 정도</label><output id="covO"></output><input id="cov" type="range" min="0.2" max="0.8" step="0.01" value="0.5"></div>
  <div class="row"><label for="sharp">윗면 경계 선명도</label><output id="sharpO"></output><input id="sharp" type="range" min="0.01" max="0.3" step="0.005" value="0.04"></div>
  <div class="row"><label for="soft">아랫면 흐림</label><output id="softO"></output><input id="soft" type="range" min="0.05" max="0.6" step="0.01" value="0.3"></div>
  <div class="row"><label for="scale">덩어리 크기</label><output id="scaleO"></output><input id="scale" type="range" min="2" max="12" step="0.1" value="5.5"></div>
  <div class="row"><label for="absorb">그림자 깊이</label><output id="absorbO"></output><input id="absorb" type="range" min="0.2" max="4" step="0.05" value="1.6"></div>
  <div class="row"><label for="sun">빛 방향(°)</label><output id="sunO"></output><input id="sun" type="range" min="20" max="160" step="1" value="105"></div>
  <div class="row"><label for="grain">필름 그레인(미리보기만)</label><output id="grainO"></output><input id="grain" type="range" min="0" max="0.12" step="0.005" value="0.05"></div>
  <div class="btns"><button type="button" id="anim" aria-pressed="true">흐름 멈추기</button><button type="button" id="theme">패널 테마</button></div>
  <p class="hint">"자기 그림자" 보기에서 덩어리마다 위가 밝고 아래가 어두워야 콜리플라워 질감이 납니다. 투과율 보정은 그 위에 더해집니다. 적용 시 흐름은 그 순간의 모양으로 고정됩니다.</p>
  </details>
</div>
<div id="err" role="alert"></div>
<script src="cloud-doc.js"></script>
<script>
'use strict';
const CD=window.CloudDoc;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const fract=x=>x-Math.floor(x);
function fail(msg){const e=$('err');e.textContent=msg;e.style.display='block';}
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}};

// ---------- 렌더러 ----------
const c=$('c');
const R=CD.createRenderer(c);
if(!R.ok){fail(R.error+' 에디터를 열 수 없습니다.');throw new Error(R.error);}

// ---------- 문서 ----------
// doc: CloudDoc 문서(den/tr 배열을 브러시가 직접 고친다). 장면마다 작업본이 따로 있다.
const LAY={den:{name:'밀도(형태)',...CD.RANGE.den},tr:{name:'자기 그림자 투과율',...CD.RANGE.tr}};
const DOC_H=288;          // 새 문서 세로 해상도(텍셀). 엔벨로프는 부드럽고 잔 혹은 노이즈가 만든다. 두 장면 × 작업본/적용본이 localStorage에 들어가는 크기
let scene='dusk',doc=null;
const dirtyL={den:true,tr:true};
let staleApply=false;     // 적용 이후 수정됨
function useDoc(d){
  doc=d;R.alloc(doc.w,doc.h);dirtyL.den=dirtyL.tr=true;
  undoS.length=0;redoS.length=0;syncUndo();
  for(const id of CD.PIDS){$(id).value=doc.params[id];showParam(id);}
  layout();showStat(null);
}
function newDocFor(sc){
  const A=clamp(innerWidth/innerHeight,.5,3.5);
  const d=CD.blank(sc,Math.round(DOC_H*A),DOC_H,1-CD.SCENE_HZ_RATIO);
  if(sc==='dusk')fillDraft(d);
  return d;
}
function loadWork(sc){
  const s=store.get(CD.KEY.work(sc));
  if(s){try{return CD.parse(JSON.parse(s),sc);}catch(e){console.warn('작업본 복원 실패',e);}}
  if(sc==='dusk'){   // 첫 판(v1) 자동 저장본은 황혼 작업본으로 옮긴다
    const old=store.get(CD.KEY.legacy);
    if(old){try{return CD.parse(JSON.parse(old),'dusk');}catch(e){}}
  }
  return newDocFor(sc);
}
function upload(){for(const k of ['den','tr'])if(dirtyL[k]){dirtyL[k]=false;R.upload(k,doc[k]);}}

// 초안의 절차적 엔벨로프(수평선 구름띠 + 적란운 탑 + 왼쪽 무리)를 밀도 맵에 굽는다.
// 초안은 수평선 0.12·하늘 0.88 기준이라 문서 하늘 높이에 맞춰 수평선 기준으로 균일하게 줄여 넣는다.
function hash12(x,y){let a=fract(x*.1031),b=fract(y*.1031),c3=fract(x*.1031);
  const d=a*(b+33.33)+b*(c3+33.33)+c3*(a+33.33);a+=d;b+=d;c3+=d;return fract((a+b)*c3);}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash12(ix,iy),b2=hash12(ix+1,iy),c2=hash12(ix,iy+1),d=hash12(ix+1,iy+1);
  return (a+(b2-a)*ux)+((c2+(d-c2)*ux)-(a+(b2-a)*ux))*uy;}
function vfbm(x,y){let n=0,a=.5;for(let i=0;i<3;i++){n+=a*vnoise(x,y);x*=2.1;y*=2.1;a*=.5;}return n/.875;}
function draftEnv(x,y,A){
  const sdE=(cx,cy,rx,ry)=>1-Math.hypot((x-cx)/rx,(y-cy)/ry);
  const h=.12,bankTop=h+.13+.07*vfbm(x*1.6,3),bank=(bankTop-y)/.10;
  let t=sdE(A*.66,.40,.26,.24);
  t=Math.max(t,sdE(A*.62,.56,.14,.15),sdE(A*.74,.50,.15,.14),sdE(A*.86,.36,.20,.13));
  const l=Math.max(sdE(A*.10,.34,.20,.11),sdE(A*.20,.29,.18,.09));
  return Math.max(bank,t*1.9,l*1.6);
}
function fillDraft(d){
  const A=d.w/d.h,s=(1-d.horizon)/.88,A0=A/s,L=LAY.den;
  for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++){
    const ux=((x+.5)/d.h-A/2)/s+A0/2,uy=.12+((y+.5)/d.h-d.horizon)/s;
    d.den[y*d.w+x]=clamp(draftEnv(ux,uy,A0),L.min,L.max);}
}

// ---------- 실행 취소 ----------
const undoS=[],redoS=[],UNDO_MAX=30;
function pushUndo(k){undoS.push({k,d:doc[k].slice()});if(undoS.length>UNDO_MAX)undoS.shift();redoS.length=0;syncUndo();}
function swapHist(from,to){const s=from.pop();if(!s)return;
  to.push({k:s.k,d:doc[s.k].slice()});doc[s.k].set(s.d);dirtyL[s.k]=true;syncUndo();edited();}
function syncUndo(){$('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length;}
$('undo').onclick=()=>swapHist(undoS,redoS);
$('redo').onclick=()=>swapHist(redoS,undoS);

// ---------- 브러시 ----------
const TOOLS={
  den:[
    {id:'puff',name:'퍼프',hint:'원뿔 덩어리를 겹쳐 찍어 큰 형태를 쌓습니다(초안 퍼프와 같은 방식). 원 테두리가 대략 구름 경계, 세기 = 덩어리 높이. 반대: 깎기'},
    {id:'add',name:'쌓기',hint:'밀도를 서서히 더해 경계를 밖으로 밀어냅니다. 반대: 깎기'},
    {id:'sub',name:'깎기',hint:'밀도를 서서히 덜어 형태를 파냅니다. 반대: 쌓기'},
    {id:'smooth',name:'문지르기',hint:'형태를 부드럽게 뭉갭니다. 퍼프 사이 골을 메울 때.'},
  ],
  tr:[
    {id:'light',name:'밝게',hint:'투과율을 올려 그 자리에 빛이 더 들게 합니다. "자기 그림자" 보기에서 확인. 반대: 어둡게'},
    {id:'dark',name:'어둡게',hint:'투과율을 낮춰 자기 그림자를 깊게 합니다. 반대: 밝게'},
    {id:'reset',name:'되돌리기',hint:'보정을 계산값(0)으로 되돌립니다.'},
    {id:'smooth',name:'문지르기',hint:'보정 경계를 부드럽게 풉니다.'},
  ],
};
const INV={puff:'sub',add:'sub',sub:'add',light:'dark',dark:'light'};
const brush={layer:'den',tool:{den:'puff',tr:'dark'},size:.07,str:.6,hard:.3};
function setLayer(k){brush.layer=k;
  document.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layer===k));
  const box=$('tools');box.textContent='';
  for(const t of TOOLS[k]){const bt=document.createElement('button');bt.type='button';bt.textContent=t.name;bt.dataset.tool=t.id;
    bt.onclick=()=>setTool(t.id);box.appendChild(bt);}
  setTool(brush.tool[k]);dirty=true;}
function setTool(id){brush.tool[brush.layer]=id;
  $('tools').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===id));
  $('toolHint').textContent=TOOLS[brush.layer].find(t=>t.id===id).hint;}
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>setLayer(b.dataset.layer));
[['bSize','size',3],['bStr','str',2],['bHard','hard',2]].forEach(([id,key,dig])=>{
  const el=$(id),o=$(id+'O');const f=()=>{brush[key]=+el.value;o.textContent=(+el.value).toFixed(dig);};
  el.addEventListener('input',()=>{f();drawCursor();});f();});
function setSize(v){const el=$('bSize');el.value=clamp(v,+el.min,+el.max);el.dispatchEvent(new Event('input'));}

// 가로 → 세로 이동 합 박스 블러(문지르기용). 영역 [x0,x1]×[y0,y1] 결과를 영역 크기 배열로 돌려준다
function boxBlur(src,x0,y0,x1,y1,k){
  const DW=doc.w,w=x1-x0+1,h=y1-y0+1,tmp=new Float32Array(w*h),out=new Float32Array(w*h),n=2*k+1;
  for(let y=0;y<h;y++){const row=(y+y0)*DW;let s=0;
    for(let i=-k;i<=k;i++)s+=src[row+clamp(x0+i,0,DW-1)];
    for(let x=0;x<w;x++){tmp[y*w+x]=s/n;s+=src[row+clamp(x0+x+k+1,0,DW-1)]-src[row+clamp(x0+x-k,0,DW-1)];}}
  for(let x=0;x<w;x++){let s=0;
    for(let i=-k;i<=k;i++)s+=tmp[clamp(i,0,h-1)*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=s/n;s+=tmp[clamp(y+k+1,0,h-1)*w+x]-tmp[clamp(y-k,0,h-1)*w+x];}}
  return out;
}
// 한 번 찍기. fx, fy: 텍셀 좌표(연속, 아래 기준), p: 압력(0..1)
function stamp(k,tool,fx,fy,p){
  const L=LAY[k],D=doc[k],DW=doc.w,DH=doc.h;
  const r=Math.max(1,brush.size*DH),s=brush.str*p,hard=brush.hard;
  const ext=tool==='puff'?2.2:1;          // 퍼프는 원 밖으로도 기울기를 이어 빈 하늘과 매끄럽게 만난다
  const Rr=r*ext;
  const x0=Math.max(0,Math.floor(fx-Rr)),x1=Math.min(DW-1,Math.ceil(fx+Rr));
  const y0=Math.max(0,Math.floor(fy-Rr)),y1=Math.min(DH-1,Math.ceil(fy+Rr));
  if(x0>x1||y0>y1)return;
  const w=x1-x0+1;
  const blur=tool==='smooth'?boxBlur(D,x0,y0,x1,y1,Math.max(2,Math.round(r*.18))):null;
  const pk=1.9*s;                          // 퍼프 꼭대기 높이(초안 탑 덩어리 = 1.9)
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x+.5-fx,dy=y+.5-fy,d=Math.sqrt(dx*dx+dy*dy)/r;
    if(d>=ext)continue;
    const i=y*DW+x,f=d>=1?0:1-ss(hard,1,d);
    let v=D[i];
    switch(tool){
      case 'puff':{const cone=d<1?pk*(1-d):-1.9*(d-1);if(cone>v)v=cone;break;}
      case 'add':v+=s*.18*f;break;
      case 'sub':v-=s*.18*f;break;
      case 'smooth':v+=(blur[(y-y0)*w+x-x0]-v)*Math.min(1,s*.6*f);break;
      case 'light':v+=s*.06*f;break;
      case 'dark':v-=s*.06*f;break;
      case 'reset':v-=v*Math.min(1,s*.35*f);break;
    }
    D[i]=clamp(v,L.min,L.max);
  }
  dirtyL[k]=true;
}

// ---------- 레이아웃 / 좌표 ----------
const cur=$('cur'),CG=cur.getContext('2d');
let cssW=1,cssH=1,box={x:0,y:0,w:1,h:1};   // 문서 사각형(CSS px, 위 기준)
let dirty=true;
function layout(){
  cssW=innerWidth;cssH=innerHeight;
  const A=doc?doc.w/doc.h:1;
  const h=Math.min(cssH,cssW/A),w=h*A;
  box={x:(cssW-w)/2,y:(cssH-h)/2,w,h};
  const s=Math.min(devicePixelRatio||1,1)*.8;
  c.width=Math.round(cssW*s);c.height=Math.round(cssH*s);
  const dpr=devicePixelRatio||1;cur.width=Math.round(cssW*dpr);cur.height=Math.round(cssH*dpr);
  CG.setTransform(dpr,0,0,dpr,0,0);
  dirty=true;drawCursor();
}
addEventListener('resize',layout);
function toTex(e){const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left-box.x)/box.w*doc.w,y:(1-(e.clientY-r.top-box.y)/box.h)*doc.h,cx:e.clientX-r.left,cy:e.clientY-r.top};}

// ---------- 오버레이: 화면 비율 가이드 + 브러시 커서 ----------
// 가이드: 장면을 그 화면 크기로 열었을 때 보이는 문서 범위(수평선 위 하늘만). 장면 배치식은 CloudDoc.fit과 같다.
const GUIDES=[{name:'휴대폰',w:390,h:844},{name:'16:9',w:1920,h:1080}];
let hover=null;
function drawGuides(){
  if(!$('guides').checked)return;
  const A=doc.w/doc.h;
  CG.save();CG.font='11px system-ui,sans-serif';CG.lineWidth=1;
  for(const g of GUIDES){
    const HZ=g.h*CD.SCENE_HZ_RATIO,f=CD.fit(doc,g.w,HZ);
    const x0=(0-f.ox)/f.k,x1=(g.w-f.ox)/f.k,yTop=doc.horizon+HZ/f.k;   // 문서 단위
    const px0=box.x+x0/A*box.w,px1=box.x+x1/A*box.w,pyT=box.y+(1-yTop)*box.h,pyB=box.y+(1-doc.horizon)*box.h;
    CG.setLineDash([6,5]);CG.strokeStyle='rgba(20,10,30,.5)';CG.strokeRect(px0+1,pyT+1,px1-px0,pyB-pyT);
    CG.strokeStyle='rgba(255,245,235,.7)';CG.strokeRect(px0,pyT,px1-px0,pyB-pyT);
    CG.setLineDash([]);CG.fillStyle='rgba(255,245,235,.85)';
    CG.fillText(g.name,Math.max(box.x,px0)+6,Math.max(box.y,pyT)+14);
  }
  CG.restore();
}
function drawCursor(){
  CG.clearRect(0,0,cssW,cssH);if(!doc)return;
  drawGuides();
  if(!hover)return;
  const r=brush.size*box.h;
  CG.lineWidth=1.5;CG.strokeStyle='rgba(20,10,30,.55)';CG.beginPath();CG.arc(hover.cx,hover.cy,r+1,0,Math.PI*2);CG.stroke();
  CG.lineWidth=1;CG.strokeStyle='rgba(255,245,235,.9)';CG.beginPath();CG.arc(hover.cx,hover.cy,r,0,Math.PI*2);CG.stroke();
  if(brush.hard>0.05){CG.setLineDash([3,4]);CG.strokeStyle='rgba(255,245,235,.45)';CG.beginPath();CG.arc(hover.cx,hover.cy,r*brush.hard,0,Math.PI*2);CG.stroke();CG.setLineDash([]);}
  CG.fillStyle='rgba(255,245,235,.9)';CG.fillRect(hover.cx-1,hover.cy-1,2,2);
}
$('guides').addEventListener('change',drawCursor);
function showStat(t){
  if(!t){$('stat').textContent=`${CD.PRESETS[scene].name} 문서 ${doc.w}×${doc.h} · 화면비 ${(doc.w/doc.h).toFixed(2)} · 수평선 ${doc.horizon.toFixed(2)}`;return;}
  const x=Math.floor(t.x),y=Math.floor(t.y);
  if(x<0||y<0||x>=doc.w||y>=doc.h){$('stat').textContent='문서 밖';return;}
  const i=y*doc.w+x,tv=doc.tr[i];
  $('stat').textContent=`밀도 ${doc.den[i].toFixed(2)} · 투과율 보정 ${tv>=0?'+':''}${tv.toFixed(2)} · (${x}, ${y})`;
}

// ---------- 그리기 입력 ----------
let stroke=null;
c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.button!==2)return;
  e.preventDefault();c.setPointerCapture(e.pointerId);
  const k=brush.layer,base=brush.tool[k],inv=e.altKey||e.button===2;
  stroke={id:e.pointerId,k,tool:inv&&INV[base]?INV[base]:base,last:toTex(e)};
  pushUndo(k);c.classList.add('painting');
  const t=stroke.last;stamp(k,stroke.tool,t.x,t.y,pressure(e));
  hover=t;drawCursor();showStat(t);
});
function pressure(e){return e.pointerType==='pen'&&e.pressure>0?e.pressure:1;}
c.addEventListener('pointermove',e=>{
  const t=toTex(e);hover=t;c.classList.add('hover');drawCursor();showStat(t);
  if(!stroke||e.pointerId!==stroke.id)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  const step=Math.max(.75,brush.size*doc.h*.18);
  for(const ev of (evs.length?evs:[e])){
    const q=toTex(ev),a=stroke.last,dist=Math.hypot(q.x-a.x,q.y-a.y);
    if(dist<step)continue;
    const n=Math.floor(dist/step),p=pressure(ev);
    for(let j=1;j<=n;j++){const u=j*step/dist;stamp(stroke.k,stroke.tool,a.x+(q.x-a.x)*u,a.y+(q.y-a.y)*u,p);}
    stroke.last={x:a.x+(q.x-a.x)*n*step/dist,y:a.y+(q.y-a.y)*n*step/dist};
  }
});
function endStroke(e){if(!stroke||e.pointerId!==stroke.id)return;stroke=null;c.classList.remove('painting');edited();}
c.addEventListener('pointerup',endStroke);c.addEventListener('pointercancel',endStroke);
c.addEventListener('pointerleave',()=>{if(stroke)return;hover=null;c.classList.remove('hover');drawCursor();showStat(null);});

addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input[type=file],select'))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click();return;}
  if(mod&&k==='y'){e.preventDefault();$('redo').click();return;}
  if(mod)return;
  if(e.key==='['){setSize(brush.size/1.15);}
  else if(e.key===']'){setSize(brush.size*1.15);}
  else if(e.key==='1'){setLayer('den');}
  else if(e.key==='2'){setLayer('tr');}
});

// ---------- 레이어 일괄 동작 ----------
$('clearL').onclick=()=>{const k=brush.layer;pushUndo(k);doc[k].fill(LAY[k].empty);dirtyL[k]=true;edited();};
$('fromDraft').onclick=()=>{pushUndo('den');fillDraft(doc);dirtyL.den=true;edited();};
$('newDoc').onclick=()=>{
  if(!confirm(`${CD.PRESETS[scene].name} 작업본을 현재 화면 비율로 새로 만듭니다. 두 레이어와 실행 취소 기록이 비워집니다(장면에 적용한 문서는 그대로).`))return;
  useDoc(newDocFor(scene));edited();};

// ---------- 장면 / 저장 ----------
// 작업본은 편집할 때마다 자동 저장, "장면에 적용"은 적용본 키에 따로 써서 장면(/)이 읽는다(다른 탭의 장면도 storage 이벤트로 즉시 갱신).
let saveT=0,quotaWarn=false;
function edited(){staleApply=true;showApply();clearTimeout(saveT);saveT=setTimeout(saveWork,500);}
function saveWork(){clearTimeout(saveT);if(!doc)return;
  quotaWarn=!store.set(CD.KEY.work(scene),JSON.stringify(CD.serialize(doc)));showApply();}
function showApply(){
  const el=$('applyStat'),has=!!store.get(CD.KEY.applied(scene));
  el.textContent='';
  const b=document.createElement('b');
  if(!has){b.textContent='적용 안 됨';el.append(`${CD.PRESETS[scene].name} 장면: `,b,' (기본 구름 사용)');}
  else if(staleApply){b.textContent='적용 후 수정됨';b.className='stale';el.append(`${CD.PRESETS[scene].name} 장면: `,b);}
  else{b.textContent='적용됨';b.className='on';el.append(`${CD.PRESETS[scene].name} 장면: `,b);}
  if(quotaWarn)el.append(' · 브라우저 저장 공간이 부족해 자동 저장하지 못했습니다. JSON으로 저장해 두세요.');
  $('unapply').disabled=!has;
}
$('apply').onclick=()=>{
  if(!store.set(CD.KEY.applied(scene),JSON.stringify(CD.serialize(doc)))){
    alert('브라우저 저장 공간이 부족해 적용하지 못했습니다. 다른 장면의 적용을 해제하거나 JSON으로 저장해 public/clouds/에 넣어 주세요.');return;}
  staleApply=false;showApply();};
$('unapply').onclick=()=>{store.del(CD.KEY.applied(scene));staleApply=true;showApply();};
function setScene(sc){
  if(doc)saveWork();
  scene=sc;
  document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===sc));
  staleApply=false;
  useDoc(loadWork(sc));
  showApply();
}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{if(b.dataset.scene!==scene)setScene(b.dataset.scene);});
$('save').onclick=()=>{
  const blob=new Blob([JSON.stringify(CD.serialize(doc))],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${scene}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('load').onclick=()=>$('file').click();
$('file').onchange=async()=>{const f=$('file').files[0];$('file').value='';if(!f)return;
  try{const d=CD.parse(JSON.parse(await f.text()),scene);
    if(d.scene!==scene)setScene(d.scene);
    useDoc(d);edited();}catch(err){alert('불러오기 실패: '+err.message);}};

// ---------- 질감 파라미터 / 보기 ----------
function showParam(id){$(id+'O').textContent=(+$(id).value).toFixed(id==='sun'?0:2);}
CD.PIDS.forEach(id=>{$(id).addEventListener('input',()=>{showParam(id);doc.params[id]=+$(id).value;dirty=true;edited();});});
$('view').addEventListener('change',()=>dirty=true);
$('ovl').addEventListener('change',()=>dirty=true);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let animate=!reduce,last=performance.now();
const ab=$('anim');
const syncAnim=()=>{ab.textContent=animate?'흐름 멈추기':'흐름 재생';ab.setAttribute('aria-pressed',animate)};syncAnim();
ab.onclick=()=>{animate=!animate;syncAnim();dirty=true;if(!animate)edited();};
$('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
addEventListener('pagehide',saveWork);

// ---------- 시작 ----------
setLayer('den');
setScene('dusk');
if(innerWidth<600)document.querySelectorAll('.panel details')[2].open=false;   // 좁은 화면: 칠할 자리 확보

function frame(now){
  const dt=(now-last)/1000;last=now;
  if(animate){doc.time+=dt;dirty=true;}   // 흐름 시간은 문서에 실려 적용 시 그 순간의 모양으로 굽힌다
  if(dirtyL.den||dirtyL.tr){upload();dirty=true;}
  if(dirty){dirty=false;
    const k=c.width/cssW;
    R.render({rect:[box.x*k,(cssH-box.y-box.h)*k,box.w*k,box.h*k],doc,preset:CD.PRESETS[scene],mode:0,
      view:+$('view').value,overlay:$('ovl').checked,layer:brush.layer});}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
