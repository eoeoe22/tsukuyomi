<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>月 | ( ◠ ᗜ ◠ )</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="tsukuyomi.css">
    <link rel="stylesheet" href="tsukuyomi.markup.css">
    <link rel="stylesheet" href="tsukuyomi.debug.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="ripple" aria-hidden="true"></canvas>
    <canvas id="fg" aria-hidden="true"></canvas>

    <div class="dock">
        <section class="panel intro-hidden" id="panel" aria-label="장면 전환">
            <div class="icongroup" id="icongroup" role="group" aria-label="낮 / 황혼 / 밤 / 미러볼 선택">
                <span class="thumb" id="thumb" aria-hidden="true"></span>
                <button type="button" id="btnDay" aria-label="낮" aria-pressed="false"><i class="bi bi-sun-fill"
                        aria-hidden="true"></i></button>
                <button type="button" id="btnDusk" class="on" aria-label="황혼" aria-pressed="true"><i
                        class="bi bi-brightness-alt-high-fill" aria-hidden="true"></i></button>
                <button type="button" id="btnNight" aria-label="밤" aria-pressed="false"><i class="bi bi-moon-fill"
                        aria-hidden="true"></i></button>
                <button type="button" id="btnMirror" aria-label="미러볼" aria-pressed="false"><i class="bi bi-globe2"
                        aria-hidden="true"></i></button>
            </div>
            <button type="button" id="btnWallpaper" class="wallpaper-toggle" aria-label="배경화면 감상 모드"
                aria-pressed="false"><i class="bi bi-image-fill" aria-hidden="true"></i></button>
            <span class="sr-only" id="status" aria-live="polite"></span>
        </section>
    </div>

    <!-- 페이지 엔진 개조 준비: 랜드마크 인디케이터 + 카메라 줌 + 플레이스홀더 카드 -->
    <div class="focus-ui" id="focusUi">
        <button type="button" class="focus-pin" id="pinTorii" style="display:none" aria-label="토리이 확대 보기" aria-expanded="false">
            <span class="click-indicator" aria-hidden="true"><span class="pulse"></span><span class="core"></span></span>
            <span class="pin-label" aria-hidden="true"><span class="pin-diag"></span><span class="pin-title">토리이</span></span>
        </button>
        <button type="button" class="focus-pin" id="pinMoon" style="display:none" aria-label="달 확대 보기" aria-expanded="false">
            <span class="click-indicator" aria-hidden="true"><span class="pulse"></span><span class="core"></span></span>
            <span class="pin-label" aria-hidden="true"><span class="pin-diag"></span><span class="pin-title">달</span></span>
        </button>
        <button type="button" class="focus-pin" id="pinMirror" style="display:none" aria-label="미러볼 확대 보기" aria-expanded="false">
            <span class="click-indicator" aria-hidden="true"><span class="pulse"></span><span class="core"></span></span>
            <span class="pin-label" aria-hidden="true"><span class="pin-diag"></span><span class="pin-title">미러볼</span></span>
        </button>
        <button type="button" id="focusBack" hidden aria-label="처음 화면으로 돌아가기"><i class="bi bi-chevron-left"
                aria-hidden="true"></i></button>
        <aside id="focusCard" hidden aria-live="polite" aria-label="랜드마크 정보">
            <h2 id="focusTitle">플레이스홀더</h2>
            <p class="focus-lead" id="focusDesc">내용 준비 중입니다.</p>
            <div class="focus-body" id="focusBody" aria-live="off"></div>
        </aside>
    </div>

    <script src="cloud-doc.js"></script>
    <script src="cloud-live.js"></script>
    <script src="tsukuyomi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.2/dist/purify.min.js" defer></script>
    <script src="tsukuyomi.markup.js" defer></script>
    <script src="tsukuyomi.focus.js" defer></script>
    <script src="tsukuyomi.cloudedit.js" defer></script>
    <script src="tsukuyomi.debug.js" defer></script>
</body>

</html>
