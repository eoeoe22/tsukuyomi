<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원통형 행등 — 수평 투영 (작업본)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#e9e6ef; --fg:#1d1a26; --muted:#5e5870; --line:#c9c3d6; --accent:#b8661f;
--stage-top:#1a2350; --stage-mid:#0e1433; --stage-floor:#2a1d16;
color-scheme:light;
box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){ --bg:#0b0d18; --fg:#ece8f2; --muted:#9a93ad; --line:#2a2c44; --accent:#f0a24c; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0b0d18; --fg:#ece8f2; --muted:#9a93ad; --line:#2a2c44; --accent:#f0a24c; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 40px;display:grid;gap:18px}
h1{font-family:"Shippori Mincho","Noto Serif KR",serif;font-weight:700;font-size:1.6rem;letter-spacing:.02em;margin:0;line-height:1.3}
p.lead{margin:4px 0 0;color:var(--muted);max-width:60ch}
.stage{position:relative;border-radius:6px;overflow:hidden;
background:radial-gradient(120% 80% at 50% 30%,#1a120d 0%,#0b0706 70%,#050303 100%);
display:grid;place-items:center}
canvas{width:100%;max-width:560px;height:auto;aspect-ratio:560/600;display:block}
.ctl{display:grid;grid-template-columns:1fr auto auto;gap:10px 14px;align-items:center}
.ctl label{display:grid;gap:2px;font-size:.9rem;color:var(--muted)}
.ctl label b{color:var(--fg);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.export{display:grid;gap:10px}
.export .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.export .row label{font-size:.9rem;color:var(--muted);display:flex;gap:6px;align-items:center}
textarea{width:100%;height:90px;font:11px/1.4 ui-monospace,Menlo,monospace;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:grid;gap:4px}
.cmp figcaption{font-size:.82rem;color:var(--muted)}
.cmp .box{background:#0b0706;border-radius:4px;display:grid;place-items:center;min-height:120px}
.cmp .box > *{max-width:100%;height:auto}
@media (max-width:520px){ .ctl{grid-template-columns:1fr 1fr} .ctl label{grid-column:1/-1} }
.tune{display:grid;grid-template-columns:1fr;gap:10px 14px;align-items:center}
.tune label{display:grid;gap:2px;font-size:.9rem;color:var(--muted)}
.tune label b{color:var(--fg);font-weight:600}
@media (max-width:520px){ .tune{grid-template-columns:1fr} }
</style>
</head><body>
<!-- ① 형태 원본: 좌우 대칭 실루엣. 원통 몸통(반지름 62, 높이 250). 다리·받침판은 회전체가 아니라 상자로 따로 그린다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<path id="profile" d="M218 70 H342 V320 H218 Z"/>
</svg>
<main>
<header>
<h1>원통형 행등 · 수평 투영 작업본</h1>
<p class="lead">축 위의 등불에서 나간 빛이 아래 띠의 육각별 투각을 지나 나무 바닥에 무늬를 떨어뜨립니다. 등이 돌면 무늬도 함께 돕니다.</p>
</header>
<div class="stage"><canvas id="cv" aria-label="회전하는 원통형 행등"></canvas></div>
<div class="ctl">
<label>시점 기울기 <b id="vt"></b><input type="range" id="tilt" min="-90" max="90" value="34"></label>
<button id="spin" aria-pressed="true">회전 멈춤</button>
<button id="exp">현재 프레임 SVG로 내보내기</button>
</div>
<div class="tune">
<label>수직 간격 <b id="vVert"></b><input type="range" id="inVert" min="0.7" max="1.4" step="0.05" value="1"></label>
<label>광원 높이 <b id="vLight"></b><input type="range" id="inLight" min="145" max="238" step="1" value="175"></label>
<label>바닥 무늬 밝기 <b id="vGain"></b><input type="range" id="inGain" min="0.3" max="1.6" step="0.05" value="1"></label>
</div>
<section class="export" hidden id="exBox">
<div class="row">
<label><input type="checkbox" id="bgOn" checked> 배경 포함</label>
<button id="copy">SVG 코드 복사</button>
<span id="msg" style="font-size:.85rem;color:var(--muted)"></span>
</div>
<textarea id="out" readonly aria-label="SVG 코드"></textarea>
<div class="cmp">
<figure><div class="box" id="snapCv"></div><figcaption>캔버스 (내보낸 순간)</figcaption></figure>
<figure><div class="box" id="snapSvg"></div><figcaption>SVG 결과</figcaption></figure>
</div>
</section>
</main>
<script>
// ===== 설정 =====
const W = 560, H = 600;
const COL = {
wood:'#2a170b', woodRim:'#3b2313', woodEdge:'rgba(255,186,110,0.55)', outline:'#140a04',
back:'rgba(122,52,10,0.42)', inner:'#ffd98f', innerDeep:'#e58a34', bloom:'#ff9a3c',
faceEdge:'rgba(18,8,3,0.55)'
};
const PERIOD = 16;            // 1회전 초
const OUTLINE = 1.5;          // 외곽선 두께(px)
const RIM_T = [70, 78], RIM_B = [312, 320];      // 위·아래 테두리 (나무)
const BAND_UP = [78, 140.4], BAND_LO = [249.6, 312]; // 육각별 투각 띠 62.4px (띠:중간:띠 = 4:7:4)
const RAILS = [140.4, 249.6];   // 가운데 종이창 109.2px을 감싸는 가로대
const POSTS = 4;              // 다리 수 (대각 방향)
const STAR_M = 14;             // 고정: 띠 한 바퀴 14개 (좌우 간격 27.8px)
const STAR_SIZE = 0.4;        // 고정: 별 크기 (작게)
let STAR_VMUL = 1.0;
let LIGHT_Y = 175; // 등불(점광원) 높이: 축 위의 한 점
let FLOOR_GAIN = 1.0;          // 수직 간격 조절기용 (별 사이 거리 배율, 예시 구현본의 dy에 대응)
const STAR_GAP = 0.08;        // 마름모 창 사이 나무살 비율 (작게 → 별 작게·창 크게)
// 받침: 사각 판 + 그 위 얇은 단 + 다리 4개 (모두 R 배수)
const Y_FLOOR = 432;          // 판 밑면(바닥)
const BASE = { half: 0.95, top: 424 };
const STEP = { half: 0.7, top: 421 };
const LEG = { r: 0.8, half: 4.5 };

// ===== ② 프로파일 샘플링 → 높이별 반지름 표 (템플릿 그대로) =====
const pathEl = document.getElementById('profile');
const bb = pathEl.getBBox();
const CX = bb.x + bb.width / 2, Y0 = Math.ceil(bb.y), Y1 = Math.floor(bb.y + bb.height);
const YC = (Y0 + Y_FLOOR) / 2;   // 기울기 회전 중심: 받침까지 포함한 전체의 가운데
const R_LUT = new Float32Array(H + 2);
let PROFILE;
{
const L = pathEl.getTotalLength(), N = 4000;
const raw = [];
for (let i = 0; i < N; i++) { const p = pathEl.getPointAtLength(L * i / N); raw.push([p.y, p.x - CX]); }
let s0 = raw.findIndex((q, i) => q[1] < 0 && raw[(i + 1) % N][1] >= 0);
if (s0 < 0) s0 = 0;
const right = [];
for (let k = 1; k <= N; k++) { const q = raw[(s0 + k) % N]; if (q[1] < 0) break; right.push(q); }
if (right.length && right[0][0] > right[right.length - 1][0]) right.reverse();
PROFILE = right;
let k = 0;
for (let y = 0; y <= H; y++) {
while (k < PROFILE.length - 2 && PROFILE[k + 1][0] < y) k++;
const [y0, r0] = PROFILE[k], [y1, r1] = PROFILE[k + 1];
R_LUT[y] = y1 > y0 ? r0 + (r1 - r0) * Math.min(1, Math.max(0, (y - y0) / (y1 - y0))) : r1;
}
for (let y = 0; y <= H; y++) if (y <= Y0 || y >= Y1) R_LUT[y] = 0;
}
const rAt = y => { const i = Math.max(0, Math.min(H, Math.floor(y))), f = y - i; return R_LUT[i] + (R_LUT[Math.min(H, i + 1)] - R_LUT[i]) * f; };
const drdy = y => rAt(y + 0.5) - rAt(y - 0.5);
const TAU = Math.PI * 2;
const R = rAt((Y0 + Y1) / 2);   // 몸통 반지름 (원통이라 하나)

// ===== ③ 표면 위 곡선·도형 정의 (θ, y) =====
// 육각별 투각 (사진 기준): 납작별(꼭짓점이 양옆). 60° 마름모 타일링에서
// 삼각 격자를 세로로 세워 A열(짝수)은 가운데 1개, B열(홀수)은 위·아래 2개가
// 띠에 걸리도록 배치한다. 정면에는 가운데 줄 별 2개가 온전히 보인다.
// 조절기(예시 구현본 대응): STAR_SIZE=0.4·STAR_M=14 고정, STAR_VMUL=수직 간격 배율(dy)만 조절.
// 수직 간격은 별 사이 거리만 벌리고(위치만 이동), 마름모 창 모양은 그대로 둔다(예시 dy와 동일). 세로줄 엇갈림은 V/2로 고정.
function starHoles(yA, yB, phase) {
const C = TAU * R, Lh = C / STAR_M, V0 = Lh * 2 / Math.sqrt(3), V = V0 * STAR_VMUL, yc = (yA + yB) / 2;
// STAR_SIZE↑ → 나무별↑(마름모 창↓). s>1이면 창끼리 살짝 겹쳐 별이 더 작아진다.
const out = [], s = (1 - STAR_GAP) + (1 - STAR_SIZE) * 0.25;
// B 꼭짓점 → 이웃 C 꼭짓점 세 방향 (납작별용: 동·북서·남서). 모양은 V0 기준 고정.
const Bx_off = -Lh / 3, By_off = V0 / 2;
const D = [[2 * Lh / 3, 0], [-Lh / 3, V0 / 2], [-Lh / 3, -V0 / 2]];
for (let j = -2; j < STAR_M + 2; j++) for (let i = -3; i <= 3; i++) {
const A = [j * Lh + phase, yc + i * V + ((j & 1) ? V / 2 : 0)];   // 어두운 별 중심
const B = [A[0] + Bx_off, A[1] + By_off];
for (const [dx, dy] of D) {
const m = [B[0] + dx / 2, B[1] + dy / 2];          // 마름모 중심
const px = -dy / Math.sqrt(3) / 2, py = dx / Math.sqrt(3) / 2;   // 짧은 대각선 절반
let v = [B, [m[0] + px, m[1] + py], [B[0] + dx, B[1] + dy], [m[0] - px, m[1] - py]];
v = v.map(([x, y]) => [m[0] + (x - m[0]) * s, m[1] + (y - m[1]) * s]);
if (v.every(p => p[1] <= yA) || v.every(p => p[1] >= yB)) continue;
const pts = [];   // 곡면을 따르도록 변을 3등분
for (let e = 0; e < 4; e++) { const [p, q] = [v[e], v[(e + 1) % 4]]; for (let t = 0; t < 3; t++) pts.push([(p[0] + (q[0] - p[0]) * t / 3) / R, p[1] + (q[1] - p[1]) * t / 3]); }
out.push({ th: m[0] / R, pts });
}
}
return out;
}
let BANDS = [];
function rebuildBands() {
const ph = TAU * R / (STAR_M * 2);   // 정면 중앙에 마름모가 오도록 반 칸 이동
BANDS = [
{ y: BAND_UP, holes: starHoles(BAND_UP[0], BAND_UP[1], ph) },
{ y: BAND_LO, holes: starHoles(BAND_LO[0], BAND_LO[1], ph) },
];
}
rebuildBands();

// ===== ③-2 종이창 무늬: 꽃 + 물결 =====
// 좌표는 (θ, y). 광원보다 아래에 있는 무늬만 바닥으로 나가 별무늬 바깥 고리에 맺힌다.
// 바닥 반지름 ρ = R·h/(y−LIGHT_Y) 이라 종이 아래쪽일수록 별무늬 가까이, 광원 가까울수록 멀리 크게 맺힌다.
// 무늬 하나 = 층 목록. 순서대로 칠한다: lit(빛이 비침) / dark(빛을 가림)
const MOTIFS = [];
{
  const S2T = s => s / R;   // 종이 위 호 길이 → 각도
  // 꽃: 바깥쪽 꽃잎 5개 + 안쪽 꽃잎 5개 + 가운데 어둡게 칠함.
  // Layer 0(dark): 5개 바깥 꽃잎을 감싸는 단일 외곽 윤곽선(물결 위나 다른 꽃과 겹쳐도 어두운 테두리가 남음)
  // Layer 1(lit) : 서로 겹치지 않는 바깥 꽃잎 5개 + 안쪽 꽃잎 5개 (가운데는 비워 두어 어둡게 칠해진 상태로 남음)
  const flower = (s0, y0, rf, a0) => {
    const ky = y0 > 180 ? Math.max(0.68, Math.min(1.02, (y0 - 175) / R)) : 1;
    const pt = (du, dv) => [S2T(s0 + du), y0 + dv * ky];
    const w = 0.072 * rf, dOut = 0.54 * rf, rOut = 0.45 * rf, rOd = rOut + w;
    const dIn = 0.285 * rf, rIn = 0.132 * rf, rInDark = rIn + w;
    const s36 = Math.sin(Math.PI / 5), c36 = Math.cos(Math.PI / 5), wh = w * 0.52;

    const innerDarkR = th => {
      let rmax = 0.23 * rf;
      for (let k = 0; k < 5; k++) {
        const ak = a0 + Math.PI / 5 + k * TAU / 5, ca = Math.cos(th - ak), sa = Math.sin(th - ak);
        const disc = rInDark * rInDark - (dIn * sa) * (dIn * sa);
        if (disc >= 0) { const r = dIn * ca + Math.sqrt(disc); if (r > rmax) rmax = r; }
      }
      return rmax;
    };

    const outerDark = [];
    for (let i = 0, n = 80; i < n; i++) {
      const th = a0 + TAU * i / n;
      let rmax = 0;
      for (let k = 0; k < 5; k++) {
        const ak = a0 + k * TAU / 5, ca = Math.cos(th - ak), sa = Math.sin(th - ak);
        const disc = rOd * rOd - (dOut * sa) * (dOut * sa);
        if (disc >= 0) { const r = dOut * ca + Math.sqrt(disc); if (r > rmax) rmax = r; }
      }
      outerDark.push(pt(rmax * Math.cos(th), rmax * Math.sin(th)));
    }

    const sinVal = Math.max(-0.99, Math.min(0.99, (dOut * s36 - wh) / rOut));
    const phi0 = Math.asin(sinVal) + Math.PI / 5;
    const outerPetals = Array.from({ length: 5 }, (_, k) => {
      const ak = a0 + k * TAU / 5, ca = Math.cos(ak), sa = Math.sin(ak), p = [];
      for (let i = 0, n = 18; i <= n; i++) {
        const ph = -phi0 + 2 * phi0 * i / n;
        const et = Math.abs(i / n - 0.5) * 2;
        const pull = Math.pow(Math.max(0, et - 0.72) / 0.28, 2) * (0.028 * rf);
        const u = dOut + (rOut - pull) * Math.cos(ph), v = (rOut - pull) * Math.sin(ph);
        p.push(pt(u * ca - v * sa, u * sa + v * ca));
      }
      for (let i = 0, n = 10; i <= n; i++) {
        const t = 1 - i / n;
        const rMid = innerDarkR(ak + (t * 2 - 1) * (Math.PI / 5 * 0.78));
        const angMax = Math.PI / 5 - Math.asin(Math.min(0.95, wh / rMid));
        const th = ak + (-angMax + 2 * angMax * t), rb = innerDarkR(th);
        p.push(pt(rb * Math.cos(th), rb * Math.sin(th)));
      }
      return p;
    });

    const innerPetals = Array.from({ length: 5 }, (_, k) => {
      const ak = a0 + Math.PI / 5 + k * TAU / 5, cx = dIn * Math.cos(ak), cy = dIn * Math.sin(ak);
      return Array.from({ length: 18 }, (_, i) => {
        const a = TAU * i / 18;
        return pt(cx + rIn * Math.cos(a), cy + rIn * Math.sin(a));
      });
    });

    MOTIFS.push({ kind: 'flower', th: S2T(s0), layers: [
      { lit: false, polys: [outerDark] },
      { lit: true, polys: [...outerPetals, ...innerPetals] },
    ] });
  };

  // 물결(유수 무늬): 바깥·가운데·안쪽 세 줄이 틈 없이 붙은 한 덩어리 띠.
  // 가운데 줄이 가장 짧아서, 양끝에서만 세 갈래 둥근 끝으로 구분된다(윤곽선 없음).
  const wave = (s0, y0, len, amp, phase = 0, flip = 1, sc = 1) => {
    const hL = len * 0.5;
    const Ll1 = hL * (flip > 0 ? 1.00 : 0.74), Ll2 = hL * (flip > 0 ? 0.74 : 1.00);
    const Lr1 = hL * (flip > 0 ? 0.74 : 1.00), Lr2 = hL * (flip > 0 ? 1.00 : 0.74);
    const Lm1 = Math.min(Ll1, Ll2) * 0.72, Lm2 = Math.min(Lr1, Lr2) * 0.72;
    const wOut = 4.6 * sc, wIn = 4.2 * sc, rg = 1.9 * sc;   // rg = 가운데 줄 반폭
    const spine = u => { const t = u / hL; return y0 + amp * Math.sin(t * 1.65 + phase) + 0.7 * sc * Math.cos(t * 2.9 - phase); };
    const wO = u => wOut * (1 - 0.16 * Math.pow(Math.min(1, Math.abs(u) / Math.max(Ll1, Lr1)), 1.6));
    const wI = u => wIn * (1 - 0.16 * Math.pow(Math.min(1, Math.abs(u) / Math.max(Ll2, Lr2)), 1.6));
    const uv = [], N1 = 36, N2 = 10, NC = 12;
    for (let i = 0; i <= N1; i++) { const u = -Ll1 + (Ll1 + Lr1) * i / N1; uv.push([u, -(rg + wO(u))]); }
    { const r = wO(Lr1) * 0.5, vc = -(rg + r); for (let i = 1; i <= NC; i++) { const a = -Math.PI / 2 + Math.PI * i / NC; uv.push([Lr1 + r * Math.cos(a), vc + r * Math.sin(a)]); } }
    for (let i = 1; i <= N2; i++) uv.push([Lr1 - (Lr1 - Lm2) * i / N2, -rg]);
    for (let i = 1; i <= NC; i++) { const a = -Math.PI / 2 + Math.PI * i / NC; uv.push([Lm2 - rg * Math.cos(a), rg * Math.sin(a)]); }
    for (let i = 1; i <= N2; i++) uv.push([Lm2 + (Lr2 - Lm2) * i / N2, +rg]);
    { const r = wI(Lr2) * 0.5, vc = +(rg + r); for (let i = 1; i <= NC; i++) { const a = -Math.PI / 2 + Math.PI * i / NC; uv.push([Lr2 + r * Math.cos(a), vc + r * Math.sin(a)]); } }
    for (let i = 1; i <= N1; i++) { const u = Lr2 - (Lr2 + Ll2) * i / N1; uv.push([u, +(rg + wI(u))]); }
    { const r = wI(-Ll2) * 0.5, vc = +(rg + r); for (let i = 1; i <= NC; i++) { const a = Math.PI / 2 + Math.PI * i / NC; uv.push([-Ll2 + r * Math.cos(a), vc + r * Math.sin(a)]); } }
    for (let i = 1; i <= N2; i++) uv.push([-Ll2 + (Ll2 - Lm1) * i / N2, +rg]);

// ===== ④ 음영: 모두 회전 불변 (안쪽 광원이 축 위에 있으므로) → 기울기 바뀔 때만 계산 =====
const PAPER_H = [[0,'#b8541b'],[0.16,'#e98b3a'],[0.5,'#ffdc9a'],[0.84,'#e98b3a'],[1,'#b8541b']];

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

// 띠: 앞쪽 영역 + 보이는 투각 마름모들

// ===== 받침: 사각 판·단·다리 = 회전하는 상자들 =====

<radialGradient id="hot" gradientUnits="userSpaceOnUse" cx="${f(G.hot.cx)}" cy="${f(G.hot.cy)}" r="${f(G.hot.r)}">${stops(HOT)}</radialGradient>
<radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="${f(G.halo.cx)}" cy="${f(G.halo.cy)}" r="${f(G.halo.r)}">${stops(HALO)}</radialGradient>
<radialGradient id="floor">${stops(FLOOR)}</radialGradient>
<radialGradient id="inner">${stops(INNER)}</radialGradient>
<filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
${bg}${floor}
<rect width="${W}" height="${H}" fill="url(#halo)"/>
<g fill="${COL.bloom}" opacity="0.55" filter="url(#bloom)">${ell}</g>
<g stroke="${COL.faceEdge}" stroke-width="0.7" stroke-linejoin="round">${faceSvg(base.behind)}</g>
<g fill="none" stroke="${COL.outline}" stroke-width="${OUTLINE * 2}">${ell}</g>
<g fill="url(#paperH)">${ell}</g>
<g fill="url(#paperV)">${ell}</g>
<g clip-path="url(#body)">
<g fill="none" stroke="${COL.back}" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">${back.map(plB).join('')}</g>
<rect width="${W}" height="${H}" fill="url(#hot)"/>
${motifSvg}
${bandSvg}
<g fill="none" stroke="${COL.wood}" stroke-linecap="round" stroke-linejoin="round">${front.map(pl).join('')}</g>
${rims}${edgeSvg}${capSvg}
</g>
<g stroke="${COL.faceEdge}" stroke-width="0.7" stroke-linejoin="round">${faceSvg(base.front)}</g>
</svg>`;
}

let last = performance.now(), spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(t) {
const dt = Math.min(0.1, (t - last) / 1000); last = t;
if (spinning) { rot = (rot + dt * TAU / PERIOD) % TAU; draw(); }
requestAnimationFrame(loop);
}
const spinBtn = document.getElementById('spin');
const syncSpin = () => { spinBtn.textContent = spinning ? '회전 멈춤' : '회전 시작'; spinBtn.setAttribute('aria-pressed', String(spinning)); };
spinBtn.addEventListener('click', () => { spinning = !spinning; syncSpin(); });
const tiltEl = document.getElementById('tilt');
tiltEl.addEventListener('input', () => { setTilt(+tiltEl.value); draw(); });

// ===== 육각별 무늬 수동 조절기 (리모트 예시 구현본 대응: dy) =====
// 별 크기·좌우 간격은 고정(STAR_SIZE=0.4, STAR_M=14). 수직 간격만 조절.
const inVert = document.getElementById('inVert');
const vVert = document.getElementById('vVert');
function syncStarUI() { vVert.textContent = '×' + Number(STAR_VMUL).toFixed(2); }
function refreshStars() { rebuildBands(); rebuildFloor(); draw(); }
const inLight = document.getElementById('inLight'), vLight = document.getElementById('vLight');
const inGain = document.getElementById('inGain'), vGain = document.getElementById('vGain');
function syncLightUI() {
  const p = Math.round((LIGHT_Y - RAILS[0]) / (RAILS[1] - RAILS[0]) * 100);
  vLight.textContent = '종이창 위에서 ' + p + '%';
  vGain.textContent = '×' + FLOOR_GAIN.toFixed(2);
}
inLight.addEventListener('input', () => { LIGHT_Y = +inLight.value; syncLightUI(); rebuildFloor(); setTilt(tiltDeg); draw(); });
inGain.addEventListener('input', () => { FLOOR_GAIN = +inGain.value; syncLightUI(); draw(); });
syncLightUI();
inVert.addEventListener('input', () => { STAR_VMUL = +inVert.value; syncStarUI(); refreshStars(); });
syncStarUI();

const outEl = document.getElementById('out'), bgOn = document.getElementById('bgOn');
function doExport() {
const svg = buildSVG(bgOn.checked);
outEl.value = svg;
document.getElementById('exBox').hidden = false;
document.getElementById('snapSvg').innerHTML = svg;
const img = new Image(); img.src = cv.toDataURL(); img.width = W; img.alt = '내보낸 순간의 캔버스';
const box = document.getElementById('snapCv'); box.replaceChildren(img);
document.getElementById('msg').textContent = '';
}
document.getElementById('exp').addEventListener('click', doExport);
bgOn.addEventListener('change', () => { if (!document.getElementById('exBox').hidden) { outEl.value = buildSVG(bgOn.checked); document.getElementById('snapSvg').innerHTML = outEl.value; } });
document.getElementById('copy').addEventListener('click', async () => {
const m = document.getElementById('msg');
try { await navigator.clipboard.writeText(outEl.value); m.textContent = '복사했습니다.'; }
catch { outEl.select(); m.textContent = '자동 복사가 막혀 있어 코드를 선택해 두었습니다. Ctrl+C로 복사하세요.'; }
});

syncSpin();
setTilt(+tiltEl.value); draw(); requestAnimationFrame(loop);
window.__api = { setTilt: d => { tiltEl.value = d; setTilt(d); draw(); }, buildSVG, setRot: r => { rot = r; draw(); }, pause: () => { spinning = false; syncSpin(); },
setLight: y => { inLight.value = y; inLight.dispatchEvent(new Event('input')); },
setStars: o => { if (o.vert != null) { STAR_VMUL = +o.vert; inVert.value = STAR_VMUL; } syncStarUI(); refreshStars(); } };
</script>
</body></html>
