<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스 장면 초안</title>
<!--
  참조: references/news.png
  - 움직이는 것은 앞쪽 바닥 패턴 타일뿐(뉴스장면 바닥 타일.html의 흩뿌림 배열·타일 애니메이션을 그대로 옮겨 원근 투영).
  - 나머지(하늘·태양·구름·토리이·파도 언덕·가로등)는 정적 배치.
  - 에셋: references/newslamp.svg(기둥 길이만 줄임), references/newscloud.svg(배경 사각형 제외한 글리프),
          references/done/torii.svg(색만 팔레트스왑).
  레이어: 뒤 SVG(하늘~토리이·파도 언덕) → 바닥 캔버스 → 앞 SVG(가로등).
  파도 언덕 밑동(맨 앞 진한 띠 포함)은 바닥 캔버스가 덮는다.
  두 SVG와 캔버스는 같은 1600×1066 설계 좌표를 "가운데 맞춰 꽉 채우기(slice)"로 공유한다.
-->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#173f4e}
.layer{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas.layer{pointer-events:none}
</style>
</head>
<body>

<svg class="layer" id="back" viewBox="0 0 1600 1066" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163d4c"/>
      <stop offset=".35" stop-color="#2a6070"/>
      <stop offset=".62" stop-color="#5b98a6"/>
      <stop offset=".75" stop-color="#8fc3cb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".52" stop-color="#fffdf0" stop-opacity=".9"/>
      <stop offset=".68" stop-color="#fbf6dd" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f8f2d6" stop-opacity="0"/>
    </radialGradient>
    <!-- 빛줄기용: 후광과 같은 중심·같은 색에서 끝으로 갈수록 사라짐 → 후광이 그대로 뻗어 나온 것처럼 -->
    <radialGradient id="rayFade" gradientUnits="userSpaceOnUse" cx="815" cy="523" r="470">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="1"/>
      <stop offset=".62" stop-color="#fffdf0" stop-opacity="1"/>
      <stop offset=".8" stop-color="#fbf6dd" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f8f2d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunBody" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8cc6cd"/>
      <stop offset=".45" stop-color="#4a8d9b"/>
      <stop offset="1" stop-color="#2b6474"/>
    </linearGradient>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur10" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- newscloud.svg 글리프 (배경 사각형 제외) -->
    <symbol id="cloud" viewBox="20 41 117 55">
      <rect x="63" y="43" width="42" height="9" rx="4.5"/>
      <rect x="85" y="47" width="9" height="20"/>
      <rect x="22" y="63" width="113" height="10" rx="5"/>
      <rect x="43" y="68" width="10" height="20"/>
      <rect x="25" y="84" width="56" height="10" rx="5"/>
    </symbol>

    <!-- torii.svg 팔레트스왑: 주홍 → --tr, 검정 → --tb / 다리 끝 #2596be (경계 그라데이션) -->
    <linearGradient id="legFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2596be" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#2596be" stop-opacity="0"/>
      <stop offset="1" stop-color="#2596be" stop-opacity="1"/>
    </linearGradient>
    <symbol id="torii" viewBox="124 62 432 360">
      <path style="fill:var(--tr)" d="M216 110H244L247 410H213Z M436 110H464L467 410H433Z M331 118h18v76h-18Z M168 192h344v20h-344Z M146 86Q340 124 534 86L532 108Q340 146 148 108Z"/>
      <path style="fill:var(--tb)" d="M126 64Q340 108 554 64L548 85Q340 126 132 85Z"/>
      <path fill="#2596be" d="M210 392h40v28h-40Z M430 392h40v28h-40Z"/>
      <path fill="url(#legFade)" d="M216 110H244L247 410H213Z M436 110H464L467 410H433Z"/>
    </symbol>
  </defs>

  <rect width="1600" height="1066" fill="url(#sky)"/>

  <!-- 태양: 후광(태양과 같은 중심, 균일) → 빛줄기(사방에 고르게, 약하게) → 테두리 빛 → 본체 -->
  <g id="sun">
    <circle cx="815" cy="523" r="560" fill="url(#glow)" opacity=".7"/>
    <g id="rays" fill="url(#rayFade)" filter="url(#blur10)"></g>
    <circle cx="815" cy="523" r="306" fill="#fffbea" filter="url(#blur18)"/>
    <circle cx="815" cy="523" r="287" fill="url(#sunBody)"/>
  </g>

  <g id="clouds" fill="#eaf4f3"></g>

  <!-- 토리이 (발 = 기준점, 파도 언덕 뒤로 묻힘) -->
  <g id="toriis"></g>

  <!-- 파도 언덕 (밑동은 바닥 캔버스에 가려짐) -->
  <g id="waves"></g>
</svg>

<canvas class="layer" id="floor" aria-label="움직이는 바닥 타일"></canvas>

<svg class="layer" id="front" viewBox="0 0 1600 1066" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- newslamp.svg (기둥 길이만 줄임: 원본 452 → 242) -->
    <symbol id="lamp" viewBox="0 0 200 264">
      <rect x="95" y="18" width="10" height="236" fill="#c9b28c"/>
      <rect x="101" y="18" width="4" height="236" fill="#a8916d"/>
      <rect x="91" y="252" width="18" height="10" rx="2" fill="#8f7a5a"/>
      <polygon points="44,30 156,30 162,78 38,78" fill="#d8c7a0" stroke="#d8c7a0" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="47,34 81.3,34 79.7,74 42,74" fill="#1b3048"/>
      <polygon points="83.3,34 116.7,34 118.3,74 81.7,74" fill="#1b3048"/>
      <polygon points="118.7,34 153,34 158,74 120.3,74" fill="#1b3048"/>
      <rect x="58" y="78" width="84" height="5" rx="1.5" fill="#2a3a4a"/>
      <rect x="63" y="83" width="30" height="5" rx="1" fill="#3a4a5a"/>
      <rect x="60" y="87" width="36" height="40" rx="10" fill="#f4f6f5"/>
      <rect x="66" y="92" width="6" height="26" rx="3" fill="#ffffff" opacity="0.9"/>
      <rect x="65" y="125" width="26" height="4" rx="1" fill="#3a4a5a"/>
      <rect x="107" y="83" width="30" height="5" rx="1" fill="#3a4a5a"/>
      <rect x="104" y="87" width="36" height="40" rx="10" fill="#f4f6f5"/>
      <rect x="110" y="92" width="6" height="26" rx="3" fill="#ffffff" opacity="0.9"/>
      <rect x="109" y="125" width="26" height="4" rx="1" fill="#3a4a5a"/>
    </symbol>
  </defs>
  <g id="lamps"></g>
</svg>

<script>
(function(){
  'use strict';
  const NS='http://www.w3.org/2000/svg';
  const VW=1600, VH=1066;
  const mod=(a,n)=>((a%n)+n)%n;
  const anim=[]; // 매 프레임 호출: fn(초)
  const el=(tag,attrs,parent)=>{ const n=document.createElementNS(NS,tag); for (const k in attrs) n.setAttribute(k,attrs[k]); if (parent) parent.appendChild(n); return n; };
  // 고정 시드 난수 (배치가 매번 같도록)
  function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

  /* ───────── 정적 배치 ───────── */

  // 빛줄기: 태양 중심에서 사방으로 고르게 퍼지는 짧고 옅은 쐐기.
  // 후광과 같은 그라데이션으로 끝이 녹아들어 한 빛처럼 보이고, 위쪽에서 오른쪽 30° 부근만 조금 더 길다.
  (()=>{
    const g=document.getElementById('rays'), R=rng(11), cx=815, cy=523, N=32, PEAK=-60; // -90=위, -60=위에서 오른쪽 30°
    for (let i=0;i<N;i++){
      const deg=i*360/N+(R()-.5)*8, d=mod(deg-PEAK+180,360)-180;
      const a=deg*Math.PI/180, w=(1.2+R()*1.8)*Math.PI/180, L=340+R()*50+90*Math.exp(-(d*d)/(2*16*16));
      const p=[[cx,cy],[cx+Math.cos(a-w)*L,cy+Math.sin(a-w)*L],[cx+Math.cos(a+w)*L,cy+Math.sin(a+w)*L]];
      el('polygon',{points:p.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' '),opacity:(.22+R()*.18).toFixed(2)},g);
    }
  })();

  // 구름 글리프: 작은 것 다수 + 큰 것 몇 개
  (()=>{
    const g=document.getElementById('clouds'), R=rng(7);
    const list=[], SPAN=VW+500;
    const put=(x,y,w,op,flip,col)=>{
      const h=w*55/117;
      const u=el('use',{href:'#cloud',width:w.toFixed(1),height:h.toFixed(1),opacity:op.toFixed(2)},g);
      if (col) u.setAttribute('fill',col);
      // 속도: 설계 단위/초, 방향 무작위, 큰 구름일수록 조금 빠르게(가까워 보이게)
      const v=(R()<.5?-1:1)*(2+R()*5)*(0.7+w/180);
      list.push({u,x,y,w,flip,v});
    };
    anim.push(t=>{
      for (const c of list){
        const x=mod(c.x+c.v*t+250,SPAN)-250;
        c.u.setAttribute('transform',c.flip?`translate(${(x+c.w).toFixed(1)},${c.y.toFixed(1)}) scale(-1,1)`:`translate(${x.toFixed(1)},${c.y.toFixed(1)})`);
      }
    });
    put(10,150,190,.95,false); put(1380,90,120,.9,true); put(120,30,110,.85,false); put(760,15,95,.85,true);
    put(1080,170,130,.9,false); put(470,95,115,.88,true);
    for (let i=0;i<117;i++){
      const x=-40+R()*1680, y=20+Math.pow(R(),1.25)*470;
      const w=34+Math.pow(R(),2.2)*80;
      put(x,y,w,.55+R()*.4,R()<.45,R()<.25?'#bfdde1':null);
    }
  })();

  // 토리이: [발 x, 발 y, 크기, 기울기(도), 앞/뒤 팔레트]
  (()=>{
    const g=document.getElementById('toriis');
    const NEAR='--tr:#c3e2e2;--tb:#4f8f9b', MID='--tr:#d3ebe9;--tb:#77acb4', FAR='--tr:#dff1ef;--tb:#9cc8cc';
    const list=[
      [ 250,560,.30, 3,FAR],[ 720,535,.24,-4,FAR],[ 905,545,.22, 5,FAR],[1300,540,.28,-3,FAR],
      [ 600,560,.40,-9,MID],[1020,555,.44, 5,MID],[1190,545,.34,-7,MID],
      [  70,590,.50, 6,NEAR],[ 400,600,.66,-14,NEAR],[1530,600,.66,15,NEAR],
    ];
    for (const [x,y,s,a,pal] of list){
      const u=el('use',{href:'#torii',x:124,y:62,width:432,height:360,style:pal},g);
      u.setAttribute('transform',`translate(${x},${y}) rotate(${a}) scale(${s}) translate(-340,-420)`);
    }
  })();

  // 파도 언덕: 뒤에서 앞으로 줄마다 단색 반타원 봉우리
  // news.mp4 10–11초: 봉우리마다 속도가 제각각이다.
  //   - 봉우리마다 '스크롤과 비슷한 속도(SYNC)'와 '느린 속도(SLOW)' 중 하나를 따로 정한다.
  //     맨 앞줄과 뒷줄 몇 개(빠른 줄)는 SYNC가 많고, 나머지 줄은 SLOW가 많다.
  //     줄 단위로 속도를 묶지 않고 한 줄 안에 빠른 봉우리·느린 봉우리를 섞어, 한 줄이 뭉쳐서 움직이지 않게 한다
  //   - 범위 안에서도 봉우리마다 속도를 따로 뽑는다
  //   - 아주 드물게 봉우리 한두 개가 스크롤보다 빠르게 앞질러 간다
  // 봉우리는 서로 앞지르거나 엇갈리며 위아래로 겹친다(그리기 순서 무작위). 방향은 봉우리마다 REVERSE_P 확률로 반대.
  // 봉우리 하나 = 단색 반타원. 줄마다 길이 L(=VW+2M)짜리 고리를 돈다.
  // 속도가 달라 간격이 계속 바뀌므로 촘촘하게 깔고, 맨 뒷줄 뒤에는 빈틈으로 하늘이 비치지 않게 바탕 띠를 둔다.
  // ` 키: 아래 값들을 실시간으로 바꿔 보는 조절 패널. '값 복사'로 이 블록 형태 그대로 뽑을 수 있다.
  const WAVE_DEFAULT={
    SEED:23,                 // 배치 난수 시드
    // 원본 캡처 색 분석(K-means 5색)과 비율
    PAL:['#5fb1aa','#d3f5f3','#c6cab4','#058ea4','#225963'],
    W:[40.9,19.4,15.8,12.1,11.8],
    // 속도는 모두 SLIDE(가로등 스크롤 속도)에 대한 배율
    SYNC_V:[.55,.63],        // 스크롤과 비슷한 봉우리: [최소, 최대]
    SLOW_V:[.15,.6],         // 느린 봉우리: [최소, 최대]
    SYNC_BACK:2,             // 맨 앞줄 말고 빠른 줄로 삼을 뒷줄 수
    SYNC_P:[.7,.3],          // 봉우리가 SYNC일 확률: [빠른 줄, 나머지 줄]
    REVERSE_P:.5,            // 봉우리가 스크롤 반대 방향으로 움직일 확률
    FAST_V:[1.2,1.45],       // 아주 빠른 봉우리: [최소, 최대]
    FAST_N:5,                // 아주 빠른 봉우리 수(화면 전체, 줄마다 최대 1개)
    GAP:.75,                 // 봉우리 평균 간격(× 줄 반지름)
    POS_JITTER:.6,           // 처음 위치 흔들기(× 평균 간격)
    SIZE_VAR:.08,            // 봉우리 크기 = 줄 반지름 × (1 ± SIZE_VAR)
    RY:[.58,.64],            // 봉우리 높이 = 반폭 × [최소, 최대]
    BASE_JITTER:10,          // 봉우리 밑동 높이 흔들기(설계 단위, ±절반)
    DRIFT:.035,              // 봉우리별 제자리 흔들림 진폭(× 줄 반지름)
    DRIFT_W:[.5,1.0],        // 제자리 흔들림 각속도(rad/초): [최소, 최대]
    // 원근: 맨 뒷줄 배율 → 맨 앞줄 1까지 줄마다 고르게 커짐
    DEPTH_SPEED:.35,         // 맨 뒷줄 속도 배율 (아주 빠른 봉우리는 제외)
    DEPTH_SIZE:.96,          // 맨 뒷줄 크기 배율 (줄 반지름에 곱함)
  };
  const WAVE_STORE='news-scene-wave-params';
  const WP=(()=>{
    const p=JSON.parse(JSON.stringify(WAVE_DEFAULT));
    try { const s=JSON.parse(localStorage.getItem(WAVE_STORE)||'null'); if (s) for (const k in p) if (k in s) p[k]=s[k]; } catch(e){}
    return p;
  })();
  const waveG=document.getElementById('waves');
  const waveMoving=[];
  anim.push(t=>{
    for (const m of waveMoving){
      const x=mod(m.x+m.v*SLIDE*t+m.M,m.L)-m.M + m.a*Math.sin(t*m.w+m.ph);
      m.g.setAttribute('transform',`translate(${(x-m.x).toFixed(2)},0)`);
    }
  });
  // 줄이 촘촘해 틈은 앞줄들이 덮는다. 드물게 남는 틈으로 하늘이 비치지 않게만 맨 뒤 바탕 띠를 둔다.
  const SKIRT_Y=724; // 바탕 띠 하한: 맨 앞 띠(y 720–728) 안에서 끝나야 띠 아래로 삐져나오지 않음
  // [밑동 y, 줄 반지름]. 줄 간격을 봉우리 높이보다 충분히 좁게(영상처럼 촘촘히) 둬야
  // 봉우리끼리 속도가 달라 생기는 틈을 앞줄들이 덮는다. 간격이 넓으면 틈으로 바탕이 드러남.
  const WAVE_ROWS=[[560,46],[573,50],[585,53],[598,57],[611,61],[624,65],[638,69],[652,75],[668,81],[684,88],[703,96],[722,104]];
  function buildWaves(){
    const P=WP, R=rng(P.SEED), g=waveG;
    g.replaceChildren(); waveMoving.length=0;
    const PAL=P.PAL, W=P.W.some(w=>w>0)?P.W:P.W.map(()=>1);
    const WSUM=W.reduce((a,b)=>a+b,0);
    const lerp=([a,b],u)=>a+(b-a)*u;
    const pick=()=>{ let t=R()*WSUM; for (let i=0;i<PAL.length;i++){ t-=W[i]; if (t<=0) return i; } return 0; };
    // 한 줄(n개)의 색: 비율대로 개수를 정확히 나눈 뒤(최대 나머지 반올림) 섞고, 이웃이 같은 색이면 자리를 바꿔 떼어 놓는다
    const rowColors=n=>{
      const q=W.map(w=>w/WSUM*n), cnt=q.map(Math.floor);
      q.map((v,i)=>[v-cnt[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,n-cnt.reduce((a,b)=>a+b,0)).forEach(([,i])=>cnt[i]++);
      const out=[]; cnt.forEach((k,i)=>{ for (let j=0;j<k;j++) out.push(i); });
      for (let i=out.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
      for (let i=1;i<out.length;i++){
        if (out[i]!==out[i-1]) continue;
        let done=false;
        for (let j=i+1;j<out.length;j++) if (out[j]!==out[i]){ [out[i],out[j]]=[out[j],out[i]]; done=true; break; }
        if (done) continue;
        // 뒤에 다른 색이 없으면(줄 끝 몰림) 앞쪽에서 양옆과 안 겹치는 자리를 찾아 끼운다
        const c=out[i], ok=(k,v)=>out[k]!==v && (k===0||out[k-1]!==v) && (k+1>=out.length||out[k+1]!==v);
        for (let k=0;k<i-1;k++) if (ok(k,c) && out[k]!==out[i-1] && (i+1>=out.length||out[k]!==out[i+1])){ [out[i],out[k]]=[out[k],out[i]]; break; }
      }
      return out;
    };
    // 밑이 평평한 반타원(높이 ry)
    const dome=(cx,base,rx,ry,fill,parent)=>{
      const L=(cx-rx).toFixed(1), Rt=(cx+rx).toFixed(1), B=base.toFixed(1);
      const d=`M${L} ${B}A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 1 ${Rt} ${B}Z`;
      return el('path',{d,fill},parent);
    };
    const rows=WAVE_ROWS, last=rows.length-1;
    // 맨 뒷줄 바탕 띠: 봉우리 사이 빈틈으로 하늘·토리이 밑동이 비치지 않게 (가장 비율이 큰 색)
    const main=W.indexOf(Math.max(...W));
    el('rect',{x:-200,y:rows[0][0]-8,width:VW+400,height:SKIRT_Y-rows[0][0]+8,fill:PAL[main]},g);
    // 빠른 줄: 맨 앞줄 + 뒷줄 중 SYNC_BACK개 무작위
    const back=[...Array(last).keys()];
    for (let i=back.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [back[i],back[j]]=[back[j],back[i]]; }
    const sync=new Set([last,...back.slice(0,P.SYNC_BACK)]);
    // 아주 빠른 봉우리가 들어갈 줄 (서로 다른 줄)
    const fastRows=new Set(), fastN=Math.min(P.FAST_N,rows.length);
    while (fastRows.size<fastN) fastRows.add(Math.floor(R()*rows.length));
    rows.forEach(([base,r0],ri)=>{
      const front=ri===last;
      const depth=last?ri/last:1; // 0=맨 뒷줄, 1=맨 앞줄
      const r=r0*(P.DEPTH_SIZE+(1-P.DEPTH_SIZE)*depth), vk=P.DEPTH_SPEED+(1-P.DEPTH_SPEED)*depth;
      const pSync=P.SYNC_P[sync.has(ri)?0:1];
      // M: 가장 넓은 봉우리 반폭 + 흔들림보다 크게 (고리 이음매가 화면 밖에 있도록)
      const M=r*(1+P.SIZE_VAR+P.DRIFT+.3), L=VW+2*M;
      const n=Math.max(1,Math.round(L/(r*P.GAP)));
      const made=[];
      const cols=rowColors(n);
      for (let i=0;i<=n;i++){
        const fast=i===n;
        if (fast && !fastRows.has(ri)) break;
        const x=fast?-M+R()*L:-M+(i+(R()-.5)*P.POS_JITTER)*L/n;
        const rx=r*(1+(R()*2-1)*P.SIZE_VAR), ry=rx*lerp(P.RY,R()), b=base+(R()-.5)*P.BASE_JITTER;
        const c=fast?pick():cols[i];
        made.push({x,b,rx,ry,c,v:(R()<P.REVERSE_P?-1:1)*lerp(fast?P.FAST_V:R()<pSync?P.SYNC_V:P.SLOW_V,R())*(fast?1:vk),w:lerp(P.DRIFT_W,R()),ph:R()*6.283,key:R()});
      }
      made.sort((p,q)=>p.key-q.key); // 그리기 순서 섞기
      for (const d of made){
        const dg=el('g',{},g);
        dome(d.x,d.b,d.rx,d.ry,PAL[d.c],dg);
        waveMoving.push({g:dg, x:d.x, M, L, v:d.v, a:r*P.DRIFT, w:d.w, ph:d.ph});
      }
      if (front) el('rect',{x:-200,y:base-2,width:VW+400,height:8,fill:'#163a50'},g);
    });
  }
  buildWaves();

  // 별 패턴 기본값 (바닥패턴.html에서 가져옴 — ` 패널에서 조절, 이 브라우저에만 저장)
  const STAR_DEFAULT={KMODE:'linear',SMODE:'linear',T:.51,G:2.2};
  const STAR_STORE='news-scene-star-params';
  const SP=(()=>{
    const p=JSON.parse(JSON.stringify(STAR_DEFAULT));
    try { const s=JSON.parse(localStorage.getItem(STAR_STORE)||'null'); if (s) for (const k in p) if (k in s) p[k]=s[k]; } catch(e){}
    if (!['linear','log','log-rev'].includes(p.KMODE)) p.KMODE='linear';
    if (!['linear','log','log-rev'].includes(p.SMODE)) p.SMODE='linear';
    if (!(p.T>0)) p.T=STAR_DEFAULT.T;
    if (!(p.G>0)) p.G=STAR_DEFAULT.G;
    return p;
  })();
  // p: 시간 진행도 0→1, 반환 k: 곡률 100%→0% (p에는 확대 속도가 이미 반영된 크기 진행도를 넘김)
  function starKFor(p,mode){
    p=Math.min(1,Math.max(0,p));
    if (mode==='log') return 1-Math.log10(1+9*p);
    if (mode==='log-rev') return Math.log10(1+9*(1-p));
    return 1-p;
  }
  // p: 시간 진행도 0→1, 반환 ps: 크기 진행도 0→1
  function starScaleFor(p,mode){
    p=Math.min(1,Math.max(0,p));
    if (mode==='log') return Math.log10(1+9*p);
    if (mode==='log-rev') return 1-Math.log10(1+9*(1-p));
    return p;
  }

    document.head.appendChild(css);
    const panel=document.createElement('div');
    panel.id='wavePanel'; panel.hidden=true;

    const fmtNum=v=>String(+(+v).toFixed(4)).replace(/^(-?)0\./,'$1.');
    const fmt=v=>Array.isArray(v)?`[${v.map(fmt).join(',')}]`:typeof v==='string'?`'${v}'`:fmtNum(v);
    const out=document.createElement('textarea'); out.readOnly=true;
    const dump=()=>{
      const wlines=Object.keys(WAVE_DEFAULT).map(k=>`    ${k}:${fmt(WP[k])},`);
      const slines=Object.keys(STAR_DEFAULT).map(k=>`    ${k}:${fmt(SP[k])},`);
      out.value=`  const WAVE_DEFAULT={\n${wlines.join('\n')}\n  };\n  const STAR_DEFAULT={\n${slines.join('\n')}\n  };`;
    };
    let queued=false;
    const changed=()=>{
      try { localStorage.setItem(WAVE_STORE,JSON.stringify(WP)); } catch(e){}
      dump();

    };
    const starChanged=()=>{
      try { localStorage.setItem(STAR_STORE,JSON.stringify(SP)); } catch(e){}
      dump();
    };
    const refreshers=[];
    // 숫자 하나 = 슬라이더 + 숫자 칸. get/set으로 WP(또는 SP) 안의 값과 연결
    const numCtl=(parent,get,set,min,max,step,extra,onChange)=>{

      const box=document.createElement('div'); box.className='ctl';
      if (extra) box.appendChild(extra);

      rg.addEventListener('input',()=>{ set(+rg.value); nb.value=rg.value; fire(); });

        else if (Array.isArray(WAVE_DEFAULT[key])) WAVE_DEFAULT[key].forEach((_,i)=>numCtl(row,()=>WP[key][i],v=>{WP[key][i]=v;},min,max,step));
        else numCtl(row,()=>WP[key],v=>{WP[key]=v;},min,max,step);

    // 색과 비율
    {
      const h=document.createElement('h3'); h.textContent='색 · 비율 — PAL, W'; panel.appendChild(h);
      const row=document.createElement('div'); row.className='row';
      WAVE_DEFAULT.PAL.forEach((_,i)=>{
        const cp=Object.assign(document.createElement('input'),{type:'color'});
        cp.addEventListener('input',()=>{ WP.PAL[i]=cp.value; changed(); });
        refreshers.push(()=>{ cp.value=WP.PAL[i]; });
        numCtl(row,()=>WP.W[i],v=>{WP.W[i]=v;},0,100,.1,cp);

      panel.appendChild(row);
    }
    // 별 패턴 속도 (바닥패턴.html에서 이식: 곡률 변화 KMODE, 확대 속도 SMODE, 등장 간격 T, 확대 시간 G)
    {

    panel.appendChild(out);
    const hint=document.createElement('div'); hint.className='hint';
    hint.textContent='` 키로 열고 닫기. 바꾼 값은 이 브라우저에 저장됩니다.';
    panel.appendChild(hint);

      e.preventDefault(); panel.hidden=!panel.hidden;
      dispatchEvent(new Event('debugtoggle'));
    });
  })();

  /* ───────── 참고 영상 오버레이 (비교용) ─────────
     ` 디버그 패널 맨 위: 켜기/끄기, 투명도, 원위치. 영상은 패널이 열려 있을 때만 보인다.
     영상 위: 한 손가락(마우스) 드래그로 이동, 두 손가락으로 크기, 휠로 크기, 더블클릭으로 원위치. */
  (()=>{
    const SRC='https://vialinks.xyz/newstemp?raw=1';
    const STORE='news-scene-ref-video';
    const panel=document.getElementById('wavePanel');
    const home=()=>{ const w=Math.round(Math.min(innerWidth*.4,640)); return {x:16, y:16, w}; }; // 패널(오른쪽 위)과 안 겹치게 왼쪽 위
    const S=Object.assign({on:false, op:.5}, home());
    try { Object.assign(S, JSON.parse(localStorage.getItem(STORE)||'{}')); } catch(e){}
    const save=()=>{ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e){} };

    const css=document.createElement('style');
    css.textContent=`
#refVideo{position:fixed;z-index:8;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:1px dashed rgba(255,255,255,.35)}

#refVideo[hidden]{display:none}

    document.head.appendChild(css);

    const box=document.createElement('div'); box.id='refVideo';

    const bar=document.createElement('div'); bar.id='refBar';

    const row=document.createElement('div'); row.className='row'; row.appendChild(bar);
    panel.prepend(head, row);

    const apply=()=>{
      const show=S.on && !panel.hidden;

    // 기준점 p(화면 좌표)를 고정한 채 크기를 base.w×s로 바꿈
    const MIN_W=80;
    const scaleAt=(base,s,p)=>{
      const w=Math.min(Math.max(base.w*s, MIN_W), innerWidth*4);
      const k=w/base.w;
      S.w=w; S.x=p.x-(base.px-base.x)*k; S.y=p.y-(base.py-base.y)*k;

    // 포인터 수가 바뀔 때마다 기준을 다시 잡아서 이동↔확대 전환이 튀지 않게 함
    const pts=new Map(); let g=null;
    const mid=()=>{ const a=[...pts.values()]; return a.length<2?a[0]:{x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; };
    const dist=()=>{ const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x, a.y-b.y)||1; };
    const begin=()=>{
      if (!pts.size){ g=null; box.classList.remove('drag'); save(); return; }
      const m=mid();
      g={x:S.x, y:S.y, w:S.w, px:m.x, py:m.y, d:pts.size>1?dist():0};
      box.classList.add('drag');
    };

      box.setPointerCapture(e.pointerId);

      if (pts.size>1) scaleAt(g, dist()/g.d, m);
      else { S.x=g.x+m.x-g.px; S.y=g.y+m.y-g.py; }
      apply();
    });
    const up=e=>{ if (pts.delete(e.pointerId)) begin(); };
    box.addEventListener('pointerup', up);
    box.addEventListener('pointercancel', up);
    box.addEventListener('wheel', e=>{
      e.preventDefault();
      scaleAt({x:S.x, y:S.y, w:S.w, px:e.clientX, py:e.clientY}, Math.exp(-e.deltaY*.0015), {x:e.clientX, y:e.clientY});
      apply(); save();
    }, {passive:false});

    apply();
  })();

  /* ───────── 바닥 타일 (뉴스장면 바닥 타일.html에서 가져옴) ───────── */

  // 사각형·원이 다 그려진 뒤(35) 사라지기 시작(rcOut)까지의 유지 시간을 1.4배(7 → 9.8프레임)로 늘림.
  // 늘어난 2.8프레임만큼 rcOut 이후 키와 TOTAL을 함께 뒤로 민다.
  const HOLD_EXTRA=(42-35)*0.4;
  // 삼각형 두 개가 다 보이는 시간(pairIn 끝 → 루프 끝 → 다음 루프 pairOut 시작, 원래 20프레임)을 0.7배로 줄임.
  // 그 구간은 루프 끝을 넘어가므로 TOTAL에서 6프레임을 뺀다.
  const PAIR_CUT=(118-108+10)*0.3;
  const FPS=24, TOTAL=118+HOLD_EXTRA-PAIR_CUT, SPEED=1.35*0.8; // 원본 타일 1.35배속의 0.8배
  const K=(()=>{
    const k={ pairOut:[10,22], rectIn:[18,28], circIn:[25,35], rcOut:[42,51], rtDraw:[51,77], rtOut:[82,108], pairIn:[94,108] };
    for (const n of ['rcOut','rtDraw','rtOut','pairIn']) k[n]=k[n].map(v=>v+HOLD_EXTRA);
    // 사각형·원은 직각삼각형이 그려지기 시작할 때 사라지기 시작해서, 삼각형이 절반쯤 그려졌을 때(rtDraw 중간) 완전히 사라짐.
    k.rcOut=[k.rtDraw[0], (k.rtDraw[0]+k.rtDraw[1])/2];
    return k;
  })();
  const CELL='#0d2b31', SAND='#d9c79c';
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const prog=(f,[a,b])=>clamp((f-a)/(b-a),0,1);
  const eIn=t=>t*t*t, eOut=t=>1-Math.pow(1-t,3);
  const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  const RT_C=[[5.07,97.9],[97.9,97.9],[97.9,5.07]], RT_W=2.1, RT_R=8;
  const RT=(()=>{
    const n=RT_C.length;
    const cx=RT_C.reduce((s,p)=>s+p[0],0)/n, cy=RT_C.reduce((s,p)=>s+p[1],0)/n;
    const E=[];
    for (let i=0;i<n;i++){
      const A=RT_C[i], B=RT_C[(i+1)%n];
      const dx=B[0]-A[0], dy=B[1]-A[1], len=Math.hypot(dx,dy), d=[dx/len,dy/len];
      let nn=[-d[1],d[0]];
      if (nn[0]*((A[0]+B[0])/2-cx)+nn[1]*((A[1]+B[1])/2-cy)<0) nn=[-nn[0],-nn[1]];
      E.push({A,d,n:nn,len});
    }
    const isect=(P,d1,Q,d2)=>{
      const den=d1[0]*d2[1]-d1[1]*d2[0];
      const t=((Q[0]-P[0])*d2[1]-(Q[1]-P[1])*d2[0])/den;
      return [P[0]+d1[0]*t, P[1]+d1[1]*t];
    };
    const off=(e,sg)=>[e.A[0]+sg*RT_W*e.n[0], e.A[1]+sg*RT_W*e.n[1]];
    let acc=0;
    E.forEach((e,i)=>{
      e.start=acc; acc+=e.len;
      const pv=E[(i+n-1)%n], nx=E[(i+1)%n];
      e.side={};
      for (const sg of [1,-1]){
        const base=off(e,sg);
        const cs=isect(base,e.d,off(pv,sg),pv.d), ce=isect(base,e.d,off(nx,sg),nx.d);
        const proj=p=>(p[0]-base[0])*e.d[0]+(p[1]-base[1])*e.d[1];
        e.side[sg]={base, s0:proj(cs), s1:proj(ce)};
      }
    });
    return {E, P:acc};
  })();
  function rtPiece(e,u0,u1){
    const b0=clamp(1-u0/RT_R,0,1), b1=clamp(1-(e.len-u1)/RT_R,0,1);
    const pt=(S,u)=>`${(S.base[0]+e.d[0]*u).toFixed(3)} ${(S.base[1]+e.d[1]*u).toFixed(3)}`;
    const seg={};
    for (const sg of [1,-1]){
      const S=e.side[sg];
      let a=u0*(1-b0)+S.s0*b0, b=u1*(1-b1)+S.s1*b1;
      if (a>b) a=b=(a+b)/2;
      seg[sg]=[pt(S,a),pt(S,b)];
    }
    return `M${seg[1][0]}L${seg[1][1]}L${seg[-1][1]}L${seg[-1][0]}Z`;
  }
  function rtPath(T,H){
    const P=RT.P; let d='';
    if (H-T>=1-1e-6){ for (const e of RT.E) d+=rtPiece(e,0,e.len); return d; }
    const x0=T*P, x1=H*P;
    for (let k=Math.floor(x0/P)-1;k<=Math.floor(x1/P)+1;k++){
      for (const e of RT.E){
        const s=k*P+e.start, t=s+e.len;
        const a=Math.max(x0,s), b=Math.min(x1,t);
        if (b-a>1e-6) d+=rtPiece(e,a-s,b-s);
      }
    }
    return d;
  }

  // 칸 좌표 → 시작 오프셋 (흩뿌림 배열)
  function hash(x,y){
    let h=Math.imul(x|0,0x27d4eb2d)^Math.imul(y|0,0x165667b1);
    h=Math.imul(h^(h>>>15),0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16;
    return h>>>0;
  }
  const rnd=(x,y,s)=>(hash(x^Math.imul(s,0x632be5ab),y+s*7919)>>>0)/4294967296;
  function vnoise(x,y){
    const X=Math.floor(x),Y=Math.floor(y),fx=x-X,fy=y-Y,sm=t=>t*t*(3-2*t);
    const v=(i,j)=>rnd(i,j,3)*2-1;
    const p=v(X,Y)+(v(X+1,Y)-v(X,Y))*sm(fx), q=v(X,Y+1)+(v(X+1,Y+1)-v(X,Y+1))*sm(fx);
    return p+(q-p)*sm(fy);
  }
  const SIG=25, AMP=50, SCALE=8, DIAG=12;
  const cdist=(a,b)=>{const d=mod(a-b,TOTAL); return Math.min(d,TOTAL-d);};
  const memo=new Map();
  function computeCell(x,y,sx,sy){
    const deps=[]; if (sx) deps.push(memo.get(`${x-sx},${y}`)); if (sy) deps.push(memo.get(`${x},${y-sy}`));
    const diag=(sx&&sy)?memo.get(`${x-sx},${y-sy}`):null;
    const t=mod(Math.round(AMP*vnoise(x/SCALE+.37,y/SCALE+.71)),TOTAL);
    if (!deps.length) return t;
    const cands=[], w=[]; let tot=0;
    for (let c=0;c<TOTAL;c++){
      let ok=true; for (const n of deps){ const d=cdist(c,n); if (d<10||d>30){ok=false;break;} }
      if (!ok) continue;
      const dt=cdist(c,t); let ww=Math.exp(-dt*dt/(2*SIG*SIG));
      if (diag!==null){ const dd=cdist(c,diag); ww*=1-Math.exp(-dd*dd/(2*DIAG*DIAG)); }
      cands.push(c); w.push(ww+1e-9); tot+=ww+1e-9;
    }
    let r=rnd(x,y,7)*tot;
    for (let i=0;i<cands.length;i++){ r-=w[i]; if (r<=0) return cands[i]; }
    return cands[cands.length-1];
  }
  function offsetOf(x,y){
    const key=`${x},${y}`; let v=memo.get(key); if (v!==undefined) return v;
    const stack=[[x,y]];
    while (stack.length){
      const [cx,cy]=stack[stack.length-1];
      const k=`${cx},${cy}`; if (memo.has(k)){ stack.pop(); continue; }
      const sx=Math.sign(cx), sy=Math.sign(cy), need=[];
      if (sx && !memo.has(`${cx-sx},${cy}`)) need.push([cx-sx,cy]);
      if (sy && !memo.has(`${cx},${cy-sy}`)) need.push([cx,cy-sy]);
      if (sx && sy && !memo.has(`${cx-sx},${cy-sy}`)) need.push([cx-sx,cy-sy]);
      if (need.length){ stack.push(...need); continue; }
      memo.set(k,computeCell(cx,cy,sx,sy)); stack.pop();
    }
    return memo.get(key);
  }

  const TRI_TOP=new Path2D('M5.07 2.1L94.93 2.1L50 47.03Z');
  const TRI_BOT=new Path2D('M5.07 97.9L94.93 97.9L50 52.97Z');
  const rtCache=new Map();
  function rtFor(f){
    const k=f.toFixed(3);
    let p=rtCache.get(k);
    if (p!==undefined) return p;
    let T,Hd;
    if (f < K.rtOut[0]) { const q=eIO(prog(f,K.rtDraw)); Hd=2*q; T=q; }
    else { const q=eIO(prog(f,K.rtOut)); Hd=1+q; T=2*q; }
    p = Hd-T>0.0005 ? new Path2D(rtPath(T,Hd)) : null;
    rtCache.set(k,p); return p;
  }
  function drawTile(g,f){
    const scaleAt=(cx,cy,s)=>{ g.translate(cx,cy); g.scale(s,s); g.translate(-cx,-cy); };
    g.fillStyle=CELL; g.fillRect(0,0,100,100);
    g.save();
    g.beginPath(); g.rect(0,0,100,100); g.clip();
    g.strokeStyle=SAND; g.fillStyle=SAND; g.lineJoin='miter'; g.miterLimit=10;
    let off, op;
    if (f < K.pairIn[0]) { const p=eIn(prog(f,K.pairOut)); off=30*p; op=1-p; }
    else { const q=eOut(prog(f,K.pairIn)); off=30*(1-q); op=q; }
    if (op>0.001){
      g.globalAlpha=op; g.lineWidth=4.2;
      g.save(); g.translate(0,-off); g.stroke(TRI_TOP); g.restore();
      g.save(); g.translate(0,off); g.stroke(TRI_BOT); g.restore();
    }
    const shapeState=(inSeg)=>{
      if (f < inSeg[0] || f >= K.rcOut[1]) return {s:0,o:0};
      if (f < K.rcOut[0]) return {s:eOut(prog(f,inSeg)), o:1};
      const p=eOut(prog(f,K.rcOut)); return {s:1+0.12*p, o:1-p};
    };
    const r=shapeState(K.rectIn), c=shapeState(K.circIn);
    g.lineWidth=4.8;
    if (r.o>0.001 && r.s>0.0005){
      g.globalAlpha=r.o; g.save(); scaleAt(50,97.3,r.s);
      g.strokeRect(3.15,78.8,93.7,18.5); g.restore();
    }
    if (c.o>0.001 && c.s>0.0005){
      g.globalAlpha=c.o; g.save(); scaleAt(49.4,37.4,c.s);
      g.beginPath(); g.arc(49.4,37.4,27.6,0,Math.PI*2); g.stroke(); g.restore();
    }
    if (f >= K.rtDraw[0] && f < K.rtOut[1]){
      const p=rtFor(f);
      if (p){ g.globalAlpha=1; g.fill(p); }
    }
    g.restore();
    g.globalAlpha=1;
  }

  /* ───────── 원근 투영 ─────────
     설계 좌표 기준. 화면 y의 지평선 거리 dy = y − HORIZON 일 때
       깊이 Z = DEPTH / dy (칸 단위),  칸 한 변의 화면 폭 = TILE_K · dy.
     바닥은 FAR_Y부터 화면 아래까지만 보인다. FAR_Y는 맨 앞 파도 띠(y 720–728)보다 위라서 띠와 봉우리 밑동을 덮는다.
     칸 줄(깊이 1칸)마다 평면 띠 캔버스에 타일을 그린 뒤, 화면 가로줄 단위로 잘라 붙인다(정확한 원근).
     깊이 BAND_ROW 칸부터 먼 쪽(파도 언덕·랜턴 바로 앞)은 별 패턴 띠 구간 — 가로등과 같은 속도로 스크롤. */
  const HORIZON=537, FAR_Y=704, TILE_K=0.355, DEPTH=3500;
  // 띠 구간 화면 높이를 원래(BAND_ROW=14, y 704–787)의 0.6배로 줄이고, 줄어든 만큼 앞쪽 움직이는 타일을 먼 쪽으로 늘림.
  // 목표 경계 y≈754 → DEPTH/(754−HORIZON)≈16.1 → 칸 단위로 16 (띠 y 704–756, 약 0.62배).
  const BAND_ROW=16;
  // 뒤쪽 띠 바닥 + 가로등 슬라이드 (news.mp4 9.5–12초: 오른쪽으로. 가로등 하나가 왼쪽 끝에서 들어와 화면 가운데까지 LAMP_IN초)
  const LAMP_BASE_Y=741, LAMP_GAP=557, LAMP_W=280, LAMP_TOP=374;
  const LAMP_IN=3.5;                                // 원본 3~4초
  const SLIDE=(VW/2+LAMP_W/2)/LAMP_IN;              // 가로등 밑동 깊이에서 설계 단위/초 (가로등 중심 −140 → 800)
  const SLIDE_TILES=SLIDE/(TILE_K*(LAMP_BASE_Y-HORIZON)); // 같은 속도를 바닥 칸 단위로 (깊이와 무관하게 월드 속도 동일)
  const FOG='150,206,219';

  /* ───────── 띠 구간 별 패턴 (바닥패턴.html에서 가져옴) ─────────
     값은 위 STAR_DEFAULT/SP — ` 패널에서 조절. 모든 띠 칸이 같은 박자·같은 색.
     45° 회전은 바닥패턴.html의 patternTransform="rotate(45)" 재현 — 타일 격자는
     월드 X축 그대로 두고 별만 돌린다. */
  const STAR_R=50, STAR_ROT=Math.PI/4;
  const STAR_COLORS=['#123E4B','#C9F2F4','#375757','#A9B7A2'];
  const starF=n=>Math.round(n*10)/10;
  function starPathFor(k){
    const c=STAR_R/2*(1-k);
    return `M0 ${-STAR_R} Q${starF(c)} ${starF(-c)} ${STAR_R} 0 Q${starF(c)} ${starF(c)} 0 ${STAR_R} Q${starF(-c)} ${starF(c)} ${-STAR_R} 0 Q${starF(-c)} ${starF(-c)} 0 ${-STAR_R}Z`;
  }
  function starCoverFor(k){
    const c=50*(1-k); // 원본 R=100 기준 배율 (R=50 별에 곱해도 같은 값)
    return 100/(25+c/2);
  }
  // sec 시점의 별 세대 목록 (오래된→최신 순). 다 자란 마지막 세대 1개를 배경으로 포함한다.
  // sec=0 이전부터 계속 생성돼 왔다고 가정해 첫 프레임부터 빈칸 없이 보인다.
  // 안전 상한: T 최소·G 최대 조합에서 세대가 100개까지 늘어날 수 있어 배경+최신 23개만 둔다.
  const STAR_MAX_GENS=24;
  function starGens(sec){
    const T=Math.max(.05,SP.T), G=Math.max(.3,SP.G);
    const i0=Math.floor(sec/T), done=Math.floor((sec-G)/T);
    const out=[];
    for (let k=done;k<=i0;k++){
      const pRaw=Math.min(1,Math.max(0,(sec-k*T)/G));
      if (pRaw<=0) continue;
      const ps=starScaleFor(pRaw,SP.SMODE); // 크기 진행도: 시간→크기
      const kk=starKFor(ps,SP.KMODE);       // 곡률: 크기에 동기화 (커질수록 100%→0%)
      out.push({color:STAR_COLORS[((k%4)+4)%4], path:new Path2D(starPathFor(kk)), s:starCoverFor(kk)*ps});
    }
    // 배경(맨 앞 다 자란 세대)은 남기고 중간 세대만 솎아낸다
    if (out.length>STAR_MAX_GENS) out.splice(1,out.length-STAR_MAX_GENS);
    return out;
  }
  function drawBandTile(g,gens){
    g.globalAlpha=1;
    g.save();
    g.beginPath(); g.rect(0,0,100,100); g.clip();
    g.fillStyle=gens.length?gens[0].color:CELL;
    g.fillRect(0,0,100,100);
    g.translate(50,50);
    g.rotate(STAR_ROT);
    for (const gen of gens){
      g.save();
      g.scale(gen.s,gen.s);
      g.fillStyle=gen.color;
      g.fill(gen.path);
      g.restore();
    }
    g.restore();
  }

  const cv=document.getElementById('floor'), ctx=cv.getContext('2d');
  let s=1, ox=0, oy=0;
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const w=innerWidth, h=innerHeight;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    s=Math.max(cv.width/VW, cv.height/VH);
    ox=(cv.width-VW*s)/2; oy=(cv.height-VH*s)/2;
  }
  addEventListener('resize',resize); resize();

  const strips=[];
  const stripFor=i=>strips[i]||(strips[i]=document.createElement('canvas'));

  function render(frame,slide,sec){
    const W=cv.width, H=cv.height;
    const hy=oy+HORIZON*s, c=DEPTH*s, cx=ox+VW/2*s, far=Math.max(0,oy+FAR_Y*s);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=CELL; ctx.fillRect(0,far,W,H-far);
    rtCache.clear();
    const bandGens=starGens(sec);

    const rMin=Math.max(1,Math.floor(c/(H-hy))), rMax=Math.ceil(c/(far-hy));
    for (let r=rMin, si=0; r<rMax; r++, si++){
      const yTop=Math.max(hy+c/(r+1),far), yBot=Math.min(hy+c/r,H);
      if (yBot<=yTop) continue;
      const kFar=TILE_K*(yTop-hy);
      const gy=-r, isBand=r>=BAND_ROW, sh0=isBand?slide:0; // 화면 x = cx + (X + sh0)·k
      const x0=Math.floor(-cx/kFar-sh0)-1, x1=Math.ceil((W-cx)/kFar-sh0)+1;
      const R=Math.max(8,Math.min(512,Math.ceil(TILE_K*(yBot-hy))));
      const st=stripFor(si), sg=st.getContext('2d');
      const sw=(x1-x0)*R;
      if (st.width!==sw||st.height!==R){ st.width=sw; st.height=R; }
      for (let x=x0;x<x1;x++){
        sg.setTransform(R/100,0,0,R/100,(x-x0)*R,0);
        if (isBand) drawBandTile(sg,bandGens);
        else drawTile(sg,(frame+offsetOf(x,gy))%TOTAL);
      }
      // 가로줄 단위로 원근 투영
      for (let y=Math.floor(yTop); y<Math.ceil(yBot); y++){
        const yc=Math.max(y,yTop)+0.5, dy=yc-hy;
        const Z=c/dy, kk=TILE_K*dy;
        let sh=Math.max(0.5,Math.min(R,c/(dy*dy)*R));
        const sy=clamp((r+1-Z)*R-sh/2,0,R-sh);
        const sx=((0-cx)/kk-sh0-x0)*R, swid=W/kk*R;
        ctx.drawImage(st,sx,sy,swid,sh,0,y,W,1);
      }
    }

    // 띠 구간 먼 쪽 안개 (움직이는 타일 경계까지만)
    const bandEnd=hy+c/BAND_ROW;
    if (bandEnd>far){
      const gr=ctx.createLinearGradient(0,far,0,bandEnd);
      gr.addColorStop(0,`rgba(${FOG},.85)`); gr.addColorStop(1,`rgba(${FOG},0)`);
      ctx.fillStyle=gr; ctx.fillRect(0,far,W,bandEnd-far);
    }
  }

  // 재생
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  // 가로등: 간격 LAMP_GAP으로 반복, 슬라이드만큼 오른쪽으로 밀고 감싸기
  const lampG=document.getElementById('lamps');
  const lamps=[];
  for (let i=0;i<Math.ceil((VW+LAMP_W)/LAMP_GAP)+1;i++)
    lamps.push(el('use',{href:'#lamp',y:LAMP_TOP,width:LAMP_W,height:(LAMP_W*264/200).toFixed(1)},lampG));
  anim.push(t=>{
    const off=mod(102+t*SLIDE,LAMP_GAP)-LAMP_GAP; // 원래 첫 가로등 x=102
    lamps.forEach((u,i)=>u.setAttribute('x',(off+i*LAMP_GAP).toFixed(2)));
  });

  // ?t=초 : 그 시점부터 시작 (확인·캡처용)
  let sec=Math.max(0,parseFloat(new URLSearchParams(location.search).get('t'))||0);
  let frame=(sec*FPS*SPEED)%TOTAL, last=null;
  function tick(ts){
    if (!reduce.matches){
      if (last!==null){
        const dt=Math.min(ts-last,100)/1000;
        frame=(frame+dt*FPS*SPEED)%TOTAL;
        sec+=dt;
      }
      last=ts;
    }
    for (const fn of anim) fn(sec);
    render(frame, sec*SLIDE_TILES, sec);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
