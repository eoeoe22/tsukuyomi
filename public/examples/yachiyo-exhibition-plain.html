<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야치요 방 · 본체 나열</title>
<style>
  html,body{margin:0;padding:0;background:#101014}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;align-items:start}
  .room canvas{width:100%!important;height:auto!important;display:block;background:transparent!important}
  .crop{overflow:hidden}
  .crop iframe{width:100%;border:0;pointer-events:none;display:block}
  #cropSq{height:410px} #cropSq iframe{height:700px;margin-top:-58px}
  #cropCy{height:450px} #cropCy iframe{height:760px;margin-top:-98px}
</style>
</head>
<body>
<div class="grid">
  <div class="room" id="r0"></div>
  <div class="room" id="r1"></div>
  <div class="room" id="r2"></div>
  <div class="room" id="r3"></div>
  <div class="room" id="r4"></div>
  <div class="room" id="r5"></div>
  <div class="room" id="r6"></div>
  <div class="room" id="r7"></div>
  <div class="room" id="r8"></div>
  <div class="crop" id="cropSq"><iframe scrolling="no" src="./%EC%82%AC%EA%B0%81%EB%BF%94%EB%8C%80%20%EB%9E%9C%ED%84%B4.html"></iframe></div>
  <div class="crop" id="cropCy"><iframe scrolling="no" src="./%EC%9B%90%ED%86%B5%20%EC%8A%A4%ED%83%A0%EB%94%A9%20%EB%9E%9C%ED%84%B4.html"></iframe></div>
  <div></div>
</div>
<script src="../packages/yachiroom/dist/yachiroom.umd.js"></script>
<script>
  const parts = ['hashira','marumado','ranma','kamoi','hari','yuka','dan','tsuitate','kouran'];
  parts.forEach((p, i) => {
    YachiRoom.mount('#r' + i, { part: p, rot: 24, tilt: 12, autoplay: false, label: false });
  });
</script>
</body>
</html>
