<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네 꼭짓점 별 곡률 조절</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ea; --panel:#ffffff; --ink:#1d2320; --muted:#5d665f; --line:#c9cfc5; --accent:#123E4B;
  --code-bg:#f6f7f3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151917; --panel:#1f2522; --ink:#e7ece8; --muted:#9aa49d; --line:#3a433e; --accent:#C9F2F4; --code-bg:#181d1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1f2522; --ink:#e7ece8; --muted:#9aa49d; --line:#3a433e; --accent:#C9F2F4; --code-bg:#181d1a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.55}
main{max-width:880px;margin:0 auto;padding:28px 20px 40px;display:grid;gap:20px;
  grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
@media (max-width:720px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
.stage{background:var(--panel);border:1px solid var(--line);aspect-ratio:1/1;padding:0;line-height:0}
.stage svg{width:100%;height:100%;display:block;overflow:hidden}
.controls{display:grid;gap:18px}
.field{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
label,.lbl{font-weight:600}
output{font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.swatches{display:flex;gap:8px}
.swatches span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.check{display:flex;align-items:center;gap:8px;font-weight:400}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.segOpt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-weight:400;cursor:pointer}
.segOpt:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.segOpt input{accent-color:var(--accent)}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px;
  font-size:.78rem;overflow-x:auto;white-space:pre;max-width:100%}
button{font:inherit;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;
  border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--accent);color:var(--panel)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>네 꼭짓점 별</h1>
  <div class="stage">
    <!-- 창 한 변 = 3×3 블록(600)의 대각선 600√2 → 45° 돌린 3×3이 창에 딱 내접 -->
    <svg id="star" viewBox="-424.264 -424.264 848.528 848.528" role="img" aria-label="45도 돌린 타일마다 100% 곡률로 시작해 커지며 0%로 펴지는 네 꼭짓점 별">
      <defs>
        <path id="base"/>
        <!-- 한 칸(200×200) 그림을 패턴으로 반복: 칸이 경계 없이 한 장으로 이어 붙고, 45° 회전도 패턴 자체에 적용 -->
        <pattern id="tilePat" patternUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200" viewBox="-100 -100 200 200" patternTransform="rotate(45)">
          <g id="layer"></g>
        </pattern>
      </defs>
      <rect x="-424.264" y="-424.264" width="848.528" height="848.528" fill="url(#tilePat)"/>
      <g transform="rotate(45)">
        <g id="guide" stroke="var(--muted)" stroke-width="0.8" fill="none" stroke-dasharray="3 3"></g>
      </g>
    </svg>
  </div>

  <div class="controls">
    <div class="field">
      <div class="row"><span class="lbl" id="kmodeLbl">곡률 변화</span><output id="kOut">100% → 0%</output></div>
      <div class="seg" role="radiogroup" aria-labelledby="kmodeLbl">
        <label class="segOpt"><input type="radio" name="kmode" value="linear" checked> 선형</label>
        <label class="segOpt"><input type="radio" name="kmode" value="log"> 로그스케일</label>
        <label class="segOpt"><input type="radio" name="kmode" value="log-rev"> 역로그스케일</label>
      </div>
      <p class="hint">작을 땐 100%(깊게 파인 별)로 시작해 커질수록 0%(곧은 마름모)로 펴져요. 선형은 일정하게, 로그는 초반에 빠르게, 역로그는 후반에 빠르게 펴져요.</p>
    </div>
    <div class="field">
      <div class="row"><span class="lbl" id="smodeLbl">확대 속도</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="smodeLbl">
        <label class="segOpt"><input type="radio" name="smode" value="linear" checked> 선형</label>
        <label class="segOpt"><input type="radio" name="smode" value="log"> 로그스케일</label>
        <label class="segOpt"><input type="radio" name="smode" value="log-rev"> 역로그스케일</label>
      </div>
      <p class="hint">선형은 일정하게, 로그는 초반에 빠르게, 역로그는 후반에 빠르게 커져요.</p>
    </div>
    <div class="field">
      <div class="row"><label for="t">등장 간격</label><output id="tOut">0.30초</output></div>
      <input id="t" type="range" min="50" max="2000" step="10" value="300">
    </div>
    <div class="field">
      <div class="row"><label for="g">확대 시간</label><output id="gOut">1.40초</output></div>
      <input id="g" type="range" min="300" max="5000" step="50" value="1400">
      <p class="hint">별 하나가 사각형을 완전히 덮을 때까지 걸리는 시간이에요. 짧을수록 빠르게 커져요.</p>
    </div>
    <div class="field">
      <span class="lbl">색 순서</span>
      <div class="swatches" aria-hidden="true">
        <span style="background:#123E4B"></span><span style="background:#C9F2F4"></span>
        <span style="background:#375757"></span><span style="background:#A9B7A2"></span>
      </div>
    </div>
    <div class="row" style="justify-content:flex-start;gap:16px;flex-wrap:wrap">
      <button id="play" type="button">일시정지</button>
      <label class="check"><input id="showGuide" type="checkbox"> 조절점 보기</label>
    </div>
    <div class="field">
      <div class="row"><span class="lbl">SVG 코드</span><button id="copy" type="button">코드 복사</button></div>
      <pre id="code"></pre>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const R = 100;
const COLORS = ['#123E4B','#C9F2F4','#375757','#A9B7A2'];
const MAX_STARS = 120;       // 안전 상한 (최대 확대 시간 / 최소 간격 = 100개보다 여유 있게)
const NS = 'http://www.w3.org/2000/svg';
let colorIdx = 0, timer = null, playing = true, rafId = null, pauseAt = 0;

// 별은 한 칸에만 그리고, 패턴이 그 칸을 창 전체에 반복 → 모든 칸이 같은 박자·같은 색
const layers = [$('layer')];
// 한 번 생성된 별을 한 세대로 묶어 관리: 오래된 것부터
const gens = [];

function f(n){ return Math.round(n*10)/10; }

function pathFor(k){
  const c = R/2*(1-k);
  return `M0 ${-R} Q${f(c)} ${f(-c)} ${R} 0 Q${f(c)} ${f(c)} 0 ${R} Q${f(-c)} ${f(c)} ${-R} 0 Q${f(-c)} ${f(-c)} 0 ${-R}Z`;
}
function coverFor(k){
  // 사각형을 완전히 덮는 배율: 오목한 변이 가장 안쪽으로 들어간 점(대각선 위, 25 + c/2)이 모서리(100,100)에 닿을 때
  const c = R/2*(1-k);
  return 100 / (25 + c/2);
}
// p: 시간 진행도 0→1, 반환 k: 곡률 100%→0% (p에는 확대 속도가 이미 반영된 크기 진행도를 넘김)
function kFor(p, mode){
  p = Math.min(1, Math.max(0, p));
  if(mode === 'log'){
    // 로그스케일: 초반에 빠르게 펴짐. log10(1+9p)는 0→1
    return 1 - Math.log10(1 + 9*p);
  }
  if(mode === 'log-rev'){
    // 역로그스케일: 후반에 빠르게 펴짐. 초반엔 천천히, 끝에서 급히 펴짐
    return Math.log10(1 + 9*(1 - p));
  }
  return 1 - p; // 선형: 일정하게
}
// p: 시간 진행도 0→1, 반환 ps: 크기 진행도 0→1
function scaleFor(p, mode){
  p = Math.min(1, Math.max(0, p));
  if(mode === 'log'){
    // 로그스케일: 초반에 빠르게 커짐
    return Math.log10(1 + 9*p);
  }
  if(mode === 'log-rev'){
    // 역로그스케일: 후반에 빠르게 커짐
    return 1 - Math.log10(1 + 9*(1 - p));
  }
  return p; // 선형: 일정하게
}
function kmodeNow(){
  const el = document.querySelector('input[name="kmode"]:checked');
  return el ? el.value : 'linear';
}
function smodeNow(){
  const el = document.querySelector('input[name="smode"]:checked');
  return el ? el.value : 'linear';
}

function updateStatic(){
  layers.forEach(l => l.removeAttribute('transform')); // 배율은 별마다 개별 적용
  $('base').setAttribute('d', pathFor(1));            // 미사용 참조 대비 시작 모양 유지
  $('kOut').textContent = '100% → 0%';

  const guide = $('guide');
  guide.innerHTML = '';
  if($('showGuide').checked){
    // 조절점 가이드는 시작 모양(100%, c=0) 기준
    const c = 0;
    const pts = [[0,-R],[c,-c],[R,0],[c,c],[0,R],[-c,c],[-R,0],[-c,-c],[0,-R]];
    guide.innerHTML = `<polyline points="${pts.map(p=>p.map(f).join(',')).join(' ')}"/>` +
      [[c,-c],[c,c],[-c,c],[-c,-c]].map(p=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2.5" fill="var(--muted)" stroke="none"/>`).join('');
  }
  const kLabel = kmodeNow() === 'log' ? '로그스케일' : kmodeNow() === 'log-rev' ? '역로그스케일' : '선형';
  const sLabel = smodeNow() === 'log' ? '로그스케일' : smodeNow() === 'log-rev' ? '역로그스케일' : '선형';
  $('code').textContent =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <!-- 확대: ${sLabel} / 곡률: ${kLabel} (100%→0%로 펴지며 커짐) -->
  <path fill="${COLORS[0]}" d="${pathFor(1)}"/>
  <!-- 끝: 곡률 0% d="${pathFor(0)}" -->
</svg>`;
}

function render(){
  rafId = null;
  const now = document.timeline.currentTime ?? performance.now();
  paintFrame(now);
  if(playing) rafId = requestAnimationFrame(render);
}

// now 시점의 모든 세대를 그리고, 다 자란 세대보다 오래된 세대를 정리
function paintFrame(now){
  const kmode = kmodeNow(), smode = smodeNow();
  let maxDone = -1;
  for(let gi = 0; gi < gens.length; gi++){
    const gen = gens[gi];
    let pRaw = (now - gen.t0) / gen.dur;
    if(pRaw < 0) pRaw = 0;
    if(pRaw > 1) pRaw = 1;
    const ps = scaleFor(pRaw, smode); // 크기 진행도: 시간→크기
    const k = kFor(ps, kmode);        // 곡률: 크기에 동기화 (커질수록 100%→0%)
    const dd = pathFor(k);
    const s = coverFor(k) * ps;
    for(const el of gen.els){
      el.setAttribute('d', dd);
      el.style.transform = `scale(${s})`;
    }
    if(pRaw >= 1){
      const dEnd = pathFor(0), sEnd = coverFor(0);
      for(const el of gen.els){
        el.setAttribute('d', dEnd);
        el.style.transform = `scale(${sEnd})`;
      }
      maxDone = gi;
    }
  }
  // 다 자란 세대 중 가장 나중인 세대보다 오래된 세대들은 가려지므로 삭제 (다 자란 세대 자체는 배경으로 유지)
  if(maxDone > 0) gens.splice(0, maxDone).forEach(g => g.els.forEach(el => el.remove()));
}

function spawn(){
  // 상한에 닿으면 기존 별을 지우지 않고 이번 생성만 건너뜀 (지우면 아직 덮이지 않은 별이 사라짐)
  if(gens.length >= MAX_STARS) return;
  const color = COLORS[colorIdx];
  colorIdx = (colorIdx + 1) % COLORS.length;
  const dur = +$('g').value;
  const t0 = document.timeline.currentTime ?? performance.now();
  const gen = { els: [], t0, dur };
  for(const lay of layers){
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pathFor(1)); // 100%로 시작
    el.setAttribute('fill', color);
    el.style.transform = 'scale(0)';
    lay.appendChild(el);
    gen.els.push(el);
  }
  gens.push(gen);
}

function tick(){
  spawn();
  timer = setTimeout(tick, +$('t').value);
}
function start(){
  if(!timer){ tick(); }
  if(rafId == null){ rafId = requestAnimationFrame(render); }
}
function stop(){
  clearTimeout(timer); timer = null;
  if(rafId != null){ cancelAnimationFrame(rafId); rafId = null; }
}

document.querySelectorAll('input[name="kmode"], input[name="smode"]').forEach(el => el.addEventListener('change', () => {
  updateStatic();
  if(!playing) paintFrame(pauseAt); // 일시정지 중에도 모드 전환을 즉시 미리보기
}));
$('showGuide').addEventListener('input', updateStatic);
$('t').addEventListener('input', () => {
  $('tOut').textContent = ($('t').value/1000).toFixed(2) + '초';
  // 새 별을 바로 만들지 않고 다음 예약만 새 간격으로 다시 잡음
  if(playing){ clearTimeout(timer); timer = setTimeout(tick, +$('t').value); }
});
$('g').addEventListener('input', () => {
  $('gOut').textContent = ($('g').value/1000).toFixed(2) + '초';
});
$('play').addEventListener('click', () => {
  playing = !playing;
  $('play').textContent = playing ? '일시정지' : '재생';
  if(playing){
    // 일시정지 동안 흐른 만큼 시작 시각을 뒤로 밀어 별 크기를 얼림
    const now = document.timeline.currentTime ?? performance.now();
    gens.forEach(g => g.t0 += now - pauseAt);
    start();
  }else{
    pauseAt = document.timeline.currentTime ?? performance.now();
    stop();
  }
});
document.addEventListener('visibilitychange', () => {
  if(!playing) return;
  // 백그라운드에선 생성만 멈추고, 별 진행은 시간을 그대로 둬서 복귀 시 점프(기존 WAAPI 동작과 동일)
  if(document.hidden){ clearTimeout(timer); timer = null; if(rafId != null){ cancelAnimationFrame(rafId); rafId = null; } }
  else{ start(); }
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('code').textContent); $('copy').textContent = '복사됨'; }
  catch(e){ $('copy').textContent = '직접 선택해 복사하세요'; }
  setTimeout(() => $('copy').textContent = '코드 복사', 1500);
});

updateStatic();
start();
</script>
</body>
</html>
