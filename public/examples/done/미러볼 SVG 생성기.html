<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>미러볼 생성기</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1f2328;
            --muted: #5d6670;
            --line: #d6dae0;
            --accent: #2f5d8a;
            --stage: #e6e9ee
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #15181c;
                --panel: #1d2126;
                --text: #e7eaee;
                --muted: #9aa3ad;
                --line: #333a42;
                --accent: #7fb0e0;
                --stage: #0f1215
            }
        }

        :root[data-theme="dark"] {
            --bg: #15181c;
            --panel: #1d2126;
            --text: #e7eaee;
            --muted: #9aa3ad;
            --line: #333a42;
            --accent: #7fb0e0;
            --stage: #0f1215
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5
        }

        .wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px 16px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 20px
        }

        @media (max-width:760px) {
            .wrap {
                grid-template-columns: 1fr
            }
        }

        /* 넓은 화면: 패널이 길어도 미러볼이 화면에 남아 바로 클릭할 수 있게 상단 고정 */
        @media (min-width:761px) {
            .stage {
                position: sticky;
                top: 20px;
                align-self: start
            }
        }

        .stage {
            background: var(--stage);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 300px
        }

        .stage canvas {
            width: 100%;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            display: block
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        h1 {
            font-size: 17px;
            margin: 0
        }

        .row label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted)
        }

        .row label b {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent)
        }

        .colors {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        .colors label {
            flex: 1 1 40%;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        input[type=color] {
            width: 100%;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: none;
            padding: 2px
        }

        .seed {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: var(--muted)
        }

        .seed input {
            width: 90px;
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit
        }

        button {
            font: inherit;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
            cursor: pointer
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .btns .wide {
            grid-column: 1 / -1
        }

        .note {
            font-size: 12px;
            color: var(--muted);
            min-height: 1.2em
        }

        textarea {
            width: 100%;
            height: 90px;
            font: 12px ui-monospace, Menlo, monospace;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            padding: 6px;
            resize: vertical
        }
    </style>
</head>


<body>
    <div class="wrap">
        <div class="stage"><canvas id="stage" title="미러볼을 클릭하면 빛줄기 발사"></canvas></div>
        <div class="panel">
            <h1>미러볼 생성기</h1>
            <div class="row"><label>시점 기울기 (위↔아래) <b id="v-tilt"></b></label><input type="range" id="tilt" min="-90"
                    max="90" step="1" value="-32"></div>
            <div class="row"><label>타일 크기 (위도 간격) <b id="v-step"></b></label><input type="range" id="step" min="3"
                    max="15" step="0.5" value="9.5"></div>
            <div class="row"><label>줄눈 두께 <b id="v-gap"></b></label><input type="range" id="gap" min="0.02" max="0.4"
                    step="0.01" value="0.14"></div>
            <div class="row"><label>타일 폭 편차 <b id="v-jit"></b></label><input type="range" id="jit" min="0" max="0.2"
                    step="0.005" value="0.06"></div>
            <div class="row"><label>행 시작 위치 랜덤 범위 <b id="v-off"></b></label><input type="range" id="off" min="0" max="1"
                    step="0.05" value="1"></div>
            <div class="row"><label>극점광 세기 (표면 원형·남극 중심) <b id="v-pole"></b></label><input type="range" id="pole"
                    min="0" max="3" step="0.05" value="0.3"></div>
            <div class="row"><label>극점광 범위 (남극　각도) <b id="v-poleR"></b></label><input type="range" id="poleR" min="0"
                    max="90" step="1" value="58"></div>
            <div class="row"><label>하부 발광 세기 (줄눈 덮기) <b id="v-veil"></b></label><input type="range" id="veil" min="0"
                    max="1.5" step="0.05" value="0.8"></div>
            <div class="row"><label>하부 발광 범위 <b id="v-veilR"></b></label><input type="range" id="veilR" min="0.05"
                    max="1" step="0.01" value="0.36"></div>
            <div class="row"><label>전체 발광 안개 <b id="v-haze"></b></label><input type="range" id="haze" min="0" max="0.6"
                    step="0.01" value="0.47"></div>
            <div class="row"><label>블룸 (밝은부 번짐) <b id="v-bloom"></b></label><input type="range" id="bloom" min="0"
                    max="1" step="0.05" value="0.3"></div>
            <div class="row"><label>상부 그늘 쏠림 (청록 그늘) <b id="v-teal"></b></label><input type="range" id="teal" min="0"
                    max="1" step="0.01" value="0.6"></div>
            <div class="row"><label>타일별 밝기 편차 <b id="v-tjit"></b></label><input type="range" id="tjit" min="0"
                    max="0.5" step="0.01" value="0"></div>
            <div class="row"><label>은빛 질감 (타일 그라디언트) <b id="v-sheen"></b></label><input type="range" id="sheen" min="0"
                    max="1" step="0.01" value="0.6"></div>
            <div class="row"><label>줄눈 빛줄기 세기 <b id="v-glint"></b></label><input type="range" id="glint" min="0" max="2"
                    step="0.05" value="0.1"></div>
            <div class="row"><label>1회 빛줄기 개수 <b id="v-gcount"></b></label><input type="range" id="gcount" min="1"
                    max="12" step="1" value="6"></div>
            <div class="row"><label>방향 전환 확률 (교차점마다) <b id="v-gturn"></b></label><input type="range" id="gturn" min="0"
                    max="1" step="0.01" value="0.22"></div>
            <div class="row"><label>빛줄기 속도 <b id="v-gspd"></b></label><input type="range" id="gspd" min="0.3" max="2.5"
                    step="0.05" value="2.5"></div>
            <div class="row"><label>출발 전 저속 대기 (0.1×) <b id="v-ghold"></b></label><input type="range" id="ghold" min="0"
                    max="1.5" step="0.01" value="0.14"></div>
            <div class="row"><label>최대 속도까지 가속 시간 <b id="v-gacc"></b></label><input type="range" id="gacc" min="0"
                    max="0.6" step="0.01" value="0.08"></div>
            <div class="row"><label>빛줄기 흰빛 비중 <b id="v-gwhite"></b></label><input type="range" id="gwhite" min="0.3"
                    max="1" step="0.01" value="0.74"></div>
            <div class="row"><label>회전각 <b id="v-rot"></b></label><input type="range" id="rot" min="0" max="359"
                    step="1" value="0"></div>
            <div class="colors">
                <label>타일 색<input type="color" id="tile" value="#dfe4ea"></label>
                <label>줄눈 색<input type="color" id="grout" value="#d3e3e9"></label>
                <label>타일 그늘<input type="color" id="dark" value="#5a8696"></label>
                <label>반사 밝음<input type="color" id="light" value="#eaf7ff"></label>
                <label>발광 색<input type="color" id="glowC" value="#fff3f1"></label>
            </div>
            <div class="seed">시드 <input type="number" id="seed" value="11"></div>
            <div class="btns">
                <button class="primary" id="reroll">다시 생성</button>
                <button id="copy">SVG 복사</button>
                <button id="fire" class="wide">빛줄기 발사</button>
                <button id="play" class="wide">회전 정지</button>
            </div>
            <div class="note" id="note">미러볼을 직접 클릭해도 빛줄기가 발사됩니다.</div>
            <textarea id="code" readonly aria-label="SVG 코드"></textarea>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

        // tsukuyomi.js 미러볼 달과 동일한 반사 모델 (하단 글로우 조명, 극점광은 표면 기준 원형,
        // 상부는 은빛 타일 그늘 + 프레넬 림, 타일 옆면은 밝은 줄눈색으로 이어짐)
        const REF = { amb: 0.30, glow: 1.15, pw: 1.4, njit: 1.2, rim: 0.5, side: [0.5, 0.6, 0.64] };
        const PERIOD = 40; // 1회전 초
        const S = 440, C = 220, R = 200;
        const POLE_LIMIT = 60;  // 이보다 극에 가까운 행으로는 진입하지 않음
        const LON_SPAN = 300;   // 줄눈 경로의 총 경도 이동 한계(극 주변을 여러 바퀴 맴돌지 않게)
        const rad = d => d * Math.PI / 180;
        const f2 = n => n.toFixed(2);
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        function hxRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

        function opts() {
            return {
                tilt: +$("tilt").value, step: +$("step").value, gap: +$("gap").value, jit: +$("jit").value, off: +$("off").value,
                tile: $("tile").value, grout: $("grout").value, dark: $("dark").value, light: $("light").value,
                pole: +$("pole").value, poleR: +$("poleR").value, bloom: +$("bloom").value,
                teal: +$("teal").value, tjit: +$("tjit").value, sheen: +$("sheen").value,
                veil: +$("veil").value, glint: +$("glint").value, gcount: +$("gcount").value, gturn: +$("gturn").value, ghold: +$("ghold").value, gacc: +$("gacc").value, gspd: +$("gspd").value, gwhite: +$("gwhite").value, veilR: +$("veilR").value, haze: +$("haze").value, glowC: $("glowC").value,
                seed: parseInt($("seed").value) || 0
            }
        }

        // 구면 좌표 → 시점 기울기(x축 회전) 적용 → 정사영
        function sys(tilt) { const T = rad(tilt); return { ct: Math.cos(T), st: Math.sin(T) }; }
        function V(lat, lon, s) {
            const la = rad(lat), lo = rad(lon);
            const x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
            return [x, y * s.ct - z * s.st, y * s.st + z * s.ct]
        }
        function Pj(lat, lon, s) { const q = V(lat, lon, s); return [C + R * q[0], C - R * q[1]] }

        // 타일 토폴로지 + 반사 요동 (난수 호출 순서는 tsukuyomi.js와 동일: 행마다 폭 n개 → 오프셋 1개, 요동·밝기 편차는 별도 난수열)
        function buildTiles(o) {
            const rnd = mulberry32(o.seed), rndR = mulberry32((o.seed ^ 0x85ebca6b) >>> 0), rndB = mulberry32((o.seed ^ 0x27d4eb2f) >>> 0);
            const tiles = [];
            const rows = Math.ceil(180 / o.step);
            for (let i = 0; i < rows; i++) {
                const lat = -90 + i * o.step, lat2 = Math.min(90, lat + o.step), mid = (lat + lat2) / 2;
                const n = Math.max(4, Math.round(360 * Math.cos(rad(mid)) / o.step));
                const ws = []; let sum = 0;
                for (let j = 0; j < n; j++) { const w = 1 + (rnd() * 2 - 1) * o.jit; ws.push(w); sum += w }
                const lonStart = (rnd() * o.off) * (360 / n);
                let lon = lonStart;
                for (let j = 0; j < n; j++) {
                    const tw = ws[j] * 360 / sum;
                    tiles.push({
                        lat, lat2, mid, lon0: lon, tw,
                        jLat: (rndR() * 2 - 1) * REF.njit, jLon: (rndR() * 2 - 1) * REF.njit,
                        jB: rndB() * 2 - 1   // 타일별 반사 밝기 편차(상부 청회색 구간에만 적용)
                    });
                    lon += tw;
                }
            }
            return tiles;
        }

        // 반사 밝기 → 정면RGB·측면RGB (n: 시점계 법선, mid: 타일 위도, jB: 타일 밝기 편차)
        function lit(n, mid, o, jB) {
            const DR = hxRGB(o.dark), TR = hxRGB(o.tile), LR = hxRGB(o.light), GR = hxRGB(o.grout);
            const nz = Math.max(0, n[2]);
            const bb = (REF.amb + REF.glow * Math.pow(Math.max(0, -n[1]), REF.pw)) * (0.45 + 0.55 * nz);
            const pr = Math.max(0.001, rad(o.poleR));
            const pu = Math.max(0, 1 - rad(mid + 90) / pr); // 남극 각거리 (0=극점)
            const f = pu * pu * (3 - 2 * pu); // 원형 폴오프
            const b = bb + o.pole * f * 1.2;
            // 상부(b<1)는 은빛 타일: 그늘(dark) → tile. teal만큼 그늘 쪽으로 균일하게 쏠리고 tjit만큼 타일별로 밝아지며,
            // 가장자리로 갈수록 프레넬로 밝아진다(림).
            let fr, fg, fb;
            if (b < 1) {
                const e = 1 - nz, u = clamp((Math.max(0, b) + REF.rim * e * e * e) * (1 - o.teal) + o.tjit * (jB + 1) * 0.5, 0, 1);
                fr = DR[0] + (TR[0] - DR[0]) * u; fg = DR[1] + (TR[1] - DR[1]) * u; fb = DR[2] + (TR[2] - DR[2]) * u;
            } else {
                const u = Math.min(1, b - 1);
                fr = TR[0] + (LR[0] - TR[0]) * u; fg = TR[1] + (LR[1] - TR[1]) * u; fb = TR[2] + (LR[2] - TR[2]) * u;
            }
            // 타일 옆면(줄눈 쪽 경사면): 상부는 밝은 줄눈색, 빛 비침(b≥1) 쪽은 그늘로 이어진다.
            const sd = REF.side, w = clamp((1.2 - b) / 0.4, 0, 1);
            const side = [0, 1, 2].map(i => { const d = [fr, fg, fb][i] * sd[i]; return d + (GR[i] - d) * w; });
            return { b, f, w, front: [fr, fg, fb], side };
        }
        // 은빛 질감(sheen): 타일 대각선으로 그늘 → 본색 → 하이라이트. null이면 단색.
        // 일부 타일(tjit에 비례)만 방향을 뒤집어 반짝임을 흩뜨린다. tjit 0이면 전부 같은 방향.
        function sheenSpec(t, fx, L, o) {
            if (!(L.w > 0 && o.sheen > 0)) return null;
            const [p0, p1] = t.jB > 1 - 4 * o.tjit ? [fx[1], fx[3]] : [fx[0], fx[2]];
            const c = L.front, sw = L.w * o.sheen, hw = 0.5 * sw;
            return {
                p0, p1, stops: [[0, c.map(v => v * (1 - 0.3 * sw))], [0.5, c], [1, c.map((v, i) => v + ([244, 251, 255][i] - v) * hw)]]
            };
        }
        // 실루엣 림: 가장자리 10%가 밝은 청백으로 번진다 (r0.74R → R)
        const RIM_STOPS = [[0, 226, 240, 245, 0], [0.6, 226, 240, 245, 0.3], [0.9, 234, 246, 248, 0.8], [1, 238, 247, 249, 0.55]];
        // 하부 발광 베일: 남극(또는 하단 가장자리)에서 퍼지는 방사형 덮개.
        // 핵심부는 거의 불투명해 줄눈·하이라이트 선까지 덮고, 꼬리는 볼 전체에 옅은 안개로 남는다.
        function veilSpec(o) {
            const s = sys(o.tilt);
            const cy = C + R * (s.st < 0 ? s.ct : 1); // 남극이 보이면 그 투영점, 아니면 하단 가장자리
            const rg = R * 2.1;
            const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
            const stops = [];
            for (let k = 0; k <= 16; k++) {
                const t = k / 16;
                const u = t / Math.max(0.02, o.veilR);
                const core = Math.exp(-2.2 * u * u);                 // 부드러운 가우시안 핵심부 (경계선 없음)
                const skirt = 0.35 * (1 - sm(0, 1, u * 0.55));       // 핵심부 바깥으로 넓게 이어지는 자락
                const tail = o.haze * (1 - 0.5 * t);                 // 볼 전체 안개
                const a = 1 - (1 - o.veil * core) * (1 - o.veil * skirt) * (1 - tail);
                stops.push([t, Math.min(0.96, Math.max(0, a))]);
            }
            const [r, g, b] = hxRGB(o.glowC);
            return { cx: C, cy, rg, stops, r, g, b, on: o.veil > 0 || o.haze > 0 };
        }
        const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

        // ---- 캔버스 미리보기 (tsukuyomi.js 미러볼 본체와 동일 렌더러) ----
        const cv = $("stage"), mctx = cv.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        cv.width = S * dpr; cv.height = S * dpr; mctx.scale(dpr, dpr);
        const off = document.createElement("canvas"); off.width = S * dpr; off.height = S * dpr;
        const og = off.getContext("2d"); og.scale(dpr, dpr);
        const off2 = document.createElement("canvas"); off2.width = S * dpr; off2.height = S * dpr;
        const og2 = off2.getContext("2d"); og2.scale(dpr, dpr);
        const off3 = document.createElement("canvas"); off3.width = S * dpr; off3.height = S * dpr;
        const og3 = off3.getContext("2d"); og3.scale(dpr, dpr);

        let tiles = [], rotDeg = 0, playing = true, last = performance.now();

                mctx.save();
                mctx.beginPath(); mctx.arc(C, C, R, 0, Math.PI * 2); mctx.clip();
                mctx.globalCompositeOperation = "lighter";
                mctx.filter = `blur(${(4 + o.bloom * 10).toFixed(1)}px)`;
                mctx.globalAlpha = o.bloom * 0.65;
                mctx.drawImage(off2, 0, 0, S, S);
                mctx.restore();
            }
            drawStreaks(o);
        }

        // ---- SVG 스냅샷 (현재 회전각 기준, 반사·은빛 질감·림·극점광·색상 포함) ----
        function buildSVG(o) {
            const tops = [], bots = [], tpolys = [], cpolys = [], grads = [];
            const ptsAttr = fx => fx.map(q => `${f2(q[0])},${f2(q[1])}`).join(" ");
            for (const { pts, cx, cy, fx, L, sh } of visibleTiles(o)) {
                const rr = (Math.hypot(pts[0][0] - cx, pts[0][1] - cy) + Math.hypot(pts[1][0] - cx, pts[1][1] - cy)
                    + Math.hypot(pts[2][0] - cx, pts[2][1] - cy) + Math.hypot(pts[3][0] - cx, pts[3][1] - cy)) / 4 || 1;
                const sw = f2(Math.max(0.4, o.gap * rr));
                let fill = css(L.front);
                if (sh) {
                    const id = "s" + grads.length;
                    grads.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f2(sh.p0[0])}" y1="${f2(sh.p0[1])}" x2="${f2(sh.p1[0])}" y2="${f2(sh.p1[1])}">`
                        + sh.stops.map(([t, c]) => `<stop offset="${t}" stop-color="${css(c)}"/>`).join("") + `</linearGradient>`);
                    fill = `url(#${id})`;
                }
                tpolys.push(`<polygon points="${ptsAttr(fx)}" fill="${fill}" stroke="${css(L.side)}" stroke-width="${sw}"/>`);
                if (L.f > 0.15) cpolys.push(`<polygon points="${ptsAttr(fx)}" fill="${css(L.front)}"/>`);
                tops.push(`M${f2(fx[3][0])} ${f2(fx[3][1])}L${f2(fx[2][0])} ${f2(fx[2][1])}`);
                bots.push(`M${f2(fx[0][0])} ${f2(fx[0][1])}L${f2(fx[1][0])} ${f2(fx[1][1])}`);
            }
            const glowOn = o.bloom > 0 && cpolys.length > 0;
            let defs = `<defs><clipPath id="ball"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath>` + grads.join("");
            if (glowOn) defs += `<filter id="capBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${(3 + o.bloom * 5).toFixed(1)}"/></filter>`;
            // 림: 캔버스의 안쪽 반지름 0.74R 그라디언트를 0~R 오프셋으로 환산
            defs += `<radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="${C}" cy="${C}" r="${R}">`
                + RIM_STOPS.map(([t, r, g, b, a]) => `<stop offset="${(0.74 + 0.26 * t).toFixed(4)}" stop-color="rgb(${r},${g},${b})" stop-opacity="${a}"/>`).join("")
                + `</radialGradient>`;
            const vs = veilSpec(o);
            if (vs.on) defs += `<radialGradient id="veil" gradientUnits="userSpaceOnUse" cx="${f2(vs.cx)}" cy="${f2(vs.cy)}" r="${f2(vs.rg)}">`
                + vs.stops.map(([t, a]) => `<stop offset="${t.toFixed(4)}" stop-color="rgb(${vs.r},${vs.g},${vs.b})" stop-opacity="${a.toFixed(3)}"/>`).join("")
                + `</radialGradient>`;
            let G = null;
            if (streaks.length && o.glint > 0) {
                G = streakGeom(o);
                if (G.segs.length) defs += `<filter id="glintHalo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${f2(G.hw * 0.45)}"/></filter>`;
            }
            defs += `</defs>`;
            const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">`,
                defs,
                `<circle cx="${C}" cy="${C}" r="${R}" fill="${o.grout}"/>`, `<g clip-path="url(#ball)">`];
            for (const p of tpolys) out.push(p);
            out.push(`<path d="${tops.join("")}" stroke="rgb(222,244,248)" stroke-opacity="0.9" stroke-width="1.2" fill="none"/>`);
            out.push(`<path d="${bots.join("")}" stroke="#000000" stroke-opacity="0.2" stroke-width="1" fill="none"/>`);
            out.push(`<circle cx="${C}" cy="${C}" r="${R}" fill="url(#rim)"/>`);
            if (vs.on) out.push(`<circle cx="${C}" cy="${C}" r="${R}" fill="url(#veil)"/>`);
            if (glowOn) out.push(`<g filter="url(#capBlur)" opacity="${(o.bloom * 0.65).toFixed(3)}" style="mix-blend-mode:screen">${cpolys.join("")}</g>`);
            if (G && G.segs.length) {
                const line = (g, key, k, wd) => `<line x1="${f2(g.x0)}" y1="${f2(g.y0)}" x2="${f2(g.x1)}" y2="${f2(g.y1)}" stroke="${pm(g[key], g.a * k)}" stroke-width="${f2(wd)}"/>`;
                out.push(`<g style="mix-blend-mode:screen" stroke-linecap="round">`);
                out.push(`<g filter="url(#glintHalo)">${G.segs.map(g => line(g, "halo", 0.9, G.hw)).join("")}</g>`);
                out.push(`${G.segs.map(g => line(g, "halo", 0.85, G.mw)).join("")}${G.segs.map(g => line(g, "core", 1.15, G.cw)).join("")}`);
                out.push(`</g>`);
            }
            out.push(`</g>`, `</svg>`);
            return out.join("\n");
        }

        function labels(o) {
            $("v-tilt").textContent = (o.tilt > 0 ? "위에서 " : o.tilt < 0 ? "아래에서 " : "정면 ") + Math.abs(o.tilt) + "°";
            $("v-step").textContent = o.step + "°";
            $("v-gap").textContent = Math.round(o.gap * 100) + "%";
            $("v-jit").textContent = "±" + (o.jit * 100).toFixed(1) + "%";
            $("v-off").textContent = Math.round(o.off * 100) + "%";
            $("v-pole").textContent = o.pole.toFixed(2) + "×";
            $("v-poleR").textContent = o.poleR + "°";
            $("v-veil").textContent = o.veil.toFixed(2) + "×";
            $("v-veilR").textContent = Math.round(o.veilR * 100) + "%";
            $("v-haze").textContent = Math.round(o.haze * 100) + "%";
            $("v-bloom").textContent = Math.round(o.bloom * 100) + "%";
            $("v-teal").textContent = Math.round(o.teal * 100) + "%";
            $("v-tjit").textContent = Math.round(o.tjit * 100) + "%";
            $("v-sheen").textContent = Math.round(o.sheen * 100) + "%";
            $("v-glint").textContent = o.glint.toFixed(2) + "×";
            $("v-gcount").textContent = o.gcount + "개";
            $("v-gturn").textContent = Math.round(o.gturn * 100) + "%";
            $("v-ghold").textContent = o.ghold.toFixed(2) + "초";
            $("v-gacc").textContent = o.gacc.toFixed(2) + "초";
            $("v-gspd").textContent = o.gspd.toFixed(2) + "×";
            $("v-gwhite").textContent = Math.round(o.gwhite * 100) + "%";
            $("v-rot").textContent = Math.round(rotDeg) + "°";
        }

        function refresh(rebuild) {
            const o = opts();
            if (rebuild) { tiles = buildTiles(o); buildRows(); }
            labels(o);
            drawFrame(o);
            if (!playing) $("code").value = buildSVG(o);
        }

        // 회전을 멈춰도 빛줄기는 계속 흐른다 (SVG 복사 시 그 순간의 빛줄기가 함께 담김)
        function loop(t) {
            const o = opts();
            const dt = Math.min(0.1, (t - last) / 1000); last = t;
            const hadStreaks = streaks.length > 0;
            updateStreaks(o, dt);
            if (playing) {
                rotDeg = (rotDeg + dt * 360 / PERIOD) % 360;
                $("rot").value = Math.round(rotDeg);
                labels(o);
                drawFrame(o);
            } else if (hadStreaks || streaks.length) {
                drawFrame(o);
            }
            requestAnimationFrame(loop);
        }

        ["tilt", "step", "gap", "jit", "off", "tile", "grout", "dark", "light", "pole", "poleR", "veil", "veilR", "haze", "glowC", "bloom", "teal", "tjit", "sheen", "glint", "gcount", "gturn", "ghold", "gacc", "gspd", "gwhite", "seed"].forEach(id =>
            $(id).addEventListener("input", () => { $("note").textContent = ""; refresh(true); }));
        $("rot").addEventListener("input", () => {
            rotDeg = +$("rot").value;
            if (playing) togglePlay();
            refresh(false);
        });
        $("reroll").addEventListener("click", () => { $("seed").value = Math.floor(Math.random() * 100000); refresh(true); });
        $("copy").addEventListener("click", async () => {
            const svg = buildSVG(opts());
            $("code").value = svg;
            try { await navigator.clipboard.writeText(svg); $("note").textContent = `SVG 코드를 복사했습니다. (회전각 ${Math.round(rotDeg)}°)` }
            catch (e) { $("code").select(); $("note").textContent = "자동 복사가 막혀 있어 코드를 선택해 두었습니다. 직접 복사하세요." }
        });
        function togglePlay() {
            playing = !playing;
            $("play").textContent = playing ? "회전 정지" : "회전 재생";
            if (!playing) $("code").value = buildSVG(opts());
        }
        $("play").addEventListener("click", togglePlay);
        $("fire").addEventListener("click", () => fireBurst(opts()));

        // 미러볼 직접 클릭 → 빛줄기 발사 (tsukuyomi.js의 달 클릭과 동일 트리거). 볼 위에서만 포인터 커서.
        function onBall(e) {
            const r = cv.getBoundingClientRect();
            const x = (e.clientX - r.left) * S / r.width, y = (e.clientY - r.top) * S / r.height;
            return (x - C) ** 2 + (y - C) ** 2 <= R * R;
        }
        cv.addEventListener("pointerdown", e => { if (e.button <= 0 && onBall(e)) fireBurst(opts()); });
        cv.addEventListener("pointermove", e => { cv.style.cursor = onBall(e) ? "pointer" : ""; });

        refresh(true);
        fireBurst(opts());
        requestAnimationFrame(loop);
    </script>
</body>

</html>
