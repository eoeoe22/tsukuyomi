<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>미러볼 SVG 생성기</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #1f2328;
            --muted: #5d6670;
            --line: #d6dae0;
            --accent: #2f5d8a;
            --stage: #e6e9ee
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #15181c;
                --panel: #1d2126;
                --text: #e7eaee;
                --muted: #9aa3ad;
                --line: #333a42;
                --accent: #7fb0e0;
                --stage: #0f1215
            }
        }

        :root[data-theme="dark"] {
            --bg: #15181c;
            --panel: #1d2126;
            --text: #e7eaee;
            --muted: #9aa3ad;
            --line: #333a42;
            --accent: #7fb0e0;
            --stage: #0f1215
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5
        }

        .wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px 16px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 20px
        }

        @media (max-width:760px) {
            .wrap {
                grid-template-columns: 1fr
            }
        }

        .stage {
            background: var(--stage);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 300px
        }

        .stage svg {
            width: 100%;
            max-width: 520px;
            height: auto;
            display: block
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        h1 {
            font-size: 17px;
            margin: 0
        }

        .row label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted)
        }

        .row label b {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent)
        }

        .colors {
            display: flex;
            gap: 12px
        }

        .colors label {
            flex: 1;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        input[type=color] {
            width: 100%;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: none;
            padding: 2px
        }

        .seed {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: var(--muted)
        }

        .seed input {
            width: 90px;
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit
        }

        button {
            font: inherit;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
            cursor: pointer
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .note {
            font-size: 12px;
            color: var(--muted);
            min-height: 1.2em
        }

        textarea {
            width: 100%;
            height: 90px;
            font: 12px ui-monospace, Menlo, monospace;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            padding: 6px;
            resize: vertical
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="stage" id="stage"></div>
        <div class="panel">
            <h1>미러볼 SVG 생성기</h1>
            <div class="row"><label>시점 기울기 (위↔아래) <b id="v-tilt"></b></label><input type="range" id="tilt" min="-90"
                    max="90" step="1" value="0"></div>
            <div class="row"><label>타일 크기 (위도 간격) <b id="v-step"></b></label><input type="range" id="step" min="3"
                    max="15" step="0.5" value="6"></div>
            <div class="row"><label>줄눈 두께 <b id="v-gap"></b></label><input type="range" id="gap" min="0.02" max="0.4"
                    step="0.01" value="0.14"></div>
            <div class="row"><label>타일 폭 편차 <b id="v-jit"></b></label><input type="range" id="jit" min="0" max="0.2"
                    step="0.005" value="0.06"></div>
            <div class="row"><label>행 시작 위치 랜덤 범위 <b id="v-off"></b></label><input type="range" id="off" min="0" max="1"
                    step="0.05" value="1"></div>
            <div class="colors">
                <label>타일 색<input type="color" id="tile" value="#dfe4ea"></label>
                <label>줄눈 색<input type="color" id="grout" value="#6b7480"></label>
            </div>
            <div class="seed">시드 <input type="number" id="seed" value="11"></div>
            <div class="btns">
                <button class="primary" id="reroll">다시 생성</button>
                <button id="copy">SVG 복사</button>
            </div>
            <div class="note" id="note"></div>
            <textarea id="code" readonly aria-label="SVG 코드"></textarea>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }

        function build(o) {
            const R = 200, C = 220, rnd = mulberry32(o.seed);
            const rad = d => d * Math.PI / 180, T = rad(o.tilt), ct = Math.cos(T), st = Math.sin(T);
            // 구면 좌표 → 시점 기울기(x축 회전) 적용 → 정사영
            const v = (lat, lon) => {
                const la = rad(lat), lo = rad(lon);
                const x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
                return [x, y * ct - z * st, y * st + z * ct]
            };
            const p = (lat, lon) => { const q = v(lat, lon); return [C + R * q[0], C - R * q[1]] };
            const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">`,
                `<defs><clipPath id="ball"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath></defs>`,
                `<circle cx="${C}" cy="${C}" r="${R}" fill="${o.grout}"/>`, `<g clip-path="url(#ball)">`];
            const rows = Math.ceil(180 / o.step);
            for (let i = 0; i < rows; i++) {
                const lat = -90 + i * o.step, lat2 = Math.min(90, lat + o.step), mid = (lat + lat2) / 2;
                const n = Math.max(4, Math.round(360 * Math.cos(rad(mid)) / o.step));
                // 한 바퀴 전체 타일 폭(편차 포함)을 만들고 합이 360°가 되도록 정규화
                const ws = []; let sum = 0;
                for (let j = 0; j < n; j++) { const w = 1 + (rnd() * 2 - 1) * o.jit; ws.push(w); sum += w }
                let lon = (rnd() * o.off) * (360 / n);
                for (let j = 0; j < n; j++) {
                    const tw = ws[j] * 360 / sum;
                    if (v(mid, lon + tw / 2)[2] > 0) {            // 보이는 면(앞쪽)만 그림
                        const pts = [p(lat, lon), p(lat, lon + tw), p(lat2, lon + tw), p(lat2, lon)];
                        const cx = pts.reduce((s, q) => s + q[0], 0) / 4, cy = pts.reduce((s, q) => s + q[1], 0) / 4;
                        const k = 1 - o.gap;
                        out.push(`<polygon points="${pts.map(([x, y]) => `${(cx + (x - cx) * k).toFixed(2)},${(cy + (y - cy) * k).toFixed(2)}`).join(" ")}" fill="${o.tile}"/>`);
                    }
                    lon += tw;
                }
            }
            out.push(`</g>`, `</svg>`);
            return out.join("\n");
        }

        function opts() {
            return {
                tilt: +$("tilt").value, step: +$("step").value, gap: +$("gap").value, jit: +$("jit").value, off: +$("off").value,
                tile: $("tile").value, grout: $("grout").value, seed: parseInt($("seed").value) || 0
            }
        }

        function render() {
            const o = opts();
            $("v-tilt").textContent = (o.tilt > 0 ? "위에서 " : o.tilt < 0 ? "아래에서 " : "정면 ") + Math.abs(o.tilt) + "°";
            $("v-step").textContent = o.step + "°";
            $("v-gap").textContent = Math.round(o.gap * 100) + "%";
            $("v-jit").textContent = "±" + (o.jit * 100).toFixed(1) + "%";
            $("v-off").textContent = Math.round(o.off * 100) + "%";
            const svg = build(o);
            $("stage").innerHTML = svg;
            $("code").value = svg;
        }

        ["tilt", "step", "gap", "jit", "off", "tile", "grout", "seed"].forEach(id => $(id).addEventListener("input", render));
        $("reroll").addEventListener("click", () => { $("seed").value = Math.floor(Math.random() * 100000); render() });
        $("copy").addEventListener("click", async () => {
            try { await navigator.clipboard.writeText($("code").value); $("note").textContent = "SVG 코드를 복사했습니다." }
            catch (e) { $("code").select(); $("note").textContent = "자동 복사가 막혀 있어 코드를 선택해 두었습니다. 직접 복사하세요." }
        });
        render();
    </script>
</body>

</html>
